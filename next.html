-left:3px solid var(--ink);background:var(--soft);font-size:13px}.energy{margin:10px 0 16px;font-size:13px;color:var(--muted)}.energy button{margin:6px 6px 0 0;min-height:32px;padding:6px 10px;font-size:12px;background:transparent;color:var(--ink);border:1px solid var(--line)}.energy button.active{font-weight:800;box-shadow:inset 0 0 0 1px var(--ink)}.capacity{margin:10px 0 16px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:13px}.capacity b{letter-spacing:.04em}.boundary{margin:10px 0 16px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:13px}.boundary button{margin:8px 6px 0 0;min-height:32px;padding:6px 10px;font-size:12px;background:transparent;color:var(--ink);border:1px solid var(--line)}.startday{margin:10px 0 16px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:13px}.startday button{margin:8px 6px 0 0;min-height:32px;padding:6px 10px;font-size:12px;background:transparent;color:var(--ink);border:1px solid var(--line)}.carry{margin:10px 0 16px;padding:12px;border-left:3px solid var(--ink);background:var(--soft);font-size:13px}.stale{margin-top:8px}.stale button{margin:6px 6px 0 0;min-height:30px;padding:5px 9px;font-size:12px;background:transparent;color:var(--ink);border:1px solid var(--line)}.cleanup{margin:10px 0 16px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:13px}.cleanup button{margin:8px 6px 0 0;min-height:30px;padding:5px 9px;font-size:12px;background:transparent;color:var(--ink);border:1px solid var(--line)}.tomorrow{margin:10px 0 16px;padding:12px;border-left:3px solid var(--ink);background:var(--soft);font-size:13px}.error{color:#8b2f2f}.footer{margin-top:45px;color:var(--muted);font-size:13px}@media(max-width:520px){.actions button{width:100%}.hint{order:2}}</style></head><body><main class="wrap"><div class="brand">RUNLU</div><select class="next-lang language-select" data-runlu-language-select aria-label="Choose site language"><option value="en">English</option><option value="zh">中文</option><option value="fr">Français</option><option value="es">Español</option></select><section class="hero"><h1>NEXT</h1><p class="tag">Too much on your mind? <strong>Know what's next.</strong></p><p class="sub">Don't build another list. Tell NEXT what's competing for your attention and let it choose the next useful move.</p></section><section class="panel"><textarea id="dump" placeholder="What's on your mind?&#10;&#10;Example: 发布V7，开发NEXT，orders pick up，cut carpet，Wood's Homes 清洁"></textarea><div class="actions"><span id="status" class="hint">Runs locally first. No paid AI required.</span><button id="sort">Ask NEXT →</button></div></section><section id="results" hidden><div id="brief" class="brief"></div><div id="focus" class="focus"></div><div id="quick" class="quick"></div><div id="signal" class="signal" hidden></div><div id="momentum" class="momentum" hidden></div><div id="mode" class="mode" hidden></div><div id="guard" class="guard" hidden></div><div id="session" class="session" hidden></div><div id="recovered" class="recovered" hidden></div><div id="outcome" class="outcome" hidden></div><div id="insight" class="insight" hidden></div><div id="energy" class="energy"></div><div id="capacity" class="capacity" hidden></div><div id="boundary" class="boundary" hidden></div><div id="startday" class="startday" hidden></div><div id="carry" class="carry" hidden></div><div id="cleanup" class="cleanup" hidden></div><div id="tomorrow" class="tomorrow" hidden></div><p id="summary" class="summary"></p><div class="nextCard"><div class="label">DO NOW</div><strong id="nowText"></strong><p id="nowReason" class="reason"></p><button id="done" class="secondary" style="color:white;border-color:#666">Done ✓</button></div><div id="groups"></div><button id="reset" class="secondary">Start over</button></section><div class="footer">RUNLU NEXT · V0.38 · Tomorrow Preview Agent</div></main><script>
const API="https://ekrnknlawekeoszzkamd.supabase.co/functions/v1/runlu-next-ai";const $=s=>document.querySelector(s),dump=$("#dump"),results=$("#results"),groups=$("#groups"),status=$("#status");let plan=null;let backlog=[];let prefs={};let showParked=false;let focusSession=null;let focusTimer=null;let recovered=[];let focusOutcome=null;let energy=localStorage.getItem("runlu-next-energy")||"normal";let closedForToday=localStorage.getItem("runlu-next-closed-day")===new Date().toDateString();
const esc=s=>{const d=document.createElement("div");d.textContent=s||"";return d.innerHTML};
function row(x){return '<div class="task"><strong>'+esc(x.task)+'</strong><div class="reason">'+esc(x.reason)+'</div></div>'}
function collectPlan(p){if(!p)return[];return [p.do_now,...(p.next||[]),...(p.later||[]),...(p.remember||[]),...(p.projects||[])].filter(x=>x&&x.task)}
function saveBacklog(){localStorage.setItem("runlu-next-backlog",JSON.stringify(backlog.slice(0,60)))}
function keyFor(task){return String(task||"").toLowerCase().replace(/\d+/g,"#").replace(/[^a-z\u4e00-\u9fff#]+/g," ").trim().split(/\s+/).slice(0,4).join(" ")}
function learn(task,kind,meta={}){const k=keyFor(task);if(!k)return;prefs[k]=prefs[k]||{later:0,waiting:0,done:0};prefs[k][kind]=(prefs[k][kind]||0)+1;if(meta.minutes){prefs[k].focus=prefs[k].focus||{};prefs[k].focus[meta.minutes]=prefs[k].focus[meta.minutes]||{done:0,more:0,blocked:0};prefs[k].focus[meta.minutes][kind]=(prefs[k].focus[meta.minutes][kind]||0)+1}prefs[k].updated=new Date().toISOString();localStorage.setItem("runlu-next-prefs",JSON.stringify(prefs))}
function decayPreferences(){const now=Date.now();for(const [k,p] of Object.entries(prefs)){const age=p.updated?now-new Date(p.updated).getTime():0;if(age>30*864e5){p.later=Math.floor((p.later||0)/2);p.waiting=Math.floor((p.waiting||0)/2);p.done=Math.floor((p.done||0)/2);p.updated=new Date().toISOString()}}localStorage.setItem("runlu-next-prefs",JSON.stringify(prefs))}
function preferenceText(task){const p=prefs[keyFor(task)];if(!p)return"";if(p.later>=2)return" · Learned: you often defer similar items.";if(p.waiting>=2)return" · Learned: similar items are often waiting.";return""}
function preferencePenalty(task){const p=prefs[keyFor(task)];if(!p)return 0;return (p.later||0)*2+(p.waiting||0)*3-(p.done||0)*.25}
function personalizeItems(items){return [...items].sort((a,b)=>preferencePenalty(a)-preferencePenalty(b))}
function explainPersonalChoice(task){const p=prefs[keyFor(task)];if(!p)return"";const done=p.done||0,later=p.later||0,waiting=p.waiting||0;if(done>=2&&done>later+waiting)return" · Personal pattern: you usually complete similar actions when they surface.";if(later+waiting>=2)return" · Personal pattern applied from your previous choices.";return""}
function frictionSignal(){const entries=Object.entries(prefs).map(([k,p])=>({k,...p}));const x=entries.sort((a,b)=>((b.later||0)+(b.waiting||0))-((a.later||0)+(a.waiting||0)))[0];if(!x||((x.later||0)+(x.waiting||0))<3)return null;return x}
function resetPattern(k){delete prefs[k];localStorage.setItem("runlu-next-prefs",JSON.stringify(prefs));render()}
function momentumStats(){const rows=Object.values(prefs);return{done:rows.reduce((n,p)=>n+(p.done||0),0),defer:rows.reduce((n,p)=>n+(p.later||0)+(p.waiting||0),0)}}
function momentumText(){const {done,defer}=momentumStats();if(done+defer<3)return"";if(done>=defer*2)return"Momentum: you’re clearing more actions than you defer.";if(defer>done*2)return"Momentum: several actions are being deferred — NEXT will keep looking for friction.";return"Momentum: your completed and deferred actions are roughly balanced."}
function focusSessionUI(){const el=$("#session");if(!focusSession){el.hidden=true;return}const left=Math.max(0,focusSession.ends-Date.now()),m=Math.floor(left/60000),s=Math.floor((left%60000)/1000);el.hidden=false;el.innerHTML='<b>FOCUS SESSION · '+(focusSession.minutes||25)+' MIN</b><span class="clock">'+String(m).padStart(2,"0")+':'+String(s).padStart(2,"0")+'</span><br>'+esc(focusSession.task)+'<br><button id="endFocus">End session</button><button id="captureThought">Capture thought</button><div class="note">'+(focusSession.note?'Parked thought: '+esc(focusSession.note):'Interruptions can be parked here without changing your current focus.')+'</div>';if(left<=0){clearInterval(focusTimer);focusTimer=null;const finished={task:focusSession.task,minutes:focusSession.minutes||25};releaseCapturedThoughts();focusSession=null;localStorage.removeItem("runlu-next-focus-session");el.innerHTML='<b>FOCUS SESSION COMPLETE</b> · Recheck the result below.';showFocusOutcome(finished.task,finished.minutes)}}
function startFocusSession(minutes=25){if(!plan?.do_now?.task)return;focusSession={task:plan.do_now.task,minutes,started:Date.now(),ends:Date.now()+minutes*60000};localStorage.setItem("runlu-next-focus-session",JSON.stringify(focusSession));if(focusTimer)clearInterval(focusTimer);focusTimer=setInterval(focusSessionUI,1000);focusSessionUI()}
function captureThought(){if(!focusSession)return;const t=prompt("Park the thought. NEXT will keep your current focus unchanged.");if(!t?.trim())return;focusSession.note=focusSession.note?(focusSession.note+" · "+t.trim()):t.trim();localStorage.setItem("runlu-next-focus-session",JSON.stringify(focusSession));focusSessionUI()}
function showFocusOutcome(task,minutes){focusOutcome={task,minutes};const el=$("#outcome");el.hidden=false;el.innerHTML='<b>SESSION CHECK</b> · '+esc(task)+'<br>What happened after '+minutes+' minutes?<br><button data-outcome="done">Done ✓</button><button data-outcome="more">Needs more time</button><button data-outcome="blocked">Blocked</button>'}
function clearFocusOutcome(){focusOutcome=null;$("#outcome").hidden=true}
function releaseCapturedThoughts(){if(!focusSession?.note)return;const thoughts=focusSession.note.split(" · ").map(x=>x.trim()).filter(Boolean);const seen=new Set(backlog.map(x=>x.task.toLowerCase()));recovered=[];for(const task of thoughts){if(!seen.has(task.toLowerCase())){backlog.push({task,reason:"Captured during a focus session.",added:new Date().toISOString()});recovered.push(task);seen.add(task.toLowerCase())}}saveBacklog();if(thoughts.length)status.textContent=thoughts.length+" captured thought"+(thoughts.length===1?"":"s")+" moved to your unfinished items.";renderRecovered()}
function renderRecovered(){const el=$("#recovered");if(!recovered.length){el.hidden=true;return}el.hidden=false;el.innerHTML='<b>RECOVERED THOUGHTS</b> · '+recovered.length+' item'+(recovered.length===1?'':'s')+' safely parked.<br><button id="reviewRecovered">Review now</button><button id="dismissRecovered">Leave for later</button>'}
function reviewRecovered(){if(!recovered.length)return;dump.value=recovered.join("，");recovered=[];renderRecovered();$("#sort").click()}
function dismissRecovered(){recovered=[];renderRecovered()}
function endFocusSession(){releaseCapturedThoughts();focusSession=null;localStorage.removeItem("runlu-next-focus-session");if(focusTimer)clearInterval(focusTimer);focusTimer=null;focusSessionUI()}
function energyUI(){const labels={low:"Low",normal:"Normal",high:"High"};$("#energy").innerHTML='<b>ENERGY NOW</b> · tell NEXT what you actually have available.<br>'+["low","normal","high"].map(x=>'<button data-energy="'+x+'" class="'+(energy===x?'active':'')+'">'+labels[x]+'</button>').join("")}
function focusInsight(){if(!plan?.do_now?.task)return"";const p=prefs[keyFor(plan.do_now.task)],f=p?.focus;if(!f)return"";const rows=[10,25,45].map(m=>{const x=f[m]||{},n=(x.done||0)+(x.more||0)+(x.blocked||0);return{m,n,done:x.done||0}}).filter(x=>x.n>=2);if(!rows.length)return"";const best=rows.sort((a,b)=>(b.done/b.n)-(a.done/a.n)||b.n-a.n)[0];const rate=Math.round(best.done/best.n*100);return"Local learning: "+best.m+" min has worked best for similar tasks so far ("+best.done+"/"+best.n+" completed, "+rate+"%). This is a suggestion, not a rule."}
function recommendedFocus(){if(!plan?.do_now?.task)return 25;if(energy==="low")return 10;const k=keyFor(plan.do_now.task),p=prefs[k],f=p?.focus;if(f){const choices=[10,25,45].map(m=>{const x=f[m]||{},n=(x.done||0)+(x.more||0)+(x.blocked||0);return{m,n,rate:n?(x.done||0)/n:0}}).filter(x=>x.n>=2).sort((a,b)=>b.rate-a.rate||b.n-a.n);if(choices[0]?.rate>=.5)return choices[0].m}const t=plan.do_now.task.toLowerCase(),h=new Date().getHours();if(h>=20)return 10;if(energy==="high"&&/(开发|写|design|develop|build|project|研究|research|draft|code|精修)/i.test(t))return 45;if(/(开发|写|design|develop|build|project|研究|research|draft|code|精修)/i.test(t))return 45;if(/(email|邮件|回复|reply|confirm|确认|call|电话|pickup|取货|check|检查)/i.test(t))return 10;return 25}
function tomorrowUI(){const el=$("#tomorrow"),h=new Date().getHours();if(h<18||!backlog.length){el.hidden=true;return}const items=backlog.filter(x=>x.task).slice().sort((a,b)=>{const ap=preferencePenalty(a.task),bp=preferencePenalty(b.task);return ap-bp||new Date(a.added||0)-new Date(b.added||0)}).slice(0,3);if(!items.length){el.hidden=true;return}el.hidden=false;el.innerHTML='<b>TOMORROW PREVIEW</b> · Nothing is scheduled automatically. Based on your current backlog, these are the first items NEXT would reconsider tomorrow:<br>'+items.map((x,i)=>(i+1)+'. '+esc(x.task)).join('<br>')}
function cleanupUI(){const el=$("#cleanup"),now=Date.now(),old=backlog.filter(x=>x.added&&(now-new Date(x.added).getTime())>7*864e5);if(old.length<3){el.hidden=true;return}el.hidden=false;el.innerHTML='<b>BACKLOG CLEANUP</b> · '+old.length+' items have been carried for more than a week. Review them instead of letting the list grow forever. <button id="reviewOld">Review oldest</button>'}
function carryoverUI(){const el=$("#carry"),today=new Date().toDateString();if(!backlog.length){el.hidden=true;return}const old=backlog.filter(x=>x.added&&new Date(x.added).toDateString()!==today),aged=old.filter(x=>(Date.now()-new Date(x.added).getTime())>48*3600e3);if(!old.length){el.hidden=true;return}el.hidden=false;el.innerHTML='<b>CARRYOVER</b> · '+old.length+' unfinished item'+(old.length===1?'':'s')+' came from an earlier day.'+(aged.length?(' '+aged.length+' have been waiting more than 48 hours.'):' They remain backlog until they become actionable.')+(aged.length?'<div class="stale">'+aged.slice(0,3).map((x,i)=>esc(x.task)+' <button data-stale="'+i+'" data-act="keep">Keep</button><button data-stale="'+i+'" data-act="follow">Follow up</button><button data-stale="'+i+'" data-act="drop">Drop</button>').join("<br>")+'</div>':'');el._aged=aged }
function startDayUI(){const el=$("#startday"),h=new Date().getHours(),today=new Date().toDateString(),last=localStorage.getItem("runlu-next-started-day");if(closedForToday||last===today||h>=14||!backlog.length){el.hidden=true;return}el.hidden=false;const top=plan?.do_now?.task||backlog[0]?.task||"";el.innerHTML='<b>START TODAY</b> · '+(top?('Begin with one concrete action: '+esc(top)+'.'):'Choose one concrete action.')+' <button id="startToday">Start today</button>'}
function boundaryUI(){const el=$("#boundary");if(closedForToday){el.hidden=false;el.innerHTML='<b>DAY CLOSED</b> · NEXT will keep unfinished items safe for tomorrow. <button id="reopenDay">Reopen</button>';return}const ca=capacityAdvice();const h=new Date().getHours();el.hidden=!(ca&&(h>=18||ca.excess>0));if(!el.hidden)el.innerHTML='<b>ENOUGH FOR TODAY?</b> · If your useful capacity is spent, close the day without clearing the backlog. <button id="closeDay">Close today</button>'}
function capacityAdvice(){if(!plan)return null;const open=collectPlan(plan).length,h=new Date().getHours(),remaining=Math.max(1,22-h);let cap=energy==="low"?1:energy==="high"?Math.min(5,remaining):Math.min(3,remaining);if(h>=20)cap=1;const excess=Math.max(0,open-cap);return{cap,open,excess,text:excess?("Protect about "+cap+" action"+(cap===1?"":"s")+" for the rest of this period. "+excess+" other item"+(excess===1?" is":"s are")+" backlog, not failure."):("Current load fits your estimated capacity. Keep the list stable.")}}
function operatingMode(){if(!plan)return null;const {done,defer}=momentumStats(),open=collectPlan(plan).length,h=new Date().getHours();if(open===0)return{n:"CLEAR",t:"Nothing needs your attention right now."};if(h>=20||defer>done*2||open>=8)return{n:"FOCUS",t:"Shrink the field. Protect one actionable item and stop adding pressure."};if(done>=defer*2&&open<=5)return{n:"ADVANCE",t:"Momentum is good. Keep moving through the next concrete actions."};return{n:"STEADY",t:"Keep one clear DO NOW and move forward without expanding the list."}}
function mergeBacklog(p){const seen=new Set(backlog.map(x=>x.task.toLowerCase()));for(const x of collectPlan(p)){const k=x.task.toLowerCase();if(!seen.has(k)){backlog.push({task:x.task,reason:x.reason||"",added:new Date().toISOString()});seen.add(k)}}saveBacklog()}
function removeBacklog(task){backlog=backlog.filter(x=>x.task!==task);saveBacklog()}
function agedTaskText(task){
 const b=backlog.find(x=>x.task.toLowerCase()===task.toLowerCase());if(!b?.added)return task;
 const age=Date.now()-new Date(b.added).getTime(),waiting=/(等|等待|waiting|wait for|pending|awaiting)/i.test(task);
 return waiting&&age>=48*3600*1000?("Follow up: "+task):task
}
async function replanRemaining(){
 const items=personalizeItems(collectPlan(plan)).map(x=>agedTaskText(x.task)).filter(Boolean);
 if(!items.length){plan=null;results.hidden=true;localStorage.removeItem("runlu-next-v02");status.textContent="All clear ✓";return}
 status.textContent="Re-evaluating what comes next…";
 try{
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:items.join("，"),local_time:new Date().toISOString()})});
  const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||"Could not re-plan");
  plan=j.plan;
  if(plan?.do_now&&preferencePenalty(plan.do_now.task)>=4){
   const pool=personalizeItems([...(plan.next||[]),plan.do_now]);const better=pool[0];
   if(better&&better.task!==plan.do_now.task){plan.next=(plan.next||[]).filter(x=>x.task!==better.task);plan.next.push(plan.do_now);plan.do_now=better}
  }
  render();status.textContent=j.cloud_degraded?"Next action re-ranked locally · no paid AI used.":"Next action re-ranked with AI.";
 }catch(e){status.textContent="Saved. Re-ranking unavailable; keeping the current order.";status.className="status error"}
}
function render(){
 const all=plan?collectPlan(plan):[],wait=(plan?.remember||[]).length,proj=(plan?.projects||[]).length,later=(plan?.later||[]).length;
 $("#brief").innerHTML=[all.length+" OPEN",wait+" WAITING",proj+" PROJECTS",later+" LATER"].map(x=>'<span class="chip">'+x+'</span>').join("");
 const now=new Date(),h=now.getHours(),part=h<12?"MORNING":h<17?"AFTERNOON":"EVENING";
