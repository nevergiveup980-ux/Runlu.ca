<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUNLU NEXT — Know what's next.</title><meta name="description" content="Turn a messy mind into one clear next action."><style>
:root{--bg:#f5f5f2;--ink:#171817;--muted:#6f726f;--line:#d9dad5;--card:#fff;--soft:#efefeb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:820px;margin:auto;padding:28px 18px 64px}.brand{font-weight:800;letter-spacing:.16em;font-size:13px}.hero{padding:45px 0 20px}h1{font-size:clamp(42px,9vw,78px);line-height:.95;margin:0 0 18px;letter-spacing:-.055em}.tag{font-size:clamp(19px,4vw,28px);margin:0 0 8px}.sub,.hint,.reason,.status{color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:24px}textarea{width:100%;min-height:170px;border:0;resize:vertical;font:inherit;font-size:18px;outline:0;background:transparent}.actions{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.hint,.status{font-size:13px}button{border:0;border-radius:999px;padding:13px 20px;font:inherit;font-weight:700;cursor:pointer;background:var(--ink);color:white;min-height:48px}button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5}#results{margin-top:30px}.nextCard{background:var(--ink);color:white;border-radius:20px;padding:22px;margin-bottom:18px}.label{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}.nextCard .label,.nextCard .reason{color:#bbb}.nextCard strong{font-size:25px;display:block}.reason{font-size:14px;margin:6px 0 16px}.section{border-top:1px solid var(--line);padding:18px 2px}.task{padding:8px 0}.task strong{display:block;font-size:18px}.summary{font-size:15px;margin:0 0 18px;color:var(--muted)}.brief{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.chip{border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:var(--muted);background:#fff}.focus{font-size:13px;color:var(--muted);margin:8px 0 0}.focus b{color:inherit}.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.quick button{min-height:36px;padding:8px 12px;font-size:12px;background:transparent;color:var(--ink);border:1px solid var(--line)}.signal{margin:12px 0 0;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;font-size:13px;color:var(--muted)}.signal button{margin-top:8px;min-height:32px;padding:6px 10px;font-size:12px}.momentum{margin-top:10px;font-size:12px;color:var(--muted)}.mode{margin:10px 0;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:13px}.mode b{letter-spacing:.04em}.guard{margin:10px 0 16px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:13px}.guard button{margin-left:8px;min-height:32px;padding:6px 10px;font-size:12px;background:transparent;color:var(--ink);border:1px solid var(--line)}.guard button.recommended{font-weight:800;border-style:solid;box-shadow:inset 0 0 0 1px var(--ink)}.session{margin:10px 0 16px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:13px}.session .clock{font-variant-numeric:tabular-nums;font-weight:800;margin-left:6px}.session button{margin:8px 6px 0 0;min-height:32px;padding:6px 10px;font-size:12px;background:transparent;color:var(--ink);border:1px solid var(--line)}.session .note{margin-top:8px;color:var(--muted);font-size:12px}.recovered{margin:10px 0 16px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:13px}.recovered button{margin:8px 6px 0 0;min-height:32px;padding:6px 10px;font-size:12px;background:transparent;color:var(--ink);border:1px solid var(--line)}.outcome{margin:10px 0 16px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:13px}.outcome button{margin:8px 6px 0 0;min-height:32px;padding:6px 10px;font-size:12px;background:transparent;color:var(--ink);border:1px solid var(--line)}.error{color:#8b2f2f}.footer{margin-top:45px;color:var(--muted);font-size:13px}@media(max-width:520px){.actions button{width:100%}.hint{order:2}}</style></head><body><main class="wrap"><div class="brand">RUNLU</div><section class="hero"><h1>NEXT</h1><p class="tag">Too much on your mind? <strong>Know what's next.</strong></p><p class="sub">Don't build another list. Tell NEXT what's competing for your attention and let it choose the next useful move.</p></section><section class="panel"><textarea id="dump" placeholder="What's on your mind?&#10;&#10;Example: 发布V7，开发NEXT，orders pick up，cut carpet，Wood's Homes 清洁"></textarea><div class="actions"><span id="status" class="hint">Runs locally first. No paid AI required.</span><button id="sort">Ask NEXT →</button></div></section><section id="results" hidden><div id="brief" class="brief"></div><div id="focus" class="focus"></div><div id="quick" class="quick"></div><div id="signal" class="signal" hidden></div><div id="momentum" class="momentum" hidden></div><div id="mode" class="mode" hidden></div><div id="guard" class="guard" hidden></div><div id="session" class="session" hidden></div><div id="recovered" class="recovered" hidden></div><div id="outcome" class="outcome" hidden></div><p id="summary" class="summary"></p><div class="nextCard"><div class="label">DO NOW</div><strong id="nowText"></strong><p id="nowReason" class="reason"></p><button id="done" class="secondary" style="color:white;border-color:#666">Done ✓</button></div><div id="groups"></div><button id="reset" class="secondary">Start over</button></section><div class="footer">RUNLU NEXT · V0.28 · Focus Outcome Learning Agent</div></main><script>
const API="https://ekrnknlawekeoszzkamd.supabase.co/functions/v1/runlu-next-ai";const $=s=>document.querySelector(s),dump=$("#dump"),results=$("#results"),groups=$("#groups"),status=$("#status");let plan=null;let backlog=[];let prefs={};let showParked=false;let focusSession=null;let focusTimer=null;let recovered=[];let focusOutcome=null;
const esc=s=>{const d=document.createElement("div");d.textContent=s||"";return d.innerHTML};
function row(x){return '<div class="task"><strong>'+esc(x.task)+'</strong><div class="reason">'+esc(x.reason)+'</div></div>'}
function collectPlan(p){if(!p)return[];return [p.do_now,...(p.next||[]),...(p.later||[]),...(p.remember||[]),...(p.projects||[])].filter(x=>x&&x.task)}
function saveBacklog(){localStorage.setItem("runlu-next-backlog",JSON.stringify(backlog.slice(0,60)))}
function keyFor(task){return String(task||"").toLowerCase().replace(/\d+/g,"#").replace(/[^a-z\u4e00-\u9fff#]+/g," ").trim().split(/\s+/).slice(0,4).join(" ")}
function learn(task,kind){const k=keyFor(task);if(!k)return;prefs[k]=prefs[k]||{later:0,waiting:0,done:0};prefs[k][kind]=(prefs[k][kind]||0)+1;prefs[k].updated=new Date().toISOString();localStorage.setItem("runlu-next-prefs",JSON.stringify(prefs))}
function decayPreferences(){const now=Date.now();for(const [k,p] of Object.entries(prefs)){const age=p.updated?now-new Date(p.updated).getTime():0;if(age>30*864e5){p.later=Math.floor((p.later||0)/2);p.waiting=Math.floor((p.waiting||0)/2);p.done=Math.floor((p.done||0)/2);p.updated=new Date().toISOString()}}localStorage.setItem("runlu-next-prefs",JSON.stringify(prefs))}
function preferenceText(task){const p=prefs[keyFor(task)];if(!p)return"";if(p.later>=2)return" · Learned: you often defer similar items.";if(p.waiting>=2)return" · Learned: similar items are often waiting.";return""}
function preferencePenalty(task){const p=prefs[keyFor(task)];if(!p)return 0;return (p.later||0)*2+(p.waiting||0)*3-(p.done||0)*.25}
function personalizeItems(items){return [...items].sort((a,b)=>preferencePenalty(a)-preferencePenalty(b))}
function explainPersonalChoice(task){const p=prefs[keyFor(task)];if(!p)return"";const done=p.done||0,later=p.later||0,waiting=p.waiting||0;if(done>=2&&done>later+waiting)return" · Personal pattern: you usually complete similar actions when they surface.";if(later+waiting>=2)return" · Personal pattern applied from your previous choices.";return""}
function frictionSignal(){const entries=Object.entries(prefs).map(([k,p])=>({k,...p}));const x=entries.sort((a,b)=>((b.later||0)+(b.waiting||0))-((a.later||0)+(a.waiting||0)))[0];if(!x||((x.later||0)+(x.waiting||0))<3)return null;return x}
function resetPattern(k){delete prefs[k];localStorage.setItem("runlu-next-prefs",JSON.stringify(prefs));render()}
function momentumStats(){const rows=Object.values(prefs);return{done:rows.reduce((n,p)=>n+(p.done||0),0),defer:rows.reduce((n,p)=>n+(p.later||0)+(p.waiting||0),0)}}
function momentumText(){const {done,defer}=momentumStats();if(done+defer<3)return"";if(done>=defer*2)return"Momentum: you’re clearing more actions than you defer.";if(defer>done*2)return"Momentum: several actions are being deferred — NEXT will keep looking for friction.";return"Momentum: your completed and deferred actions are roughly balanced."}
function focusSessionUI(){const el=$("#session");if(!focusSession){el.hidden=true;return}const left=Math.max(0,focusSession.ends-Date.now()),m=Math.floor(left/60000),s=Math.floor((left%60000)/1000);el.hidden=false;el.innerHTML='<b>FOCUS SESSION · '+(focusSession.minutes||25)+' MIN</b><span class="clock">'+String(m).padStart(2,"0")+':'+String(s).padStart(2,"0")+'</span><br>'+esc(focusSession.task)+'<br><button id="endFocus">End session</button><button id="captureThought">Capture thought</button><div class="note">'+(focusSession.note?'Parked thought: '+esc(focusSession.note):'Interruptions can be parked here without changing your current focus.')+'</div>';if(left<=0){clearInterval(focusTimer);focusTimer=null;const finished={task:focusSession.task,minutes:focusSession.minutes||25};releaseCapturedThoughts();focusSession=null;localStorage.removeItem("runlu-next-focus-session");el.innerHTML='<b>FOCUS SESSION COMPLETE</b> · Recheck the result below.';showFocusOutcome(finished.task,finished.minutes)}}
function startFocusSession(minutes=25){if(!plan?.do_now?.task)return;focusSession={task:plan.do_now.task,minutes,started:Date.now(),ends:Date.now()+minutes*60000};localStorage.setItem("runlu-next-focus-session",JSON.stringify(focusSession));if(focusTimer)clearInterval(focusTimer);focusTimer=setInterval(focusSessionUI,1000);focusSessionUI()}
function captureThought(){if(!focusSession)return;const t=prompt("Park the thought. NEXT will keep your current focus unchanged.");if(!t?.trim())return;focusSession.note=focusSession.note?(focusSession.note+" · "+t.trim()):t.trim();localStorage.setItem("runlu-next-focus-session",JSON.stringify(focusSession));focusSessionUI()}
function showFocusOutcome(task,minutes){focusOutcome={task,minutes};const el=$("#outcome");el.hidden=false;el.innerHTML='<b>SESSION CHECK</b> · '+esc(task)+'<br>What happened after '+minutes+' minutes?<br><button data-outcome="done">Done ✓</button><button data-outcome="more">Needs more time</button><button data-outcome="blocked">Blocked</button>'}
function clearFocusOutcome(){focusOutcome=null;$("#outcome").hidden=true}
function releaseCapturedThoughts(){if(!focusSession?.note)return;const thoughts=focusSession.note.split(" · ").map(x=>x.trim()).filter(Boolean);const seen=new Set(backlog.map(x=>x.task.toLowerCase()));recovered=[];for(const task of thoughts){if(!seen.has(task.toLowerCase())){backlog.push({task,reason:"Captured during a focus session.",added:new Date().toISOString()});recovered.push(task);seen.add(task.toLowerCase())}}saveBacklog();if(thoughts.length)status.textContent=thoughts.length+" captured thought"+(thoughts.length===1?"":"s")+" moved to your unfinished items.";renderRecovered()}
function renderRecovered(){const el=$("#recovered");if(!recovered.length){el.hidden=true;return}el.hidden=false;el.innerHTML='<b>RECOVERED THOUGHTS</b> · '+recovered.length+' item'+(recovered.length===1?'':'s')+' safely parked.<br><button id="reviewRecovered">Review now</button><button id="dismissRecovered">Leave for later</button>'}
function reviewRecovered(){if(!recovered.length)return;dump.value=recovered.join("，");recovered=[];renderRecovered();$("#sort").click()}
function dismissRecovered(){recovered=[];renderRecovered()}
function endFocusSession(){releaseCapturedThoughts();focusSession=null;localStorage.removeItem("runlu-next-focus-session");if(focusTimer)clearInterval(focusTimer);focusTimer=null;focusSessionUI()}
function recommendedFocus(){if(!plan?.do_now?.task)return 25;const t=plan.do_now.task.toLowerCase(),h=new Date().getHours();if(h>=20)return 10;if(/(开发|写|design|develop|build|project|研究|research|draft|code|精修)/i.test(t))return 45;if(/(email|邮件|回复|reply|confirm|确认|call|电话|pickup|取货|check|检查)/i.test(t))return 10;return 25}
function operatingMode(){if(!plan)return null;const {done,defer}=momentumStats(),open=collectPlan(plan).length,h=new Date().getHours();if(open===0)return{n:"CLEAR",t:"Nothing needs your attention right now."};if(h>=20||defer>done*2||open>=8)return{n:"FOCUS",t:"Shrink the field. Protect one actionable item and stop adding pressure."};if(done>=defer*2&&open<=5)return{n:"ADVANCE",t:"Momentum is good. Keep moving through the next concrete actions."};return{n:"STEADY",t:"Keep one clear DO NOW and move forward without expanding the list."}}
function mergeBacklog(p){const seen=new Set(backlog.map(x=>x.task.toLowerCase()));for(const x of collectPlan(p)){const k=x.task.toLowerCase();if(!seen.has(k)){backlog.push({task:x.task,reason:x.reason||"",added:new Date().toISOString()});seen.add(k)}}saveBacklog()}
function removeBacklog(task){backlog=backlog.filter(x=>x.task!==task);saveBacklog()}
function agedTaskText(task){
 const b=backlog.find(x=>x.task.toLowerCase()===task.toLowerCase());if(!b?.added)return task;
 const age=Date.now()-new Date(b.added).getTime(),waiting=/(等|等待|waiting|wait for|pending|awaiting)/i.test(task);
 return waiting&&age>=48*3600*1000?("Follow up: "+task):task
}
async function replanRemaining(){
 const items=personalizeItems(collectPlan(plan)).map(x=>agedTaskText(x.task)).filter(Boolean);
 if(!items.length){plan=null;results.hidden=true;localStorage.removeItem("runlu-next-v02");status.textContent="All clear ✓";return}
 status.textContent="Re-evaluating what comes next…";
 try{
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:items.join("，"),local_time:new Date().toISOString()})});
  const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||"Could not re-plan");
  plan=j.plan;
  if(plan?.do_now&&preferencePenalty(plan.do_now.task)>=4){
   const pool=personalizeItems([...(plan.next||[]),plan.do_now]);const better=pool[0];
   if(better&&better.task!==plan.do_now.task){plan.next=(plan.next||[]).filter(x=>x.task!==better.task);plan.next.push(plan.do_now);plan.do_now=better}
  }
  render();status.textContent=j.cloud_degraded?"Next action re-ranked locally · no paid AI used.":"Next action re-ranked with AI.";
 }catch(e){status.textContent="Saved. Re-ranking unavailable; keeping the current order.";status.className="status error"}
}
function render(){
 const all=plan?collectPlan(plan):[],wait=(plan?.remember||[]).length,proj=(plan?.projects||[]).length,later=(plan?.later||[]).length;
 $("#brief").innerHTML=[all.length+" OPEN",wait+" WAITING",proj+" PROJECTS",later+" LATER"].map(x=>'<span class="chip">'+x+'</span>').join("");
 const now=new Date(),h=now.getHours(),part=h<12?"MORNING":h<17?"AFTERNOON":"EVENING";
 $("#focus").innerHTML="<b>"+part+" FOCUS</b> · "+(plan?.do_now?.task?esc(plan.do_now.task):"No immediate action");
 $("#quick").innerHTML=plan?.do_now?.task?'<button data-q="later">Not now</button><button data-q="waiting">Waiting</button>':"";
 const sig=frictionSignal();$("#signal").hidden=!sig;if(sig)$("#signal").innerHTML='Pattern noticed: “'+esc(sig.k)+'” is repeatedly deferred or blocked. Consider changing the task, timing, or dependency instead of pushing it forward again.<br><button id="resetPattern">Reset this pattern</button>';
 const mt=momentumText();$("#momentum").hidden=!mt;$("#momentum").textContent=mt;
 const om=operatingMode();$("#mode").hidden=!om;if(om)$("#mode").innerHTML='<b>'+om.n+' MODE</b> · '+om.t;
 const secondary=(plan?.next||[]).length+(plan?.later||[]).length+(plan?.remember||[]).length+(plan?.projects||[]).length;
 const guarded=om?.n==="FOCUS"&&secondary>0;$("#guard").hidden=!guarded;
 if(guarded){const rf=recommendedFocus();$("#guard").innerHTML='<b>FOCUS GUARD</b> · '+secondary+' secondary item'+(secondary===1?' is':'s are')+' parked out of sight while you protect the current action. <button id="toggleParked">'+(showParked?'Hide parked items':'Show parked items')+'</button><br><span class="hint">Suggested session: '+rf+' min · you choose.</span><br><button data-focus="10" class="'+(rf===10?'recommended':'')+'">Quick 10</button><button data-focus="25" class="'+(rf===25?'recommended':'')+'">Focus 25</button><button data-focus="45" class="'+(rf===45?'recommended':'')+'">Deep 45</button>'}
 focusSessionUI();renderRecovered();
 if(!plan?.do_now?.task){if(plan){results.hidden=false;$("#summary").textContent=plan.summary||"No action is available right now.";$("#nowText").textContent="Nothing actionable right now";$("#nowReason").textContent="NEXT will keep waiting and future-window items out of DO NOW.";groups.innerHTML="";localStorage.setItem("runlu-next-v02",JSON.stringify(plan))}else results.hidden=true;return}results.hidden=false;$("#summary").textContent=plan.summary||"";$("#nowText").textContent=plan.do_now.task;$("#nowReason").textContent=(plan.do_now.reason||"")+preferenceText(plan.do_now.task)+explainPersonalChoice(plan.do_now.task);const sets=[["NEXT",plan.next],["LATER",plan.later],["WAITING / REMEMBER",plan.remember],["PROJECT / DEEP WORK",plan.projects]];
 const visibleSets=(guarded&&!showParked)?[]:sets;
 groups.innerHTML=visibleSets.filter(x=>Array.isArray(x[1])&&x[1].length).map(x=>'<div class="section"><div class="label">'+x[0]+'</div>'+x[1].map(row).join("")+'</div>').join("");localStorage.setItem("runlu-next-v02",JSON.stringify(plan))}
$("#sort").addEventListener("click",async()=>{const text=dump.value.trim();if(!text){dump.focus();return}$("#sort").disabled=true;status.textContent="NEXT is thinking…";status.className="status";try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,local_time:new Date().toISOString()})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||"Could not plan");plan=j.plan;mergeBacklog(plan);render();status.textContent=j.cloud_degraded?"Local plan ready · no paid AI used.":"AI-enhanced plan ready.";results.scrollIntoView({behavior:"smooth",block:"start"})}catch(e){status.textContent=e.message||"NEXT is temporarily unavailable.";status.className="status error"}finally{$("#sort").disabled=false}});
$("#done").addEventListener("click",async()=>{if(!plan)return;endFocusSession();learn(plan.do_now?.task,"done");removeBacklog(plan.do_now?.task);plan.do_now=null;showParked=false;await replanRemaining()});
$("#signal").addEventListener("click",e=>{if(e.target?.id==="resetPattern"){const s=frictionSignal();if(s)resetPattern(s.k)}});
$("#guard").addEventListener("click",e=>{if(e.target?.id==="toggleParked"){showParked=!showParked;render()}const m=Number(e.target?.dataset?.focus);if([10,25,45].includes(m))startFocusSession(m)});$("#session").addEventListener("click",e=>{if(e.target?.id==="endFocus")endFocusSession();if(e.target?.id==="captureThought")captureThought()});
$("#outcome").addEventListener("click",async e=>{const o=e.target?.dataset?.outcome;if(!o||!focusOutcome)return;const {task}=focusOutcome;if(o==="done"){learn(task,"done");removeBacklog(task);if(plan?.do_now?.task===task)plan.do_now=null;clearFocusOutcome();await replanRemaining()}else if(o==="more"){learn(task,"later");clearFocusOutcome();status.textContent="Kept in your unfinished items. NEXT will reconsider it with the rest."}else if(o==="blocked"){learn(task,"waiting");if(plan?.do_now?.task===task){plan.remember=plan.remember||[];plan.remember.push({...plan.do_now,reason:"You marked this focus result as blocked."});plan.do_now=null}clearFocusOutcome();await replanRemaining()}});$("#recovered").addEventListener("click",e=>{if(e.target?.id==="reviewRecovered")reviewRecovered();if(e.target?.id==="dismissRecovered")dismissRecovered()});
$("#quick").addEventListener("click",async e=>{const q=e.target?.dataset?.q;if(!q||!plan?.do_now)return;showParked=false;const item=plan.do_now;learn(item.task,q);plan.do_now=null;if(q==="later"){plan.later=plan.later||[];plan.later.push({...item,reason:"You moved this out of the current focus."})}else{plan.remember=plan.remember||[];plan.remember.push({...item,reason:"You marked this as waiting on someone or something else."})}render();await replanRemaining()});
$("#reset").addEventListener("click",()=>{plan=null;dump.value="";results.hidden=true;localStorage.removeItem("runlu-next-v02");status.textContent="Runs locally first. No paid AI required.";dump.focus()});
try{focusSession=JSON.parse(localStorage.getItem("runlu-next-focus-session")||"null");if(focusSession?.ends>Date.now()){focusTimer=setInterval(focusSessionUI,1000)}else focusSession=null}catch{focusSession=null}
try{prefs=JSON.parse(localStorage.getItem("runlu-next-prefs")||"{}");if(!prefs||Array.isArray(prefs))prefs={};decayPreferences()}catch{prefs={}}
try{backlog=JSON.parse(localStorage.getItem("runlu-next-backlog")||"[]");if(!Array.isArray(backlog))backlog=[]}catch{backlog=[]}
try{const p=JSON.parse(localStorage.getItem("runlu-next-v02")||"null");if(p){plan=p;render();mergeBacklog(p)}}catch{}
if(!plan&&backlog.length){dump.value=backlog.map(x=>x.task).join("，");status.textContent=backlog.length+" unfinished item"+(backlog.length===1?"":"s")+" restored from your last session.";}
</script></body></html>
