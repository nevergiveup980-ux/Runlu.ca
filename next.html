<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUNLU NEXT — Know what's next.</title>
<meta name="description" content="Turn a messy mind into one clear next action.">
<style>
:root{--bg:#f5f5f2;--ink:#171817;--muted:#6f726f;--line:#d9dad5;--card:#fff;--accent:#1f4f43}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:auto;padding:28px 18px 64px}.brand{font-weight:800;letter-spacing:.16em;font-size:13px}.hero{padding:54px 0 28px}
h1{font-size:clamp(42px,9vw,78px);line-height:.95;margin:0 0 18px;letter-spacing:-.055em}.tag{font-size:clamp(19px,4vw,28px);margin:0 0 8px}.sub{color:var(--muted);max-width:600px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:28px}
textarea{width:100%;min-height:170px;border:0;resize:vertical;font:inherit;font-size:18px;outline:0;background:transparent;color:var(--ink)}
.actions{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.hint{font-size:13px;color:var(--muted)}
button{border:0;border-radius:999px;padding:13px 20px;font:inherit;font-weight:700;cursor:pointer;background:var(--ink);color:white;min-height:48px}
button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.45;cursor:not-allowed}
#results{margin-top:30px}.section{border-top:1px solid var(--line);padding:18px 2px}.label{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
.task{display:flex;gap:12px;align-items:flex-start;padding:9px 0}.task input{margin-top:5px;width:20px;height:20px}.task span{font-size:18px}
.nextCard{background:var(--ink);color:white;border-radius:20px;padding:22px;margin:8px 0 18px}.nextCard .label{color:#bbb}.nextCard strong{font-size:25px;display:block;margin:4px 0 16px}
.empty{color:var(--muted);padding:22px 0}.footer{margin-top:45px;color:var(--muted);font-size:13px}
@media(max-width:520px){.hero{padding-top:40px}.panel{padding:15px}.actions button{width:100%}.hint{order:2}}
</style></head>
<body><main class="wrap">
<div class="brand">RUNLU</div>
<section class="hero"><h1>NEXT</h1><p class="tag">Too much on your mind? <strong>Know what's next.</strong></p><p class="sub">Drop in everything you need to do, remember, or deal with. NEXT turns the noise into one clear action at a time.</p></section>
<section class="panel"><textarea id="dump" aria-label="What's on your mind?" placeholder="What's on your mind?&#10;&#10;Example: Buy groceries tonight, call Mom, pay the electricity bill by Friday, book a tire change next month, and walk for 30 minutes."></textarea><div class="actions"><span class="hint">No account. Your list stays in this browser.</span><button id="sort">Sort My Day →</button></div></section>
<section id="results" hidden><div class="nextCard"><div class="label">DO NOW</div><strong id="nowText"></strong><button class="secondary" id="done" style="color:white;border-color:#666">Done ✓</button></div><div id="groups"></div><button class="secondary" id="reset">Start over</button></section>
<div class="footer">RUNLU NEXT · V0.1 · Personal Action Agent</div>
</main>
<script>
const $=s=>document.querySelector(s), dump=$('#dump'), results=$('#results'), groups=$('#groups'), nowText=$('#nowText');
let items=[];
function splitInput(t){return t.replace(/\n+/g,',').split(/[,;。；]+|\band\b/gi).map(x=>x.trim()).filter(x=>x.length>2).slice(0,20)}
function score(t){let s=0,q=t.toLowerCase();if(/today|tonight|now|今天|今晚|现在/.test(q))s+=5;if(/by |due|before|截止|之前/.test(q))s+=4;if(/pay|bill|call|交|付款|电话/.test(q))s+=3;if(/next month|下个月|someday|以后/.test(q))s-=4;if(/walk|exercise|散步|锻炼/.test(q))s-=1;return s}
function classify(t,i){let q=t.toLowerCase();if(/next month|下个月|remember|记得|someday|以后/.test(q))return 'REMEMBER';if(/walk|exercise|散步|锻炼|if .?time/.test(q))return 'IF THERE’S TIME';return i<3?'NEXT':'LATER'}
function render(){if(!items.length){results.hidden=true;return}items.sort((a,b)=>b.score-a.score);results.hidden=false;nowText.textContent=items[0].text;let rest=items.slice(1), map={};rest.forEach((x,i)=>{let k=classify(x.text,i);(map[k]??=[]).push(x)});groups.innerHTML=['NEXT','LATER','REMEMBER','IF THERE’S TIME'].filter(k=>map[k]?.length).map(k=>'<div class="section"><div class="label">'+k+'</div>'+map[k].map(x=>'<label class="task"><input type="checkbox" data-id="'+x.id+'"><span>'+escapeHtml(x.text)+'</span></label>').join('')+'</div>').join('');localStorage.setItem('runlu-next',JSON.stringify(items))}
function escapeHtml(s){let d=document.createElement('div');d.textContent=s;return d.innerHTML}
$('#sort').addEventListener('click',()=>{let a=splitInput(dump.value);if(!a.length){dump.focus();return}items=a.map((text,i)=>({id:Date.now()+i,text,score:score(text)}));render()});
$('#done').addEventListener('click',()=>{items.shift();render()});
groups.addEventListener('change',e=>{if(e.target.matches('input[data-id]')){items=items.filter(x=>String(x.id)!==e.target.dataset.id);render()}});
$('#reset').addEventListener('click',()=>{items=[];dump.value='';localStorage.removeItem('runlu-next');results.hidden=true;dump.focus()});
try{let saved=JSON.parse(localStorage.getItem('runlu-next')||'[]');if(Array.isArray(saved)&&saved.length){items=saved;render()}}catch(e){}
</script></body></html>
