<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUNLU NEXT — Know what's next.</title><meta name="description" content="Turn a messy mind into one clear next action."><style>
:root{--bg:#f5f5f2;--ink:#171817;--muted:#6f726f;--line:#d9dad5;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:820px;margin:auto;padding:28px 18px 64px}.brand{font-weight:800;letter-spacing:.16em;font-size:13px}.hero{padding:45px 0 20px}h1{font-size:clamp(42px,9vw,78px);line-height:.95;margin:0 0 18px;letter-spacing:-.055em}.tag{font-size:clamp(19px,4vw,28px);margin:0 0 8px}.sub,.hint,.reason,.status{color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:24px}textarea{width:100%;min-height:170px;border:0;resize:vertical;font:inherit;font-size:18px;outline:0;background:transparent}.actions{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.hint,.status{font-size:13px}button{border:0;border-radius:999px;padding:13px 20px;font:inherit;font-weight:700;cursor:pointer;background:var(--ink);color:white;min-height:48px}button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5}#results{margin-top:30px}.nextCard{background:var(--ink);color:white;border-radius:20px;padding:22px;margin-bottom:18px}.label{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}.nextCard .label,.nextCard .reason{color:#bbb}.nextCard strong{font-size:25px;display:block}.reason{font-size:14px;margin:6px 0 16px}.section{border-top:1px solid var(--line);padding:18px 2px}.task{padding:8px 0}.task strong{display:block;font-size:18px}.summary{font-size:15px;margin:0 0 18px;color:var(--muted)}.error{color:#8b2f2f}.footer{margin-top:45px;color:var(--muted);font-size:13px}@media(max-width:520px){.actions button{width:100%}.hint{order:2}}</style></head><body><main class="wrap"><div class="brand">RUNLU</div><section class="hero"><h1>NEXT</h1><p class="tag">Too much on your mind? <strong>Know what's next.</strong></p><p class="sub">Don't build another list. Tell NEXT what's competing for your attention and let it choose the next useful move.</p></section><section class="panel"><textarea id="dump" placeholder="What's on your mind?&#10;&#10;Example: 发布V7，开发NEXT，orders pick up，cut carpet，Wood's Homes 清洁"></textarea><div class="actions"><span id="status" class="hint">Runs locally first. No paid AI required.</span><button id="sort">Ask NEXT →</button></div></section><section id="results" hidden><p id="summary" class="summary"></p><div class="nextCard"><div class="label">DO NOW</div><strong id="nowText"></strong><p id="nowReason" class="reason"></p><button id="done" class="secondary" style="color:white;border-color:#666">Done ✓</button></div><div id="groups"></div><button id="reset" class="secondary">Start over</button></section><div class="footer">RUNLU NEXT · V0.9 · Context-aware Local Action Agent</div></main><script>
const API="https://ekrnknlawekeoszzkamd.supabase.co/functions/v1/runlu-next-ai";const $=s=>document.querySelector(s),dump=$("#dump"),results=$("#results"),groups=$("#groups"),status=$("#status");let plan=null;let backlog=[];
const esc=s=>{const d=document.createElement("div");d.textContent=s||"";return d.innerHTML};
function row(x){return '<div class="task"><strong>'+esc(x.task)+'</strong><div class="reason">'+esc(x.reason)+'</div></div>'}
function collectPlan(p){if(!p)return[];return [p.do_now,...(p.next||[]),...(p.later||[]),...(p.remember||[]),...(p.projects||[])].filter(x=>x&&x.task)}
function saveBacklog(){localStorage.setItem("runlu-next-backlog",JSON.stringify(backlog.slice(0,60)))}
function mergeBacklog(p){const seen=new Set(backlog.map(x=>x.task.toLowerCase()));for(const x of collectPlan(p)){const k=x.task.toLowerCase();if(!seen.has(k)){backlog.push({task:x.task,reason:x.reason||"",added:new Date().toISOString()});seen.add(k)}}saveBacklog()}
function removeBacklog(task){backlog=backlog.filter(x=>x.task!==task);saveBacklog()}
async function replanRemaining(){
 const items=collectPlan(plan).map(x=>x.task).filter(Boolean);
 if(!items.length){plan=null;results.hidden=true;localStorage.removeItem("runlu-next-v02");status.textContent="All clear ✓";return}
 status.textContent="Re-evaluating what comes next…";
 try{
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:items.join("，"),local_time:new Date().toISOString()})});
  const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||"Could not re-plan");
  plan=j.plan;render();status.textContent=j.cloud_degraded?"Next action re-ranked locally · no paid AI used.":"Next action re-ranked with AI.";
 }catch(e){status.textContent="Saved. Re-ranking unavailable; keeping the current order.";status.className="status error"}
}
function render(){if(!plan?.do_now?.task){results.hidden=true;return}results.hidden=false;$("#summary").textContent=plan.summary||"";$("#nowText").textContent=plan.do_now.task;$("#nowReason").textContent=plan.do_now.reason||"";const sets=[["NEXT",plan.next],["LATER",plan.later],["WAITING / REMEMBER",plan.remember],["PROJECT / DEEP WORK",plan.projects]];groups.innerHTML=sets.filter(x=>Array.isArray(x[1])&&x[1].length).map(x=>'<div class="section"><div class="label">'+x[0]+'</div>'+x[1].map(row).join("")+'</div>').join("");localStorage.setItem("runlu-next-v02",JSON.stringify(plan))}
$("#sort").addEventListener("click",async()=>{const text=dump.value.trim();if(!text){dump.focus();return}$("#sort").disabled=true;status.textContent="NEXT is thinking…";status.className="status";try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,local_time:new Date().toISOString()})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||"Could not plan");plan=j.plan;mergeBacklog(plan);render();status.textContent=j.cloud_degraded?"Local plan ready · no paid AI used.":"AI-enhanced plan ready.";results.scrollIntoView({behavior:"smooth",block:"start"})}catch(e){status.textContent=e.message||"NEXT is temporarily unavailable.";status.className="status error"}finally{$("#sort").disabled=false}});
$("#done").addEventListener("click",async()=>{if(!plan)return;removeBacklog(plan.do_now?.task);plan.do_now=null;await replanRemaining()});
$("#reset").addEventListener("click",()=>{plan=null;dump.value="";results.hidden=true;localStorage.removeItem("runlu-next-v02");status.textContent="Runs locally first. No paid AI required.";dump.focus()});
try{backlog=JSON.parse(localStorage.getItem("runlu-next-backlog")||"[]");if(!Array.isArray(backlog))backlog=[]}catch{backlog=[]}
try{const p=JSON.parse(localStorage.getItem("runlu-next-v02")||"null");if(p){plan=p;render();mergeBacklog(p)}}catch{}
if(!plan&&backlog.length){dump.value=backlog.map(x=>x.task).join("，");status.textContent=backlog.length+" unfinished item"+(backlog.length===1?"":"s")+" restored from your last session.";}
</script></body></html>
