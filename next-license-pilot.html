<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>RUNLU NEXT License Pilot</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:680px;margin:40px auto;padding:20px;background:#f7f7f5;color:#171717}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:24px;margin:16px 0}button,a.btn{display:inline-block;padding:12px 18px;border-radius:10px;border:0;background:#111;color:#fff;text-decoration:none;font-weight:700}.muted{color:#666}.ok{color:#176b3a}.bad{color:#a21d1d}</style><link href="runlu-language-pages.css?v=20261002" rel="stylesheet"/></head><body><div class="runlu-language-bar"><select aria-label="Language" data-runlu-language-select=""><option value="en">English</option><option value="zh">中文</option><option value="fr">Français</option><option value="es">Español</option></select></div><h1 data-en="RUNLU NEXT · License Pilot" data-es="RUNLU NEXT · Piloto de licencia" data-fr="RUNLU NEXT · Pilote de licence" data-zh="RUNLU NEXT · 授权试验">RUNLU NEXT · License Pilot</h1><p class="muted" data-en="Experimental activation shell. Production NEXT is unchanged." data-es="Interfaz experimental de activación. NEXT en producción no cambia." data-fr="Interface d’activation expérimentale. NEXT en production reste inchangé." data-zh="实验性激活界面。正式版 NEXT 未改变。">Experimental activation shell. Production NEXT is unchanged.</p><div class="card"><h2 data-en="Starting…" data-es="Iniciando…" data-fr="Démarrage…" data-zh="启动中…" id="state">Starting…</h2><p class="muted" data-en="Pilot build 4" data-es="Versión piloto 4" data-fr="Version pilote 4" data-zh="试验版本 4" id="detail">Pilot build 4</p><button data-en="Activate this device" data-es="Activar este dispositivo" data-fr="Activer cet appareil" data-zh="激活此设备" id="activate" style="display:none" type="button">Activate this device</button> <a class="btn" data-en="Open NEXT" data-es="Abrir NEXT" data-fr="Ouvrir NEXT" data-zh="打开 NEXT" href="next.html" id="open" style="display:none">Open NEXT</a></div><div class="card"><strong data-en="Test goal" data-es="Objetivo de prueba" data-fr="Objectif du test" data-zh="测试目标">Test goal</strong><p data-en="Activate once online, then confirm the local receipt remains available offline." data-es="Activa una vez en línea y comprueba que el recibo local siga disponible sin conexión." data-fr="Activer une fois en ligne, puis vérifier que le reçu local reste disponible hors ligne." data-zh="在线激活一次，然后确认本地凭证在离线时仍可用。">Activate once online, then confirm the local receipt remains available offline.</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="runlu-tool-messages.js?v=20261002"></script><script>var ui=window.RUNLUToolMessages;

(function(){var state=document.getElementById('state'),detail=document.getElementById('detail'),btn=document.getElementById('activate'),openBtn=document.getElementById('open'),STORAGE='runlu-next-license-pilot-v2',URL='https://ekrnknlawekeoszzkamd.supabase.co',KEY='sb_publishable_Jr12gnQ7UrU6Wv9xz4L1aA_bcTZiGqn';
function fail(m){ui.set(state,'Pilot error');state.className='bad';ui.set(detail,m)}
if(!window.supabase){fail('Supabase library did not load. Refresh once.');return}
var client=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
function saved(){try{return JSON.parse(localStorage.getItem(STORAGE)||'null')}catch(e){return null}}
function deviceLabel(){var ua=navigator.userAgent||'',p=navigator.platform||'',standalone=window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches;var dev=/iPhone/i.test(ua)?'iPhone':/iPad/i.test(ua)?'iPad':/Mac/i.test(p)?'Mac':/Win/i.test(p)?'Windows PC':'Device';var br=/Edg/i.test(ua)?'Edge':/CriOS/i.test(ua)?'Chrome':/Chrome/i.test(ua)?'Chrome':/Safari/i.test(ua)?'Safari':'Browser';return dev+' · '+(standalone?'Home Screen':br)}
function id(){var x=localStorage.getItem('runlu-next-device-id');if(!x){x=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'ios-'+Date.now()+'-'+Math.random().toString(36).slice(2);localStorage.setItem('runlu-next-device-id',x)}return x}
function ready(r,msg){ui.set(state,'Activated · offline-ready');state.className='ok';ui.set(detail,msg||'Local activation receipt found for {code}.',{code:r.license_code});btn.style.display='none';openBtn.style.display='inline-block'}
async function boot(){var r=saved();if(r&&r.activation_receipt&&r.license_code){if(!navigator.onLine){ready(r,'Offline grace · local activation receipt accepted.');return}try{var vr=await fetch(URL+'/functions/v1/runlu-license',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'verify_receipt',product_key:'next-v1-0',activation_receipt:r.activation_receipt})});var vp=await vr.json();if(vr.ok&&vp.ok){r.last_verified_at=vp.verified_at;localStorage.setItem(STORAGE,JSON.stringify(r));ready(r,'License verified online · offline-ready.');return}if(vp.error==='activation_released'||vp.error==='license_inactive'){localStorage.removeItem(STORAGE);ui.set(state,'Activation released');state.className='bad';ui.set(detail,'This activation was released from RUNLU Account. Activate again if a slot is available.');btn.style.display='inline-block';return}}catch(e){ready(r,'Verification unavailable · using local offline receipt.');return}}try{var g=await client.auth.getSession();if(!g.data||!g.data.session){ui.set(state,'Sign in required');detail.removeAttribute('data-en');detail.removeAttribute('data-zh');detail.removeAttribute('data-fr');detail.removeAttribute('data-es');detail.replaceChildren();var lead=document.createElement('span'),link=document.createElement('a'),tail=document.createElement('span');ui.set(lead,'Sign in to ');link.href='account.html';link.textContent='RUNLU Account';ui.set(tail,', then return here and refresh.');detail.append(lead,link,tail);return}ui.set(state,'Ready to activate');ui.set(detail,'Account session found. Tap the button once.');btn.style.display='inline-block'}catch(e){fail('Session check failed: {error}');ui.set(detail,'Session check failed: {error}',{error:e.message||e})}}
btn.addEventListener('click',async function(){btn.disabled=true;ui.set(state,'Activating…');ui.set(detail,'Contacting RUNLU License…');try{var g=await client.auth.getSession(),s=g.data&&g.data.session;if(!s)throw new Error('Sign in to RUNLU Account first.');var fp=['next-pilot',id(),navigator.platform||'mobile',(screen.width||0)+'x'+(screen.height||0)].join('|');var res=await fetch(URL+'/functions/v1/runlu-license',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token},body:JSON.stringify({action:'activate',product_key:'next-v1-0',device_fingerprint:fp,device_label:deviceLabel(),build:'NEXT-LICENSE-PILOT-4'})});var p=await res.json();if(!res.ok||!p.ok)throw new Error(p.error||('HTTP '+res.status));var r={license_code:p.license_code,activation_receipt:p.activation_receipt,activated_at:new Date().toISOString(),product_key:'next-v1-0'};localStorage.setItem(STORAGE,JSON.stringify(r));ready(r)}catch(e){ui.set(state,'Activation failed');state.className='bad';if(e.message==='Sign in to RUNLU Account first.'){ui.set(detail,e.message)}else{ui.set(detail,'Error details: {error}',{error:e.message||String(e)})}btn.disabled=false}});
boot()})();
</script><script src="runlu-language.js?v=2.2"></script></body></html>
