<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUNLU NEXT License Pilot</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:680px;margin:40px auto;padding:20px;background:#f7f7f5;color:#171717}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:24px;margin:16px 0}button,a.btn{display:inline-block;padding:12px 18px;border-radius:10px;border:0;background:#111;color:#fff;text-decoration:none;font-weight:700}.muted{color:#666}.ok{color:#176b3a}.bad{color:#a21d1d}</style></head><body><h1>RUNLU NEXT · License Pilot</h1><p class="muted">Experimental activation shell. Production NEXT is unchanged.</p><div class="card"><h2 id="state">Starting…</h2><p id="detail" class="muted">Pilot build 4</p><button id="activate" type="button" style="display:none">Activate this device</button> <a id="open" class="btn" href="next.html" style="display:none">Open NEXT</a></div><div class="card"><strong>Test goal</strong><p>Activate once online, then confirm the local receipt remains available offline.</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(function(){var state=document.getElementById('state'),detail=document.getElementById('detail'),btn=document.getElementById('activate'),openBtn=document.getElementById('open'),STORAGE='runlu-next-license-pilot-v2',URL='https://ekrnknlawekeoszzkamd.supabase.co',KEY='sb_publishable_Jr12gnQ7UrU6Wv9xz4L1aA_bcTZiGqn';
function fail(m){state.textContent='Pilot error';state.className='bad';detail.textContent=m}
if(!window.supabase){fail('Supabase library did not load. Refresh once.');return}
var client=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
function saved(){try{return JSON.parse(localStorage.getItem(STORAGE)||'null')}catch(e){return null}}
function deviceLabel(){var ua=navigator.userAgent||'',p=navigator.platform||'',standalone=window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches;var dev=/iPhone/i.test(ua)?'iPhone':/iPad/i.test(ua)?'iPad':/Mac/i.test(p)?'Mac':/Win/i.test(p)?'Windows PC':'Device';var br=/Edg/i.test(ua)?'Edge':/CriOS/i.test(ua)?'Chrome':/Chrome/i.test(ua)?'Chrome':/Safari/i.test(ua)?'Safari':'Browser';return dev+' · '+(standalone?'Home Screen':br)}
function id(){var x=localStorage.getItem('runlu-next-device-id');if(!x){x=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'ios-'+Date.now()+'-'+Math.random().toString(36).slice(2);localStorage.setItem('runlu-next-device-id',x)}return x}
function ready(r,msg){state.textContent='Activated · offline-ready';state.className='ok';detail.textContent=msg||('Local activation receipt found for '+r.license_code+'.');btn.style.display='none';openBtn.style.display='inline-block'}
async function boot(){var r=saved();if(r&&r.activation_receipt&&r.license_code){if(!navigator.onLine){ready(r,'Offline grace · local activation receipt accepted.');return}try{var vr=await fetch(URL+'/functions/v1/runlu-license',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'verify_receipt',product_key:'next-v1-0',activation_receipt:r.activation_receipt})});var vp=await vr.json();if(vr.ok&&vp.ok){r.last_verified_at=vp.verified_at;localStorage.setItem(STORAGE,JSON.stringify(r));ready(r,'License verified online · offline-ready.');return}if(vp.error==='activation_released'||vp.error==='license_inactive'){localStorage.removeItem(STORAGE);state.textContent='Activation released';state.className='bad';detail.textContent='This activation was released from RUNLU Account. Activate again if a slot is available.';btn.style.display='inline-block';return}}catch(e){ready(r,'Verification unavailable · using local offline receipt.');return}}try{var g=await client.auth.getSession();if(!g.data||!g.data.session){state.textContent='Sign in required';detail.innerHTML='Sign in to <a href="account.html">RUNLU Account</a>, then return here and refresh.';return}state.textContent='Ready to activate';detail.textContent='Account session found. Tap the button once.';btn.style.display='inline-block'}catch(e){fail('Session check failed: '+(e.message||e))}}
btn.addEventListener('click',async function(){btn.disabled=true;state.textContent='Activating…';detail.textContent='Contacting RUNLU License…';try{var g=await client.auth.getSession(),s=g.data&&g.data.session;if(!s)throw new Error('Sign in to RUNLU Account first.');var fp=['next-pilot',id(),navigator.platform||'mobile',(screen.width||0)+'x'+(screen.height||0)].join('|');var res=await fetch(URL+'/functions/v1/runlu-license',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token},body:JSON.stringify({action:'activate',product_key:'next-v1-0',device_fingerprint:fp,device_label:deviceLabel(),build:'NEXT-LICENSE-PILOT-4'})});var p=await res.json();if(!res.ok||!p.ok)throw new Error(p.error||('HTTP '+res.status));var r={license_code:p.license_code,activation_receipt:p.activation_receipt,activated_at:new Date().toISOString(),product_key:'next-v1-0'};localStorage.setItem(STORAGE,JSON.stringify(r));ready(r)}catch(e){state.textContent='Activation failed';state.className='bad';detail.textContent=e.message||String(e);btn.disabled=false}});
boot()})();
</script></body></html>
