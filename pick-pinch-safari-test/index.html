<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUNLU Pick & Pinch Safari Test</title><style>body{margin:0;background:#13252d;color:#f5f0df;font:16px system-ui}main{max-width:540px;margin:auto;padding:20px}h1{color:#eac36d}#board{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#b99b6d;padding:12px;border:9px solid #785d3d;border-radius:15px}#board button{aspect-ratio:1;border:0;background:transparent;font-size:clamp(19px,7vw,36px);padding:0;touch-action:manipulation}button{cursor:pointer}#board button.sel{background:#f6e6a655;border-radius:50%}.actions{display:flex;gap:8px;margin-top:18px}.actions button{padding:13px;background:#355664;color:white;border:1px solid #7795a0;border-radius:10px}#status,#boot{line-height:1.5}#boot{color:#a5e4bc}</style><main><h1>PICK & PINCH</h1><p>RUNLU PLAY · Safari interactive test v0.6</p><p id="boot">JS NOT STARTED / 脚本尚未启动</p><h2>第 1 关 · 一挑双吃</h2><p id="status">正在初始化…</p><div id="board"></div><div class="actions"><button id="hint">💡 提示</button><button id="reset">↻ 重来</button></div><p>操作：点击红棋，再点击它正下方的空位。成功后两颗蓝棋同时消失。</p></main><script>(function(){'use strict';var boot=document.getElementById('boot'),status=document.getElementById('status'),board=document.getElementById('board');window.onerror=function(m){boot.textContent='ERROR: '+m;boot.style.color='#ff9999'};var cells=[],selected=-1;function start(){cells=Array(25).fill(0);cells[8]=1;cells[12]=-1;cells[14]=-1;selected=-1;draw();status.textContent='请选择红色棋子';boot.textContent='✓ JavaScript running / 脚本已启动'}function draw(){board.textContent='';for(var i=0;i<25;i++){(function(i){var b=document.createElement('button');b.type='button';b.textContent=cells[i]===1?'🔴':cells[i]===-1?'🔵':'·';b.setAttribute('aria-label','point '+(i+1));if(selected===i)b.className='sel';b.addEventListener('click',function(){tap(i)});board.appendChild(b)})(i)}}function tap(i){if(cells[i]===1){selected=i;status.textContent='已选红棋，请点下方空位';draw();return}if(selected<0)return;if(cells[i]!==0||Math.abs(Math.floor(i/5)-Math.floor(selected/5))+Math.abs(i%5-selected%5)!==1){status.textContent='只能走到相邻空位';return}cells[selected]=0;cells[i]=1;selected=-1;if(i===13&&cells[12]===-1&&cells[14]===-1){cells[12]=0;cells[14]=0;status.textContent='🎉 挑成功！第一关通过！'}else{status.textContent='移动成功，继续尝试'}draw()}document.getElementById('hint').addEventListener('click',function(){status.textContent='提示：红棋向下移动一格'});document.getElementById('reset').addEventListener('click',start);start()})();</script></html>
