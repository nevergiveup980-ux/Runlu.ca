name: Flooring Weekly Scheduling Board V0.6.2r1

on:
  pull_request:
    paths:
      - 'flooring/weekly-schedule-v062.js'
      - 'flooring/index-v062-weekly-schedule.html'
      - 'flooring/weekly-schedule-v062-sidebar-r1.js'
      - 'flooring/index-v062r1-weekly-schedule.html'
      - 'scripts/run-flooring-weekly-schedule-v062.mjs'
      - 'scripts/run-flooring-weekly-schedule-v062r1.mjs'
      - '.github/workflows/flooring-weekly-schedule-v062.yml'
      - '.github/workflows/flooring-weekly-schedule-v062r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-schedule-v062r1-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check V0.6.2r1
        run: |
          node --check flooring/weekly-schedule-v062.js
          node --check flooring/weekly-schedule-v062-sidebar-r1.js
          node --check scripts/run-flooring-weekly-schedule-v062.mjs
          node --check scripts/run-flooring-weekly-schedule-v062r1.mjs
      - name: Run base V0.6.2 gate
        run: node scripts/run-flooring-weekly-schedule-v062.mjs
      - name: Run V0.6.2r1 sidebar gate
        run: node scripts/run-flooring-weekly-schedule-v062r1.mjs
