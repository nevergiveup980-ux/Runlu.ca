name: RUNLU Memory Integrity

on:
  push:
    branches: [main]
    paths:
      - 'RUNLU_DECISION_LOG.jsonl'
      - 'RUNLU_EVOLUTION_RECORD.md'
      - 'RUNLU_OPERATING_CHARTER.md'
      - 'RUNLU_KNOWLEDGE_MAP.json'
      - 'view-catalog.js'
      - 'health.html'
      - 'scripts/check-decision-log.mjs'
      - 'scripts/check-knowledge-map.mjs'
      - 'scripts/report-decision-memory.mjs'
      - 'scripts/report-runlu-state.mjs'
      - '.github/workflows/runlu-memory-integrity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'RUNLU_DECISION_LOG.jsonl'
      - 'RUNLU_EVOLUTION_RECORD.md'
      - 'RUNLU_OPERATING_CHARTER.md'
      - 'RUNLU_KNOWLEDGE_MAP.json'
      - 'view-catalog.js'
      - 'health.html'
      - 'scripts/check-decision-log.mjs'
      - 'scripts/check-knowledge-map.mjs'
      - 'scripts/report-decision-memory.mjs'
      - 'scripts/report-runlu-state.mjs'
      - '.github/workflows/runlu-memory-integrity.yml'
  schedule:
    - cron: '0 15 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-memory:
    name: Validate institutional memory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate decision log
        run: node scripts/check-decision-log.mjs
      - name: Validate knowledge map
        run: node scripts/check-knowledge-map.mjs
      - name: Report decision-memory retrospective signal
        run: node scripts/report-decision-memory.mjs
      - name: Report RUNLU operational state
        run: node scripts/report-runlu-state.mjs
      - name: Confirm governance records exist
        run: |
          test -s RUNLU_OPERATING_CHARTER.md
          test -s RUNLU_EVOLUTION_RECORD.md
          test -s RUNLU_DECISION_LOG.jsonl
          test -s RUNLU_KNOWLEDGE_MAP.json
