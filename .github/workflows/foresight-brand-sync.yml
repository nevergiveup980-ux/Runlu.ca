name: Sync Foresight public branding
on:
  push:
    paths:
      - '.github/workflows/foresight-brand-sync.yml'
permissions:
  contents: write
jobs:
  brand-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish public-facing Foresight branding
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = sorted(Path('.').glob('guanshi*.html'))
          changed=[]
          for p in pages:
              text=p.read_text(encoding='utf-8')
              old=text
              # User-facing product name is title case; RUNLU lockup remains uppercase.
              text=text.replace('FORESIGHT','Foresight')
              text=text.replace('RUNLU Foresight','RUNLU FORESIGHT')
              # Keep the main page concise and bilingual: RUNLU FORESIGHT · 观势.
              if p.name=='guanshi.html':
                  text=text.replace('RUNLU FORESIGHT · Foresight —','RUNLU FORESIGHT —')
                  text=text.replace('RUNLU FORESIGHT · 观势 · Foresight','RUNLU FORESIGHT · 观势')
              if text != old:
                  p.write_text(text,encoding='utf-8')
                  changed.append(p.name)

          print('Polished Foresight casing in:')
          for name in changed: print(' -',name)
          if not changed:
              raise SystemExit('No Foresight casing changes were needed')
          PY
      - name: Commit branding polish
        run: |
          git config user.name "RUNLU maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add guanshi*.html
          git commit -m "Polish public Foresight brand casing"
          git push