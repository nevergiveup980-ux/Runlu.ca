name: Flooring Quote V0.4.03i Frozen Stable
on:
  pull_request:
    paths:
      - 'flooring/index-v0403-release.html'
      - 'flooring/index-v0403i-quote-stable-frozen.html'
      - 'flooring/quote-dual-entry-v0403i-stable-frozen.js'
      - 'flooring/QUOTE_V0403I_FROZEN.md'
      - 'scripts/run-flooring-quote-v0403i-frozen.mjs'
      - '.github/workflows/flooring-quote-v0403i-frozen.yml'
  workflow_dispatch:
jobs:
  frozen-quote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify frozen blob identities
        run: |
          test "$(git hash-object flooring/index-v0403i-quote-stable-frozen.html)" = "f6adde9851d24af4ae45cacff2952e771f9dc74a"
          test "$(git hash-object flooring/quote-dual-entry-v0403i-stable-frozen.js)" = "79a86661d19f30caa6b34cfd6accf5849d659a82"
      - name: Run frozen Quote regression gate
        run: node scripts/run-flooring-quote-v0403i-frozen.mjs
