name: RUNLU STAGE AI Director Tests
on:
  push:
    branches: [stage-2-engine-prototype]
    paths:
      - 'stage-2/ai-director/**'
      - '.github/workflows/stage-ai-director.yml'
  pull_request:
    paths:
      - 'stage-2/ai-director/**'
      - '.github/workflows/stage-ai-director.yml'
  workflow_dispatch:
jobs:
  novel-parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run AI Director parser tests
        run: node --test stage-2/ai-director/*.test.mjs
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install Chromium for browser smoke test
        run: npx playwright install --with-deps chromium
      - name: Run real browser interaction tests
        run: npx playwright test stage-2/ai-director/control-center.browser.spec.mjs stage-2/ai-director/recovery-review.browser.spec.mjs --browser chromium --workers 1 --reporter line
  pilot-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install offline media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render and validate 180-second pilot
        env:
          RUNLU_STAGE_STRESS: '1'
          RUNLU_PILOT_OUTPUT: ${{ runner.temp }}/runlu-pilot-180s.mp4
        run: node --test stage-2/ai-director/pilot-render.test.mjs
      - name: Upload validated engineering pilot
        uses: actions/upload-artifact@v4
        with:
          name: runlu-stage-engineering-pilot-180s
          path: ${{ runner.temp }}/runlu-pilot-180s.mp4
          if-no-files-found: error
          retention-days: 7
