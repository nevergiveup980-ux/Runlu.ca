name: Deerfoot Paper Checkpoints V2
on:
  pull_request:
    paths:
      - 'flooring/deerfoot-paper-reference-calibration-v1.html'
      - 'flooring/deerfoot-paper-checkpoints-v2.css'
      - 'flooring/deerfoot-paper-checkpoints-v2.js'
      - 'scripts/run-deerfoot-paper-checkpoints-v2.mjs'
      - '.github/workflows/deerfoot-paper-checkpoints-v2.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/run-deerfoot-paper-checkpoints-v2.mjs
