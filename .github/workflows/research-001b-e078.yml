name: Research 001B E078 Dependence-Aware Uncertainty
on:
  push:
    branches: [research-001-experiment-001]
    paths:
      - "research/001/experiment-078/**"
      - ".github/workflows/research-001b-e078.yml"
  pull_request:
    paths:
      - "research/001/experiment-078/**"
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node research/001/experiment-078/selftest.mjs
