name: Finalize Last One cover OG

on:
  push:
    branches: [feature/last-one-four-language-covers]
    paths: [.github/workflows/finalize-last-one-cover-og.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/last-one-four-language-covers
      - name: Set novel social image to cover
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('last-one-to-leave/index.html')
          s=p.read_text(encoding='utf-8')
          old='<meta property="og:image" content="https://runlu.ca/runlu-hero.png">'
          new='<meta property="og:image" content="https://runlu.ca/last-one-to-leave/covers/cover-en.webp">'
          if old not in s and new not in s:
              raise SystemExit('OG image tag not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'last-one-to-leave/covers/cover-en.webp' last-one-to-leave/index.html
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'RUNLU automation'
          git config user.email 'actions@users.noreply.github.com'
          git add last-one-to-leave/index.html
          git rm .github/workflows/finalize-last-one-cover-og.yml
          git commit -m 'Use novel cover for social sharing'
          git push origin HEAD:feature/last-one-four-language-covers
