name: Flooring Smart Carpet Advisor V1 Lab
on:
  pull_request:
    paths:
      - 'flooring/smart-carpet-advisor-v1-lab.js'
      - 'scripts/run-flooring-smart-carpet-advisor-v1-lab.mjs'
      - '.github/workflows/flooring-smart-carpet-advisor-v1-lab.yml'
  push:
    branches: [main]
    paths:
      - 'flooring/smart-carpet-advisor-v1-lab.js'
      - 'scripts/run-flooring-smart-carpet-advisor-v1-lab.mjs'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/run-flooring-smart-carpet-advisor-v1-lab.mjs
