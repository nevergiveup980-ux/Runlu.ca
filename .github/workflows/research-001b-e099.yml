name: Research 001B E099 Model Multiplicity
on:
  push:
    branches: [research-001-experiment-001]
    paths:
      - "research/001/experiment-099/**"
      - ".github/workflows/research-001b-e099.yml"
  pull_request:
    paths:
      - "research/001/experiment-099/**"
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node research/001/experiment-099/selftest.mjs
