name: Import Last One covers

on:
  push:
    branches: [feature/last-one-four-language-covers]
    paths: [.github/workflows/import-last-one-covers.yml]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/last-one-four-language-covers
      - name: Download optimized cover assets
        run: |
          set -euo pipefail
          mkdir -p last-one-to-leave/covers
          curl -fL --retry 3 -o last-one-to-leave/covers/cover-zh.webp 'https://at.adobe.com/nCraZxcy6F4D2Ex6'
          curl -fL --retry 3 -o last-one-to-leave/covers/cover-en.webp 'https://at.adobe.com/CKreWYwutO9xgNUR'
          curl -fL --retry 3 -o last-one-to-leave/covers/cover-fr.webp 'https://at.adobe.com/j6tmTrb6XErdIBLZ'
          curl -fL --retry 3 -o last-one-to-leave/covers/cover-es.webp 'https://at.adobe.com/kQeEdIeNFxQtdeIU'
          test -s last-one-to-leave/covers/cover-zh.webp
          test -s last-one-to-leave/covers/cover-en.webp
          test -s last-one-to-leave/covers/cover-fr.webp
          test -s last-one-to-leave/covers/cover-es.webp
      - name: Commit covers and remove one-time importer
        run: |
          git config user.name 'RUNLU automation'
          git config user.email 'actions@users.noreply.github.com'
          git add last-one-to-leave/covers/
          git rm .github/workflows/import-last-one-covers.yml
          git commit -m 'Add four-language covers for The Last One to Leave'
          git push origin HEAD:feature/last-one-four-language-covers
