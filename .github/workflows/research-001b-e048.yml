name: Research 001B E048 Near-Optimal Equivalence

on:
  push:
    branches: [research-001-experiment-001]
    paths:
      - "research/001/experiment-048/**"
      - ".github/workflows/research-001b-e048.yml"
  pull_request:
    paths:
      - "research/001/experiment-048/**"

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run E048 near-optimal self-test
        run: node research/001/experiment-048/selftest.mjs
