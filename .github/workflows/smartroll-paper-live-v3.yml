name: SmartRoll Paper Live Readonly V3
on:
  pull_request:
    paths:
      - 'flooring/smartroll-paper-multirow-preview-v2.js'
      - 'flooring/index-smartroll-paper-multirow-preview-v2.html'
      - 'flooring/smart-cut-preview-live-inventory-v2.js'
      - 'scripts/run-smartroll-paper-live-v3.mjs'
      - '.github/workflows/smartroll-paper-live-v3.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/run-smartroll-paper-live-v3.mjs
