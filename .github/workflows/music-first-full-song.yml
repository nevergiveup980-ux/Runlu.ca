name: RUNLU Voice — two brand works, one pass
on:
  workflow_dispatch:
    inputs:
      execute_paid_generation:
        description: 'YES authorizes two RUNLU tracks once each; listed USD 0.16 total, no retries'
        required: true
        type: choice
        default: 'NO'
        options: ['NO', 'YES']
permissions:
  contents: read
concurrency:
  group: runlu-voice-brand-pair-20261115
  cancel-in-progress: false
jobs:
  runlu-voice:
    if: ${{ inputs.execute_paid_generation == 'YES' && github.run_attempt == 1 && github.ref == 'refs/heads/feature/runlu-voice-brand-music-20261115' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline composition and transport tests, no API calls
        run: |
          python music/brand/runlu-voice-20261115/verify.py
          python music/brand/runlu-voice-20261115/test_generate_once.py
          python music/brand/runlu-voice-20261115/generate_once.py --output media-local/runlu-voice-output
      - name: Prepare decoder before any paid request
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate instrumental then duet once each, no retries
        env:
          RUNLU_MUSIC_GEMINI_API_KEY: ${{ secrets.RUNLU_MUSIC_GEMINI_API_KEY }}
        run: python music/brand/runlu-voice-20261115/generate_once.py --output media-local/runlu-voice-output --confirm-paid
      - name: Preserve real audio, provider text, and factual ledger
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: runlu-voice-brand-pair-${{ github.run_id }}
          path: media-local/runlu-voice-output/
          if-no-files-found: warn
          retention-days: 14
  package-existing-audio:
    if: ${{ inputs.execute_paid_generation == 'NO' && github.run_attempt == 1 && github.ref == 'refs/heads/feature/runlu-voice-brand-music-20261115' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download previously generated pair, no provider access
        uses: actions/download-artifact@v4
        with:
          name: runlu-voice-brand-pair-43751796017
          path: media-local/existing-brand-pair/
          run-id: 43751796017
          github-token: ${{ github.token }}
      - name: Verify source hashes and package existing files only
        run: python music/brand/runlu-voice-20261115/package_review.py --source media-local/existing-brand-pair --output media-local/runlu-voice-listening-pack-v1
      - name: Save phone-friendly listening pack
        uses: actions/upload-artifact@v4
        with:
          name: runlu-voice-listening-pack-v1-${{ github.run_id }}
          path: media-local/runlu-voice-listening-pack-v1/RUNLU-Voice-Listening-Pack-v1.zip
          if-no-files-found: error
          retention-days: 14
