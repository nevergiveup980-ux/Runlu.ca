name: RUNLU Music — first full song (manual)
on:
  workflow_dispatch:
    inputs:
      execute_paid_generation:
        description: 'Type YES to authorize exactly one potentially billable Lyria 3.5 request'
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'YES'
jobs:
  first-song:
    if: ${{ inputs.execute_paid_generation == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: runlu-first-full-song
      cancel-in-progress: false
    defaults:
      run:
        working-directory: music/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify branch and API contract tests
        run: |
          test "${GITHUB_REF_NAME}" = "feature/music-studio-mvp"
          npm test
      - name: Check secret is configured (never print value)
        env:
          GEMINI_API_KEY: ${{ secrets.RUNLU_MUSIC_GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "RUNLU_MUSIC_GEMINI_API_KEY is missing; no paid request sent."
            exit 2
          fi
      - name: Generate one original Mandarin full song
        env:
          GEMINI_API_KEY: ${{ secrets.RUNLU_MUSIC_GEMINI_API_KEY }}
          MUSIC_GENERATION_ENABLED: 'true'
          MUSIC_TEST_APPROVED: 'true'
          MUSIC_FULL_SONG_MODEL_VERIFIED: 'true'
        run: node first-full-song-smoke.js --live
      - name: Upload private short-lived audio artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: runlu-first-full-song-private
          path: music/api/runlu-first-full-song.local.mp3
          if-no-files-found: error
          retention-days: 1
