name: One-time HEALTH 009 navigation repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-health-009-nav-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add missing HEALTH VIEW 009 landing link
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('health.html')
          s=p.read_text(encoding='utf-8')
          needle='    <a href="health-view-008-after-weight-loss.html" data-en="View 008 · Maintenance" data-zh="观察 008 · 维持" data-fr="Regard 008 · Maintien" data-es="Vista 008 · Mantenimiento">View 008 · Maintenance</a>\n'
          addition='    <a href="health-view-009-recovery-margin.html" data-en="View 009 · Recovery" data-zh="观察 009 · 恢复余量" data-fr="Regard 009 · Récupération" data-es="Vista 009 · Recuperación">View 009 · Recovery</a>\n'
          if addition in s:
              print('HEALTH VIEW 009 link already present; no change needed.')
          elif needle in s:
              p.write_text(s.replace(needle, needle+addition, 1), encoding='utf-8')
              print('HEALTH VIEW 009 link inserted.')
          else:
              raise SystemExit('Expected HEALTH VIEW 008 navigation anchor not found; refusing unsafe patch.')
          PY
      - name: Commit repair if needed
        run: |
          if git diff --quiet -- health.html; then exit 0; fi
          git config user.name 'RUNLU Site QA'
          git config user.email 'actions@users.noreply.github.com'
          git add health.html
          git commit -m 'Repair HEALTH VIEW 009 landing navigation'
          git push
