name: Flooring Quote Stacked Entry V0.4.03h
on:
  pull_request:
    paths:
      - 'flooring/quote-dual-entry-v0403.js'
      - 'flooring/index-v0403-quote.html'
      - 'scripts/run-flooring-quote-stacked-entry-v0403h.mjs'
      - '.github/workflows/flooring-quote-stacked-entry-v0403h.yml'
  workflow_dispatch:
jobs:
  quote-stacked-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run V0.4.03h stacked iPhone Quote gate
        run: node scripts/run-flooring-quote-stacked-entry-v0403h.mjs
