name: Fix home Foresight nav
on:
  push:
    paths:
      - '.github/workflows/fix-home-foresight-nav.yml'
permissions:
  contents: write
jobs:
  fix-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Foresight to desktop and mobile navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          line='      <a href="guanshi.html" data-en="Foresight" data-zh="观势" data-fr="Foresight" data-es="Foresight">Foresight</a>\n'
          anchor='      <a href="lab.html" data-en="Lab" data-zh="实验室">Lab</a>\n'
          if 'href="guanshi.html"' not in s:
              s=s.replace(anchor,anchor+line)
          else:
              import re
              s=re.sub(r'\s*<a href="guanshi\.html"[^>]*>.*?</a>\n?', '\n'+line, s)
          s=s.replace('script.js?v=20260821-market-companion','script.js?v=20260907-foresight-nav')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit navigation fix
        run: |
          git config user.name "RUNLU maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Show Foresight in home navigation"
          git push
