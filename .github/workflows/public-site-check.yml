name: Public site integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: ["release/**", "feature/**"]

permissions:
  contents: read

jobs:
  public-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate sitemap and public internal links
        run: python scripts/check-public-site.py
