name: Site integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "release/**", "feature/**", "agent/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check runlu-language.js
          node --check forum.js
          node --check forum-live-ai.js
          node --check leave-a-note.js
          node --check core/runlu-core.js
          node --check core/runlu-cloud.js
          node --check evidence/reader.js
          node --check last-one-to-leave/cover-language.js
          node --check guanshi-knowledge.js
          node --check guanshi-local-reasoner.js
          node --check guanshi-auto-vault.js
          node --check guanshi-library.js
          node --check guanshi-vault.js
          node --check guanshi-consult.js
          node --check scripts/check-multilingual.mjs
      - name: Enforce complete four-language pages
        run: node scripts/check-multilingual.mjs
      - name: Test GUANSHI local reasoner
        run: node scripts/check-guanshi-local-reasoner.mjs
      - name: Check GUANSHI local knowledge wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          kb = Path('guanshi-knowledge.js').read_text(encoding='utf-8')
          reasoner = Path('guanshi-local-reasoner.js').read_text(encoding='utf-8')
          consult = Path('guanshi-consult.js').read_text(encoding='utf-8')
          library = Path('guanshi-library.html').read_text(encoding='utf-8')
          if "2.0-local-kb-v2" not in kb or "window.GUANSHI_KB" not in kb:
              raise SystemExit('GUANSHI local knowledge index is missing its version/export contract')
          if "runlu_guanshi_local_knowledge_v1" not in kb or "shareWithAnalysis" not in kb:
              raise SystemExit('GUANSHI user local-library storage/consent contract is missing')
          if "2.1-local-reasoner-v1" not in reasoner or "window.GUANSHI_LOCAL_REASONER" not in reasoner:
              raise SystemExit('GUANSHI V2.1 local reasoner export/version contract is missing')
          if "_runlu_local_knowledge_context" not in consult or "GUANSHI_KB?.search" not in consult:
              raise SystemExit('GUANSHI consultation is not using the local knowledge retriever')
          if "GUANSHI_LOCAL_REASONER?.analyze" not in consult or "data-local-only" not in consult or "local-fallback" not in consult:
              raise SystemExit('GUANSHI consultation is not using the V2.1 local reasoning/fallback engine')
          for page in ['guanshi-consult.html','guanshi-traditional-consult.html']:
              text = Path(page).read_text(encoding='utf-8')
              if 'guanshi-knowledge.js?v=20260907-2' not in text:
                  raise SystemExit(f'{page} is not loading the current local knowledge index')
              if 'guanshi-local-reasoner.js?v=20260907-1' not in text or 'data-local-only' not in text:
                  raise SystemExit(f'{page} is missing the V2.1 local reasoner or local-only control')
              if 'guanshi-library.html' not in text:
                  raise SystemExit(f'{page} is missing the Local Library route')
              if 'guanshi-vault.html' not in text:
                  raise SystemExit(f'{page} is missing the Local Vault route')
          if 'guanshi-knowledge.js?v=20260907-2' not in library or 'guanshi-library.js?v=20260907-1' not in library:
              raise SystemExit('Local Library page is missing its scripts')
          if 'guanshi-vault.html' not in library:
              raise SystemExit('Local Library is missing its Local Vault route')
          print('GUANSHI V2.3 local knowledge + local reasoning + consent-controlled library wiring verified.')
          PY
      - name: Check GUANSHI encrypted Local Vault
        run: |
          python - <<'PY'
          from pathlib import Path
          vault = Path('guanshi-vault.html').read_text(encoding='utf-8')
          js = Path('guanshi-vault.js').read_text(encoding='utf-8')
          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          required = ['AES-GCM','PBKDF2','RUNLU-GUANSHI-LOCAL-VAULT-V1','runlu_guanshi_local_knowledge_v1','runlu_guanshi_validation_cases_v1','expected_revision','Restore & merge']
          missing = [x for x in required if x not in js and x not in vault]
          if missing:
              raise SystemExit('GUANSHI Local Vault contract missing: ' + ', '.join(missing))
          if 'guanshi-vault.js?v=20260907-1' not in vault:
              raise SystemExit('Local Vault page is not loading its current client')
          if 'https://runlu.ca/guanshi-vault.html' not in sitemap:
              raise SystemExit('Local Vault is missing from sitemap')
          if 'auth_secret' not in js or 'ciphertext' not in js or 'shareWithAnalysis' in js:
              raise SystemExit('Local Vault encryption/privacy separation contract changed unexpectedly')
          print('GUANSHI V2.2 encrypted cloud vault + cross-device merge contract verified.')
          PY
      - name: Check GUANSHI automatic encrypted backup
        run: |
          python - <<'PY'
          from pathlib import Path
          auto = Path('guanshi-auto-vault.js').read_text(encoding='utf-8')
          vault = Path('guanshi-vault.html').read_text(encoding='utf-8')
          required = ['2.3-auto-vault-v1','indexedDB','deriveAutoKey','AES-GCM','PBKDF2','expected_revision','needs_merge','GUANSHI_AUTO_VAULT']
          missing=[x for x in required if x not in auto]
          if missing:
              raise SystemExit('GUANSHI V2.3 auto-vault contract missing: '+', '.join(missing))
          for token in ['data-auto-vault-enable','data-auto-vault-disable','data-auto-vault-state','guanshi-auto-vault.js?v=20260907-1']:
              if token not in vault:
                  raise SystemExit('Local Vault page missing '+token)
          for page in ['guanshi.html','guanshi-consult.html','guanshi-traditional-consult.html','guanshi-library.html','guanshi-validation.html']:
              body=Path(page).read_text(encoding='utf-8')
              if 'guanshi-auto-vault.js?v=20260907-1' not in body:
                  raise SystemExit(page+' is not loading the auto-vault watcher')
          print('GUANSHI V2.3 opt-in encrypted auto backup wiring verified.')
          PY
      - name: Check Evidence four-language reader package
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, json

          root = Path('evidence')
          data_root = root / 'data'
          expected = {'en', 'zh', 'fr', 'es'}

          required = [
              root / 'index.html', root / 'read.html', root / 'reader.js',
              root / 'cover-apple.jpg'
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit('Missing Evidence assets:\n' + '\n'.join(missing))

          def read_json(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def read_b64_json(path):
              raw = path.read_text(encoding='utf-8').strip()
              decoded = base64.b64decode(raw, validate=True).decode('utf-8')
              return json.loads(decoded)

          for n in range(1, 11):
              key = f'{n:02d}'
              if key == '08':
                  a = read_b64_json(data_root / f'{key}-a.b64')
                  b = read_b64_json(data_root / f'{key}-b.b64')
              else:
                  a = read_json(data_root / f'{key}-a.json')
                  b = read_json(data_root / f'{key}-b.json')
              merged = {**a, **b}
              if set(merged) != expected:
                  raise SystemExit(f'Chapter {key}: expected languages {sorted(expected)}, got {sorted(merged)}')
              for lang, lines in merged.items():
                  if not isinstance(lines, list) or not lines:
                      raise SystemExit(f'Chapter {key} {lang}: empty or invalid content')
                  if not all(isinstance(x, str) and x.strip() for x in lines):
                      raise SystemExit(f'Chapter {key} {lang}: contains empty/non-text paragraph')
                  if any('\ufffd' in x for x in lines):
                      raise SystemExit(f'Chapter {key} {lang}: contains Unicode replacement characters')

          index = (root / 'index.html').read_text(encoding='utf-8')
          notes = Path('notes.html').read_text(encoding='utf-8')
          if 'cover-apple.jpg' not in index:
              raise SystemExit('Evidence index is not using the Apple Books-aligned JPEG cover')
          if '/evidence/cover-apple.jpg' not in notes:
              raise SystemExit('Stories shelf is not using the Apple Books-aligned JPEG cover')

          print('Evidence chapters 01–10: four languages and JPEG cover references verified.')
          PY
      - name: Check sitemap and public internal links
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import xml.etree.ElementTree as ET
          from urllib.parse import urlsplit

          root = Path('.')
          tree = ET.parse(root / 'sitemap.xml')
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag == 'a' and a.get('href'): self.links.append(a['href'])
                  if tag in ('script','link'):
                      key='src' if tag=='script' else 'href'
                      if a.get(key): self.links.append(a[key])

          public_pages=[]
          missing=[]
          for loc in tree.findall('.//sm:loc', ns):
              url=(loc.text or '').strip()
              parsed=urlsplit(url)
              if parsed.netloc != 'runlu.ca':
                  missing.append(f'sitemap host: {url}')
                  continue
              path=parsed.path.lstrip('/')
              if not path:
                  target=root / 'index.html'
              elif path.endswith('/'):
                  target=root / path / 'index.html'
              else:
                  target=root / path
              if not target.exists():
                  missing.append(f'sitemap target: {url} -> {target}')
              elif target.suffix.lower() == '.html':
                  public_pages.append(target)

          for page in public_pages:
              parser=Links(); parser.feed(page.read_text(encoding='utf-8'))
              for href in parser.links:
                  if href.startswith(('#','mailto:','tel:','javascript:')): continue
                  parsed=urlsplit(href)
                  if parsed.scheme in ('http','https'):
                      if parsed.netloc != 'runlu.ca': continue
                      path=parsed.path.lstrip('/')
                      if not path: target=root / 'index.html'
                      elif path.endswith('/'): target=root / path / 'index.html'
                      else: target=root / path
                  else:
                      path=parsed.path
                      if not path: continue
                      target=page.parent / path
                  if not target.exists(): missing.append(f'{page}: {href}')

          if missing:
              raise SystemExit('Missing public-site targets:\n'+'\n'.join(missing))
          print(f'Public site integrity passed for {len(public_pages)} sitemap HTML pages.')
          PY