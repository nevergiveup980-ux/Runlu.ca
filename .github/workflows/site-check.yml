name: Site integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "release/**", "feature/**", "agent/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          for file in *.js scripts/*.mjs; do
            [ -f "$file" ] && node --check "$file"
          done
      - name: Enforce complete four-language pages
        run: node scripts/check-multilingual.mjs
      - name: Check sitemap and internal links
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import xml.etree.ElementTree as ET
          from urllib.parse import urlsplit

          root = Path('.')
          sitemap = root / 'sitemap.xml'
          tree = ET.parse(sitemap)

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'a' and a.get('href'):
                      self.links.append(a['href'])
                  if tag in ('script', 'link'):
                      key = 'src' if tag == 'script' else 'href'
                      if a.get(key):
                          self.links.append(a[key])

          missing = []
          for page in root.rglob('*.html'):
              if any(part.startswith('.') for part in page.parts):
                  continue
              parser = Links()
              parser.feed(page.read_text(encoding='utf-8'))
              for href in parser.links:
                  if href.startswith(('#', 'mailto:', 'http://', 'https://', 'tel:', 'javascript:')):
                      continue
                  path = urlsplit(href).path
                  if not path:
                      continue
                  target = (page.parent / path).resolve()
                  if not target.exists():
                      missing.append(f'{page}: {href}')

          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          for loc in tree.getroot().findall('sm:url/sm:loc', ns):
              url = (loc.text or '').strip()
              parsed = urlsplit(url)
              if parsed.netloc != 'runlu.ca':
                  missing.append(f'sitemap.xml: unexpected host {url}')
                  continue
              path = parsed.path.lstrip('/')
              if not path:
                  target = root / 'index.html'
              elif path.endswith('/'):
                  target = root / path / 'index.html'
              else:
                  target = root / path
              if not target.exists():
                  missing.append(f'sitemap.xml: {url} -> {target}')

          if missing:
              raise SystemExit('Missing or invalid local targets:\n' + '\n'.join(missing))
          print('Site integrity checks passed.')
          PY
