name: Site integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: ["release/**", "feature/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do
            [ -f "$file" ] && node --check "$file"
          done
      - name: Check sitemap and internal links
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import xml.etree.ElementTree as ET
          from urllib.parse import urlsplit

          root = Path('.')
          tree = ET.parse(root / 'sitemap.xml')
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag == 'a' and a.get('href'): self.links.append(a['href'])
                  if tag in ('script','link'):
                      key='src' if tag=='script' else 'href'
                      if a.get(key): self.links.append(a[key])

          missing=[]
          for page in root.rglob('*.html'):
              parser=Links(); parser.feed(page.read_text(encoding='utf-8'))
              for href in parser.links:
                  if href.startswith(('#','mailto:','http://','https://','tel:','javascript:')): continue
                  path=urlsplit(href).path
                  if path and not (page.parent / path).exists(): missing.append(f'{page}: {href}')

          for loc in tree.findall('.//sm:loc', ns):
              url=(loc.text or '').strip(); parsed=urlsplit(url)
              if parsed.netloc != 'runlu.ca': continue
              rel=parsed.path.lstrip('/') or 'index.html'
              if rel.endswith('/'): rel += 'index.html'
              if not (root / rel).exists(): missing.append(f'sitemap: {url}')

          if missing:
              raise SystemExit('Missing local targets:\n'+'\n'.join(sorted(set(missing))))
          print('Site integrity checks passed.')
          PY
