name: Flooring Quote iPhone Grid V0.4.03f
on:
  pull_request:
    paths:
      - 'flooring/quote-dual-entry-v0403.js'
      - 'flooring/index-v0403-quote.html'
      - 'scripts/run-flooring-quote-ios-grid-v0403f.mjs'
      - '.github/workflows/flooring-quote-ios-grid-v0403f.yml'
  workflow_dispatch:
jobs:
  quote-ios-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run V0.4.03f iPhone grid-entry gate
        run: node scripts/run-flooring-quote-ios-grid-v0403f.mjs
