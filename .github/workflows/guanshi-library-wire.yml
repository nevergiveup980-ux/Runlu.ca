name: Wire GUANSHI local library
on:
  push:
    paths:
      - '.github/workflows/guanshi-library-wire.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire library into GUANSHI
        run: |
          python - <<'PY'
          from pathlib import Path

          library_link='<a href="guanshi-library.html" data-en="Local Library" data-zh="本地知识库" data-fr="Bibliothèque locale" data-es="Biblioteca local">Local Library</a>'
          validation='<a href="guanshi-validation.html" data-en="Validation" data-zh="验证" data-fr="Validation" data-es="Validación">Validation</a>'
          for name in ['guanshi-consult.html','guanshi-traditional-consult.html']:
              p=Path(name); text=p.read_text(encoding='utf-8')
              if library_link not in text:
                  if validation not in text: raise SystemExit(f'Validation nav not found in {name}')
                  text=text.replace(validation,library_link+'\n      '+validation,1)
              text=text.replace('guanshi-knowledge.js?v=20260907-1','guanshi-knowledge.js?v=20260907-2')
              p.write_text(text,encoding='utf-8')

          p=Path('guanshi.html'); text=p.read_text(encoding='utf-8')
          if library_link not in text:
              if validation not in text: raise SystemExit('Validation nav not found in guanshi.html')
              text=text.replace(validation,validation+'\n      '+library_link,1)
          text=text.replace('RUNLU GUANSHI · V1.7','RUNLU GUANSHI · V2.0')
          old='<a class="gs-secondary-link" href="guanshi-validation.html" data-en="Validation Lab" data-zh="观势验证台" data-fr="Laboratoire de validation" data-es="Laboratorio de validación">Validation Lab</a>'
          new=old+'\n            <a class="gs-secondary-link" href="guanshi-library.html" data-en="Local Knowledge" data-zh="本地知识库" data-fr="Connaissances locales" data-es="Conocimiento local">Local Knowledge</a>'
          if 'href="guanshi-library.html" data-en="Local Knowledge"' not in text:
              if old not in text: raise SystemExit('Hero validation link not found')
              text=text.replace(old,new,1)
          text=text.replace('Two consultation routes · transparent reasoning · one validation loop','Local-first knowledge · transparent reasoning · one validation loop')
          text=text.replace('两条咨询入口 · 透明判断 · 一个验证闭环','本地知识优先 · 透明判断 · 一个验证闭环')
          text=text.replace('Deux parcours · raisonnement transparent · une boucle de validation','Connaissances locales · raisonnement transparent · une boucle de validation')
          text=text.replace('Dos rutas · razonamiento transparente · un ciclo de validación','Conocimiento local · razonamiento transparente · un ciclo de validación')
          p.write_text(text,encoding='utf-8')

          additions={
          'GUANSHI.md':'''\n### User-controlled local library\n\nV2.0 also adds `guanshi-library.html`. Personal notes are stored under `runlu_guanshi_local_knowledge_v1` in browser `localStorage`. Saving a note does not upload it and does not upgrade its evidence status. A note is eligible to leave the device only when the user explicitly enables **Allow matched excerpt in analysis**; even then, the local retriever must first select it as relevant. Validation cases remain a separate local ledger and are not automatically mixed into the knowledge library.\n''',
          'GUANSHI_CONSULTATION.md':'''\n### User local-library consent boundary\n\n`guanshi-library.html` provides user-controlled browser-local knowledge storage. Each note is local-only by default. A per-note opt-in controls whether a matched excerpt may be included in a consultation request. Notes without that opt-in remain excluded from the analysis payload. The Validation Lab ledger is separate and is never promoted into the knowledge library automatically.\n'''
          }
          for path,block in additions.items():
              p=Path(path); text=p.read_text(encoding='utf-8')
              marker=block.strip().splitlines()[0]
              if marker not in text: p.write_text(text.rstrip()+'\n\n'+block.strip()+'\n',encoding='utf-8')
          PY
          node --check guanshi-knowledge.js
          node --check guanshi-library.js
          node --check guanshi-consult.js
          git config user.name "RUNLU maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add guanshi.html guanshi-consult.html guanshi-traditional-consult.html GUANSHI.md GUANSHI_CONSULTATION.md
          git commit -m "Expose GUANSHI user-controlled local knowledge library"
          git push
