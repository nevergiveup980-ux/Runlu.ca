name: Fix After Threshold cover v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-att-cover-v3.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point pages to verified cover
        shell: python
        run: |
          from pathlib import Path
          files = [Path('notes.html'), *Path('after-threshold').glob('*.html')]
          changed = []
          for p in files:
              s = p.read_text(encoding='utf-8')
              n = s.replace('cover-c-final.jpg', 'att-cover-web-v3.webp')
              if n != s:
                  p.write_text(n, encoding='utf-8')
                  changed.append(str(p))
          print('updated:', ', '.join(changed))
      - name: Commit fix
        run: |
          git config user.name "RUNLU Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add notes.html after-threshold/*.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Use verified After the Threshold cover asset"
            git push
          fi
