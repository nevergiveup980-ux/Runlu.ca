name: RUNLU MUSIC job contract checks
on:
  push:
    paths:
      - 'music-studio-tools/job-contract.mjs'
      - 'music-studio-tools/job-contract.test.mjs'
      - '.github/workflows/runlu-music-job-contract.yml'
  pull_request:
    paths:
      - 'music-studio-tools/job-contract.mjs'
      - 'music-studio-tools/job-contract.test.mjs'
      - '.github/workflows/runlu-music-job-contract.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run music job contract tests
        run: node --test music-studio-tools/job-contract.test.mjs
