name: Research 001B E098 Interaction Failure
on:
  push:
    branches: [research-001-experiment-001]
    paths:
      - "research/001/experiment-098/**"
      - ".github/workflows/research-001b-e098.yml"
  pull_request:
    paths:
      - "research/001/experiment-098/**"
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node research/001/experiment-098/selftest.mjs
