name: Apply Last One covers

on:
  push:
    branches: [feature/last-one-four-language-covers]
    paths: [.github/workflows/apply-last-one-covers.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/last-one-four-language-covers
      - name: Add language-aware covers to novel and Stories
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          novel = Path('last-one-to-leave/index.html')
          text = novel.read_text(encoding='utf-8')
          text = text.replace('https://runlu.ca/runlu-hero.png\" property=\"og:image', 'https://runlu.ca/last-one-to-leave/covers/cover-en.webp\" property=\"og:image')
          text = text.replace('.novel-note{margin-top:1rem;font-size:.92rem;opacity:.78}', '.novel-note{margin-top:1rem;font-size:.92rem;opacity:.78}.novel-cover-panel{display:flex;justify-content:center;padding:2.4rem 1.25rem 0}.novel-cover-panel img{width:min(430px,82vw);height:auto;display:block;border-radius:4px;box-shadow:0 24px 55px rgba(35,28,18,.18)}')
          if 'data-runlu-novel-cover' not in text:
              text = text.replace('</header><main>', '</header><main><section class="novel-cover-panel"><img data-runlu-novel-cover src="/last-one-to-leave/covers/cover-en.webp" alt="The Last One to Leave cover" width="640" height="960" decoding="async" fetchpriority="high"></section>', 1)
          if 'cover-language.js' not in text:
              text = text.replace('</body></html>', '<script src="cover-language.js?v=1"></script></body></html>')
          novel.write_text(text, encoding='utf-8')

          notes = Path('notes.html')
          text = notes.read_text(encoding='utf-8')
          if 'data-runlu-novel-cover' not in text:
              pattern = r'(<a class="field-card" href="last-one-to-leave/">)'
              cover = r'\1<img data-runlu-novel-cover src="/last-one-to-leave/covers/cover-en.webp" alt="The Last One to Leave cover" width="400" height="600" loading="lazy" decoding="async" style="display:block;width:min(100%,240px);height:auto;margin:0 auto 1.15rem;border-radius:3px;box-shadow:0 14px 30px rgba(35,28,18,.14)">'
              text, n = re.subn(pattern, cover, text, count=1)
              if n != 1:
                  raise SystemExit('Could not locate novel 02 card in notes.html')
          if 'last-one-to-leave/cover-language.js' not in text:
              text = text.replace('</body></html>', '<script src="last-one-to-leave/cover-language.js?v=1"></script></body></html>')
          notes.write_text(text, encoding='utf-8')

          js = '''(()=>{
            const covers={
              en:'/last-one-to-leave/covers/cover-en.webp',
              zh:'/last-one-to-leave/covers/cover-zh.webp',
              fr:'/last-one-to-leave/covers/cover-fr.webp',
              es:'/last-one-to-leave/covers/cover-es.webp'
            };
            const alts={
              en:'The Last One to Leave cover',
              zh:'《最后一个下班的人》封面',
              fr:'Couverture de Le Dernier à partir',
              es:'Portada de El último en irse'
            };
            function currentLanguage(){
              const direct=document.documentElement.dataset.runluLanguage;
              if(covers[direct])return direct;
              const select=document.querySelector('[data-runlu-language-select]');
              if(select&&covers[select.value])return select.value;
              try{const saved=localStorage.getItem('runlu_site_language');if(covers[saved])return saved;}catch(error){}
              const html=(document.documentElement.lang||'').toLowerCase();
              if(html.startsWith('zh'))return 'zh';
              if(html.startsWith('fr'))return 'fr';
              if(html.startsWith('es'))return 'es';
              return 'en';
            }
            function sync(){
              const lang=currentLanguage();
              document.querySelectorAll('[data-runlu-novel-cover]').forEach(img=>{
                if(img.getAttribute('src')!==covers[lang])img.setAttribute('src',covers[lang]);
                img.setAttribute('alt',alts[lang]);
              });
            }
            sync();
            window.addEventListener('runlu:languagechange',sync);
            window.addEventListener('pageshow',sync);
          })();
          '''
          Path('last-one-to-leave/cover-language.js').write_text(js, encoding='utf-8')
          PY
      - name: Validate cover wiring
        run: |
          node --check last-one-to-leave/cover-language.js
          grep -q 'data-runlu-novel-cover' last-one-to-leave/index.html
          grep -q 'data-runlu-novel-cover' notes.html
          test -s last-one-to-leave/covers/cover-en.webp
          test -s last-one-to-leave/covers/cover-zh.webp
          test -s last-one-to-leave/covers/cover-fr.webp
          test -s last-one-to-leave/covers/cover-es.webp
      - name: Commit website wiring and remove one-time workflow
        run: |
          git config user.name 'RUNLU automation'
          git config user.email 'actions@users.noreply.github.com'
          git add last-one-to-leave/index.html last-one-to-leave/cover-language.js notes.html
          git rm .github/workflows/apply-last-one-covers.yml
          git commit -m 'Show language-aware covers for The Last One to Leave'
          git push origin HEAD:feature/last-one-four-language-covers
