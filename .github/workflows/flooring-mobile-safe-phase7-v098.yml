name: Flooring Mobile Safe Phase 7 V0.9.8
on:
  pull_request:
    paths:
      - 'flooring/index-v071-pricing-workspace.html'
      - 'flooring/index-v0403-release.html'
      - 'flooring/mobile-safe-fastboot-v0403j.js'
      - 'flooring/mobile-safe-phase7-v0403j.js'
      - 'flooring/warehouse-receipt-ack-v098-safe.js'
      - 'scripts/run-flooring-mobile-safe-phase7-v098.mjs'
      - '.github/workflows/flooring-mobile-safe-phase7-v098.yml'
  workflow_dispatch:
jobs:
  mobile-safe-phase7:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run V0.9.8 verified receipt Phase 7 gate
        run: node scripts/run-flooring-mobile-safe-phase7-v098.mjs
