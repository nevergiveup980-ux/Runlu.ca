name: Wire GUANSHI V2.2 Local Vault
on:
  push:
    paths:
      - '.github/workflows/guanshi-v22-wire.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch GUANSHI routes
        run: |
          python - <<'PY'
          from pathlib import Path

          vault_link='      <a href="guanshi-vault.html" data-en="Local Vault" data-zh="本地保险箱" data-fr="Coffre local" data-es="Bóveda local">Local Vault</a>\n'
          pages=['guanshi.html','guanshi-consult.html','guanshi-traditional-consult.html','guanshi-library.html','guanshi-validation.html']
          for name in pages:
              p=Path(name); text=p.read_text(encoding='utf-8')
              if 'href="guanshi-vault.html"' not in text:
                  i=text.find('</nav>')
                  if i < 0:
                      raise SystemExit(f'{name}: top nav closing tag not found')
                  text=text[:i]+vault_link+text[i:]
              if name in ['guanshi.html','guanshi-consult.html','guanshi-traditional-consult.html','guanshi-library.html']:
                  text=text.replace('RUNLU GUANSHI · V2.1','RUNLU GUANSHI · V2.2').replace('RUNLU GUANSHI · V2.0','RUNLU GUANSHI · V2.2')
              p.write_text(text,encoding='utf-8')

          p=Path('sitemap.xml'); text=p.read_text(encoding='utf-8')
          if 'https://runlu.ca/guanshi-vault.html' not in text:
              block='  <url><loc>https://runlu.ca/guanshi-vault.html</loc></url>\n'
              if '</urlset>' not in text: raise SystemExit('sitemap closing tag missing')
              text=text.replace('</urlset>',block+'</urlset>',1)
              p.write_text(text,encoding='utf-8')
          PY
      - name: Commit routes
        run: |
          git config user.name "RUNLU maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add guanshi.html guanshi-consult.html guanshi-traditional-consult.html guanshi-library.html guanshi-validation.html sitemap.xml
          git commit -m "Connect GUANSHI V2.2 Local Vault routes"
          git push