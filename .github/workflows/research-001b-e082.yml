name: Research 001B E082 Multi-Metric Stress Vector
on:
  push:
    branches: [research-001-experiment-001]
    paths:
      - "research/001/experiment-082/**"
      - ".github/workflows/research-001b-e082.yml"
  pull_request:
    paths:
      - "research/001/experiment-082/**"
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node research/001/experiment-082/selftest.mjs
