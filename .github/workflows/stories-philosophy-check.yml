name: RUNLU Stories Philosophy Article Checks

on:
  pull_request:
    paths:
      - 'notes.html'
      - 'notes/life-is-a-quiet-struggle-against-disorder.html'
      - 'notes/true-wealth-is-the-freedom-to-choose.html'
      - 'notes/the-art-of-letting-go.html'
      - 'notes/the-goodbyes-we-never-notice.html'
      - 'notes/an-ordinary-life-is-not-a-failed-life.html'
      - 'notes/something-to-love-something-to-live-for.html'
      - 'docs/philosophy-life-against-disorder-*.md'
      - 'docs/philosophy-true-wealth-freedom-*.md'
      - 'docs/philosophy-the-art-of-letting-go-*.md'
      - 'docs/philosophy-the-goodbyes-we-never-notice-*.md'
      - 'docs/philosophy-an-ordinary-life-is-not-a-failed-life-*.md'
      - 'docs/philosophy-something-to-love-something-to-live-for-*.md'
      - 'scripts/check-stories-philosophy.mjs'
      - 'scripts/check-stories-philosophy-02.mjs'
      - 'scripts/check-stories-philosophy-03.mjs'
      - 'scripts/check-stories-philosophy-04.mjs'
      - 'scripts/check-stories-philosophy-05.mjs'
      - 'scripts/check-stories-philosophy-06.mjs'
      - 'sitemap.xml'
      - '.github/workflows/stories-philosophy-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  philosophy-article:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate four-language article
        run: |
          node scripts/check-stories-philosophy.mjs
          node scripts/check-stories-philosophy-02.mjs
          node scripts/check-stories-philosophy-03.mjs
          node scripts/check-stories-philosophy-04.mjs
          node scripts/check-stories-philosophy-05.mjs
          node scripts/check-stories-philosophy-06.mjs
