name: RUNLU MUSIC — Golden Echoes free preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  free-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed music test revision
        uses: actions/checkout@v4
        with:
          ref: f1dda51d96a4524bdc2c148b751c45df994d5665
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original duet without API key or billing
        run: python music-studio-tools/preflight_golden_echoes.py
      - name: Run offline provider-response regression tests
        run: python music-studio-tools/test_golden_echoes_offline.py
      - name: Check generator command without contacting provider
        run: |
          python music-studio-tools/generate_full_song.py \
            --project music-studio-tools/when-the-lights-go-down-duet.json \
            --output output/when-the-lights-go-down-duet.mp3
