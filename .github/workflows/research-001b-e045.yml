name: Research 001B E045 Offline Calibration

on:
  push:
    branches: [research-001-experiment-001]
    paths:
      - "research/001/experiment-045/**"
      - ".github/workflows/research-001b-e045.yml"
  pull_request:
    paths:
      - "research/001/experiment-045/**"

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run E045 offline self-test
        run: node research/001/experiment-045/selftest.mjs
