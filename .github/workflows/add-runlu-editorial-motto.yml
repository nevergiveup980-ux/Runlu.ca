name: Add RUNLU editorial motto

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-runlu-editorial-motto.yml'

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add editorial motto to homepage
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          css = Path('styles.css')
          html = index.read_text(encoding='utf-8')
          styles = css.read_text(encoding='utf-8')

          marker = 'id="editorial-motto"'
          section = '''
    <section id="editorial-motto" class="section editorial-motto-section" aria-label="RUNLU editorial principle">
      <div class="editorial-motto-inner">
        <p class="editorial-motto-quote"
          data-en="Trends reveal the subject. Reality provides the material. Practice shapes the point of view. Time decides what remains."
          data-zh="热点让我发现题材，现实让我获得材料，实践让我形成观点，时间决定什么最终留下。"
          data-fr="Les tendances révèlent le sujet. La réalité fournit la matière. La pratique façonne le point de vue. Le temps décide de ce qui demeure."
          data-es="Las tendencias revelan el tema. La realidad aporta la materia. La práctica da forma al punto de vista. El tiempo decide lo que permanece.">Trends reveal the subject. Reality provides the material. Practice shapes the point of view. Time decides what remains.</p>
        <p class="editorial-motto-signature">— RUNLU</p>
      </div>
    </section>

'''

          anchor = '    <section id="about" class="section about-section">'
          if marker not in html:
              if anchor not in html:
                  raise SystemExit('About-section anchor not found; no changes made.')
              html = html.replace(anchor, section + anchor, 1)
              index.write_text(html, encoding='utf-8')

          css_marker = '/* RUNLU editorial motto */'
          css_block = r'''

/* RUNLU editorial motto */
.editorial-motto-section{padding-top:92px;padding-bottom:92px;background:#fbfaf7;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.editorial-motto-inner{max-width:980px;margin:0 auto;text-align:center}
.editorial-motto-quote{margin:0 auto;max-width:940px;font-size:clamp(1.72rem,3.4vw,3.25rem);line-height:1.28;letter-spacing:-.032em;font-weight:500;text-wrap:balance}
.editorial-motto-signature{margin:30px 0 0;color:var(--muted);font-size:.78rem;font-weight:600;letter-spacing:.18em}
@media(max-width:860px){.editorial-motto-section{padding-top:68px;padding-bottom:68px}.editorial-motto-quote{font-size:clamp(1.55rem,7vw,2.35rem);line-height:1.34}.editorial-motto-signature{margin-top:24px}}
'''
          if css_marker not in styles:
              css.write_text(styles.rstrip() + css_block + '\n', encoding='utf-8')

      - name: Commit homepage update
        run: |
          git config user.name "RUNLU Site Steward"
          git config user.email "actions@users.noreply.github.com"
          git add index.html styles.css
          if git diff --cached --quiet; then
            echo "No homepage changes needed."
          else
            git commit -m "Add RUNLU editorial motto to homepage"
            git push
          fi

      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/add-runlu-editorial-motto.yml
          git add .github/workflows/add-runlu-editorial-motto.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove one-time motto workflow"
          git push
