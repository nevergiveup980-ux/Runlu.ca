name: Research 001B E051 Dynamic Fairness State

on:
  push:
    branches: [research-001-experiment-001]
    paths:
      - "research/001/experiment-051/**"
      - ".github/workflows/research-001b-e051.yml"
  pull_request:
    paths:
      - "research/001/experiment-051/**"

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run E051 dynamic-state self-test
        run: node research/001/experiment-051/selftest.mjs
