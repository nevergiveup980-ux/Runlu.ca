name: Flooring Quote Table Entry V0.4.03c
on:
  pull_request:
    paths:
      - 'flooring/quote-dual-entry-v0403.js'
      - 'flooring/index-v0403-quote.html'
      - 'scripts/run-flooring-quote-table-entry-v0403c.mjs'
      - '.github/workflows/flooring-quote-table-entry-v0403c.yml'
  workflow_dispatch:
jobs:
  quote-table-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run V0.4.03c Quote table-entry gate
        run: node scripts/run-flooring-quote-table-entry-v0403c.mjs
