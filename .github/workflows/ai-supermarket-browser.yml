name: AI Supermarket Browser Acceptance
on:
  pull_request:
    paths:
      - 'ai-supermarket.html'
      - 'ai-supermarket.css'
      - 'runlu-language.js'
      - 'scripts/check-ai-supermarket-browser.mjs'
      - '.github/workflows/ai-supermarket-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-ai-supermarket-browser.mjs
      - name: Package offline foundation preview (not deployed)
        if: success()
        run: |
          mkdir -p ai-supermarket-offline-preview
          cp ai-supermarket.html ai-supermarket.css runlu-language.js ai-supermarket-offline-preview/
          printf '%s\n' 'RUNLU AI SUPERMARKET — OFFLINE FOUNDATION PREVIEW' 'Open ai-supermarket.html locally on a computer browser.' 'This ZIP is NOT a public website or an iPhone Safari-hosted preview.' 'The Home link points to index.html on the real site and will not work offline.' 'No third-party integrations, payments, tracking, or deployment.' > ai-supermarket-offline-preview/README.txt
      - name: Upload offline foundation preview bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-supermarket-offline-preview
          path: ai-supermarket-offline-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Upload browser screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-supermarket-browser-evidence
          path: ai-supermarket-browser-evidence/
          if-no-files-found: warn
          retention-days: 14
