name: Flooring Smart Cut Preview V1
on:
  pull_request:
    paths:
      - 'flooring/index-smart-carpet-cut-preview-v1.html'
      - 'flooring/smart-carpet-cut-preview-v1.js'
      - 'scripts/run-flooring-smart-carpet-cut-preview-v1.mjs'
      - '.github/workflows/flooring-smart-cut-preview-v1.yml'
  push:
    branches: [main]
    paths:
      - 'flooring/index-smart-carpet-cut-preview-v1.html'
      - 'flooring/smart-carpet-cut-preview-v1.js'
      - 'scripts/run-flooring-smart-carpet-cut-preview-v1.mjs'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/run-flooring-smart-carpet-cut-preview-v1.mjs
