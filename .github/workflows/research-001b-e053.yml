name: Research 001B E053 Fairness Memory Horizon

on:
  push:
    branches: [research-001-experiment-001]
    paths:
      - "research/001/experiment-053/**"
      - ".github/workflows/research-001b-e053.yml"
  pull_request:
    paths:
      - "research/001/experiment-053/**"

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run E053 memory-horizon self-test
        run: node research/001/experiment-053/selftest.mjs
