name: Research 001B E046 Sampling Audit

on:
  push:
    branches: [research-001-experiment-001]
    paths:
      - "research/001/experiment-046/**"
      - ".github/workflows/research-001b-e046.yml"
  pull_request:
    paths:
      - "research/001/experiment-046/**"

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run E046 sampling-integrity self-test
        run: node research/001/experiment-046/selftest.mjs
