name: Research 001 Track A
on:
  workflow_dispatch:
  push:
    branches: [research-001-experiment-001]
    paths:
      - "research/001/experiment-001/**"
      - "research/001/experiment-004/**"
      - "research/001/experiment-005/**"
      - "research/001/experiment-019/**"
      - "research/001/experiment-020/**"
      - ".github/workflows/research-001-track-a.yml"
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node research/001/experiment-019/audit.mjs
      - name: Exact E004 classical-hull audit
        run: node research/001/experiment-020/exact_audit.mjs | tee research-001-e020.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-001-e020
          path: research-001-e020.json
