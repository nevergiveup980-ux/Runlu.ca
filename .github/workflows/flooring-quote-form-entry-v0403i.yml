name: Flooring Quote Form Entry V0.4.03i
on:
  pull_request:
    paths:
      - 'flooring/quote-dual-entry-v0403.js'
      - 'flooring/index-v0403-quote.html'
      - 'scripts/run-flooring-quote-form-entry-v0403i.mjs'
      - '.github/workflows/flooring-quote-form-entry-v0403i.yml'
  workflow_dispatch:
jobs:
  quote-form-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run V0.4.03i direct Quote form-entry gate
        run: node scripts/run-flooring-quote-form-entry-v0403i.mjs
