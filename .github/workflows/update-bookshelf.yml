name: Update RUNLU bookshelf

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-bookshelf.yml'

permissions:
  contents: write

jobs:
  update-bookshelf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update bookshelf and sitemap
        shell: python
        run: |
          from pathlib import Path

          notes = Path('notes.html')
          text = notes.read_text(encoding='utf-8')

          old_heading = '<h2 data-en="Four books on the RUNLU shelf." data-zh="润庐书架上的四部长篇。" data-fr="Quatre livres dans la bibliothèque RUNLU." data-es="Cuatro libros en la biblioteca RUNLU.">Four books on the RUNLU shelf.</h2>'
          new_heading = '<h2 data-en="Five books on the RUNLU shelf." data-zh="润庐书架上的五部长篇。" data-fr="Cinq livres dans la bibliothèque RUNLU." data-es="Cinco libros en la biblioteca RUNLU.">Five books on the RUNLU shelf.</h2>'
          if old_heading in text:
              text = text.replace(old_heading, new_heading, 1)

          if 'href="after-threshold/"' not in text:
              section_start = text.index('<section class="field-index" aria-label="RUNLU Original Books">')
              grid_marker = '<div class="field-grid">\n'
              insert_at = text.index(grid_marker, section_start) + len(grid_marker)
              card = '''<a class="field-card" href="after-threshold/"><img src="/after-threshold/cover-apple.jpg?v=20260906-1" alt="After the Threshold cover" width="600" height="900" loading="lazy" decoding="async" style="display:block;width:min(100%,240px);height:auto;margin:0 auto 1.15rem;border-radius:3px;box-shadow:0 14px 30px rgba(20,32,52,.18)"><span class="field-no" data-en="RUNLU ORIGINAL · NOVEL 05" data-zh="润庐原创 · 长篇 05" data-fr="ORIGINAL RUNLU · ROMAN 05" data-es="ORIGINAL RUNLU · NOVELA 05">RUNLU ORIGINAL · NOVEL 05</span><div class="copy-en"><h3>After the Threshold</h3><p>A near-future social novel about work, dignity, responsibility, and human value in the decade shaped by AI.</p></div><div class="copy-zh"><h3>《临界之后》</h3><p>一部关于AI重塑未来十年后，工作、尊严、责任与人的价值的近未来社会小说。</p></div><div class="copy-fr"><h3>Après le seuil</h3><p>Un roman social d’anticipation sur le travail, la dignité, la responsabilité et la valeur humaine à l’ère de l’IA.</p></div><div class="copy-es"><h3>Después del umbral</h3><p>Una novela social de futuro cercano sobre el trabajo, la dignidad, la responsabilidad y el valor humano en la era de la IA.</p></div><span class="field-meta" data-en="Published on Apple Books · 51 stores →" data-zh="已上架 Apple Books · 51 个商店 →" data-fr="Publié sur Apple Books · 51 boutiques →" data-es="Publicado en Apple Books · 51 tiendas →">Published on Apple Books · 51 stores →</span></a>\n'''
              text = text[:insert_at] + card + text[insert_at:]

          notes.write_text(text, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          sm = sitemap.read_text(encoding='utf-8')
          if 'https://runlu.ca/after-threshold/' not in sm:
              entry = '  <url>\n    <loc>https://runlu.ca/after-threshold/</loc>\n    <lastmod>2026-09-06</lastmod>\n  </url>\n'
              sm = sm.replace('</urlset>', entry + '</urlset>')
              sitemap.write_text(sm, encoding='utf-8')
      - name: Commit update
        run: |
          git config user.name "RUNLU Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add notes.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add After the Threshold to RUNLU bookshelf"
            git push
          fi
