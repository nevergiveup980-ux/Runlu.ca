name: Flooring Cut Preview Live Readonly V2
on:
  pull_request:
    paths:
      - 'flooring/smart-cut-preview-live-inventory-v2.js'
      - 'flooring/smart-carpet-cut-preview-v1.js'
      - 'flooring/index-smart-carpet-cut-preview-v1.html'
      - 'scripts/run-flooring-cut-preview-live-v2.mjs'
      - '.github/workflows/flooring-cut-preview-live-v2.yml'
  push:
    branches: [main]
    paths:
      - 'flooring/smart-cut-preview-live-inventory-v2.js'
      - 'flooring/smart-carpet-cut-preview-v1.js'
      - 'flooring/index-smart-carpet-cut-preview-v1.html'
      - 'scripts/run-flooring-cut-preview-live-v2.mjs'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/run-flooring-cut-preview-live-v2.mjs
