name: Knowledge Carpet Prototype Tests

on:
  push:
    paths:
      - "knowledge/carpet-*-prototype*.mjs"
      - ".github/workflows/knowledge-carpet-tests.yml"
  pull_request:
    paths:
      - "knowledge/carpet-*-prototype*.mjs"
      - ".github/workflows/knowledge-carpet-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run isolated carpet rule tests
        run: node --test knowledge/carpet-rules-prototype.test.mjs knowledge/carpet-multiroll-prototype.test.mjs
