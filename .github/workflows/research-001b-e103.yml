name: Research 001B E103 Depth Selection Provenance
on:
  push:
    branches: [research-001-experiment-001]
    paths:
      - "research/001/experiment-103/**"
      - ".github/workflows/research-001b-e103.yml"
  pull_request:
    paths:
      - "research/001/experiment-103/**"
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node research/001/experiment-103/selftest.mjs
