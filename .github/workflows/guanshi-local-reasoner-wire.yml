name: Wire GUANSHI V2.1 local reasoning
on:
  push:
    paths:
      - '.github/workflows/guanshi-local-reasoner-wire.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V2.1 wiring patch
        run: python scripts/patch-guanshi-v21.py
      - name: Commit wired files
        run: |
          git config user.name "RUNLU maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add guanshi-consult.js guanshi-consult.html guanshi-traditional-consult.html guanshi.html guanshi-library.html .github/workflows/site-check.yml
          git commit -m "Connect GUANSHI V2.1 local reasoning fallback"
          git push