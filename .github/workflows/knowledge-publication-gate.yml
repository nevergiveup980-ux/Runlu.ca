name: RUNLU Knowledge Publication Gate

on:
  push:
    paths:
      - "knowledge/data/**"
      - "knowledge/editorial/**"
      - "knowledge/reviews/**"
      - "knowledge/validate-publication*.mjs"
      - "knowledge/report-quality.mjs"
      - "knowledge/preview/**"
      - ".github/workflows/knowledge-publication-gate.yml"
  pull_request:
    paths:
      - "knowledge/data/**"
      - "knowledge/editorial/**"
      - "knowledge/reviews/**"
      - "knowledge/validate-publication*.mjs"
      - "knowledge/report-quality.mjs"
      - "knowledge/preview/**"
      - ".github/workflows/knowledge-publication-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test publication eligibility rules
        run: node --test knowledge/validate-publication.test.mjs
      - name: Test four-language editorial preview
        run: node --test knowledge/preview/preview-smoke.test.mjs
      - name: Test RK-0006 editorial preview safety and four-language completeness
        run: node --test knowledge/preview/rk-0006-preview.test.mjs
      - name: Package RK-0006 editorial preview for manual mobile testing
        if: ${{ success() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: rk-0006-editorial-preview-html
          path: knowledge/preview/RK-0006.html
          if-no-files-found: error
          retention-days: 14
      - name: Audit draft and published knowledge records
        run: node knowledge/validate-publication.mjs
      - name: Generate editorial readiness report
        if: always()
        shell: bash
        run: |
          set -o pipefail
          node knowledge/report-quality.mjs | tee knowledge-quality-report.md
      - name: Preserve editorial report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-editorial-quality-report
          path: knowledge-quality-report.md
          if-no-files-found: warn
          retention-days: 30
