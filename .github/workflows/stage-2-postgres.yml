name: RUNLU STAGE PostgreSQL Integration
on:
  push:
    branches: [stage-2-engine-prototype]
    paths:
      - 'stage-2/**'
      - '.github/workflows/stage-2-postgres.yml'
  pull_request:
    paths:
      - 'stage-2/**'
      - '.github/workflows/stage-2-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stage_test
          POSTGRES_PASSWORD: stage_test_only
          POSTGRES_DB: stage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stage_test -d stage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STAGE_TEST_DATABASE_URL: postgres://stage_test:stage_test_only@localhost:5432/stage_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only PostgreSQL driver
        run: npm install --no-save --no-package-lock --ignore-scripts pg@8
      - name: Run PostgreSQL integration test
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-reporter=tap stage-2/postgres.integration.test.mjs stage-2/postgres-delivery.integration.test.mjs stage-2/postgres-audit.integration.test.mjs stage-2/postgres-delivery-e2e.integration.test.mjs stage-2/postgres-rate-limit.integration.test.mjs stage-2/postgres-rate-limit-cleanup.integration.test.mjs stage-2/postgres-rate-limit-cleanup-lock.integration.test.mjs stage-2/postgres-maintenance-distributed.integration.test.mjs | tee stage-2-postgres-results.tap
      - name: Upload PostgreSQL test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-2-postgres-test-results
          path: stage-2-postgres-results.tap
          if-no-files-found: warn
          retention-days: 14
