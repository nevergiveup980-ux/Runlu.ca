name: RUNLU STAGE 2.0 Tests
on:
  push:
    branches: [stage-2-engine-prototype]
    paths:
      - 'stage-2/**'
      - '.github/workflows/stage-2-tests.yml'
  pull_request:
    paths:
      - 'stage-2/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline STAGE tests
        run: node --test stage-2/*.test.mjs
