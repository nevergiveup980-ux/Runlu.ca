name: Flooring Customer Desk Back Navigation
on:
  pull_request:
    paths:
      - 'flooring/index-customer-desk-v1.html'
      - 'scripts/run-flooring-customer-desk-back-0403q.mjs'
      - '.github/workflows/flooring-customer-desk-back-0403q.yml'
  push:
    branches: [main]
    paths:
      - 'flooring/index-customer-desk-v1.html'
      - 'scripts/run-flooring-customer-desk-back-0403q.mjs'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/run-flooring-customer-desk-back-0403q.mjs
