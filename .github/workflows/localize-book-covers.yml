name: Localize RUNLU book covers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-book-covers.yml'

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fonts and Pillow
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
          python -m pip install --upgrade pillow
      - name: Build localized covers and wire language switching
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import subprocess
          ROOT=Path('.')
          def ff(n): return subprocess.check_output(['fc-match','-f','%{file}\n',n],text=True).strip().splitlines()[0]
          FLB,FL,FCB,FC=ff('DejaVu Serif Bold'),ff('DejaVu Serif'),ff('Noto Serif CJK SC:style=Bold'),ff('Noto Serif CJK SC')
          def fit(d,t,p,mn,mi,mw):
              for s in range(mn,mi-1,-1):
                  f=ImageFont.truetype(p,s); b=d.textbbox((0,0),t,font=f)
                  if b[2]-b[0]<=mw:return f
              return ImageFont.truetype(p,mi)
          def ct(d,t,y,f,c,w):
              b=d.textbbox((0,0),t,font=f); d.text(((w-(b[2]-b[0]))/2,y),t,font=f,fill=c)
          def thr(lang,title):
              im=Image.open(ROOT/'after-threshold/att-cover-web-v3.webp').convert('RGBA');w,h=im.size;o=Image.new('RGBA',im.size,(0,0,0,0));q=ImageDraw.Draw(o);q.rounded_rectangle((int(w*.065),int(h*.045),int(w*.935),int(h*.245)),radius=max(8,int(w*.02)),fill=(4,13,24,220));im=Image.alpha_composite(im,o);d=ImageDraw.Draw(im)
              if lang=='zh':
                  f=fit(d,title,FCB,int(w*.135),int(w*.075),int(w*.78));ct(d,title,int(h*.095),f,(248,249,250,255),w);sf=ImageFont.truetype(FC,int(w*.028));ct(d,'润庐原创 · 近未来社会小说',int(h*.195),sf,(196,214,231,255),w)
              else:
                  lines=['APRÈS LE','SEUIL'] if lang=='fr' else ['DESPUÉS DEL','UMBRAL'];sizes=[int(w*.082),int(w*.105)];y=int(h*.070)
                  for i,line in enumerate(lines):f=fit(d,line,FLB,sizes[i],int(w*.052),int(w*.80));ct(d,line,y,f,(248,249,250,255),w);y+=int(h*.067)
                  sf=ImageFont.truetype(FL,int(w*.025));ct(d,'ROMAN SOCIAL D’ANTICIPATION' if lang=='fr' else 'NOVELA SOCIAL DE FUTURO CERCANO',int(h*.205),sf,(196,214,231,255),w)
              im.convert('RGB').save(ROOT/'after-threshold'/f'cover-{lang}.webp','WEBP',quality=92,method=6)
          thr('zh','临界之后');thr('fr','Après le seuil');thr('es','Después del umbral')
          def ev(lang):
              im=Image.open(ROOT/'evidence/cover-apple.jpg').convert('RGBA');w,h=im.size;o=Image.new('RGBA',im.size,(0,0,0,0));q=ImageDraw.Draw(o);q.rounded_rectangle((int(w*.055),int(h*.025),int(w*.945),int(h*.365)),radius=max(5,int(w*.018)),fill=(7,20,38,226));im=Image.alpha_composite(im,o);d=ImageDraw.Draw(im)
              if lang=='zh':
                  f1=fit(d,'错序',FCB,int(w*.130),int(w*.090),int(w*.72));ct(d,'错序',int(h*.070),f1,(232,47,47,255),w);f2=fit(d,'所有证据都在',FCB,int(w*.090),int(w*.058),int(w*.82));ct(d,'所有证据都在',int(h*.165),f2,(250,250,248,255),w);sf=ImageFont.truetype(FC,int(w*.037));ct(d,'一部小说',int(h*.300),sf,(198,210,223,255),w)
              elif lang=='fr':
                  for text,c,yf in [('TOUTES LES',(250,250,248,255),.075),('PREUVES',(232,47,47,255),.142),('ÉTAIENT LÀ',(250,250,248,255),.226)]:f=fit(d,text,FLB,int(w*.090),int(w*.060),int(w*.82));ct(d,text,int(h*yf),f,c,w)
                  sf=ImageFont.truetype(FL,int(w*.034));ct(d,'UN ROMAN',int(h*.310),sf,(198,210,223,255),w)
              else:
                  for text,c,yf in [('TODAS LAS',(250,250,248,255),.075),('PRUEBAS',(232,47,47,255),.142),('ESTABAN ALLÍ',(250,250,248,255),.226)]:f=fit(d,text,FLB,int(w*.088),int(w*.056),int(w*.82));ct(d,text,int(h*yf),f,c,w)
                  sf=ImageFont.truetype(FL,int(w*.034));ct(d,'UNA NOVELA',int(h*.310),sf,(198,210,223,255),w)
              im.convert('RGB').save(ROOT/'evidence'/f'cover-{lang}.webp','WEBP',quality=92,method=6)
          ev('zh');ev('fr');ev('es')
          Path('localized-book-covers.js').write_text("(()=>{const M={threshold:{en:'/after-threshold/att-cover-web-v3.webp?v=20260907-2',zh:'/after-threshold/cover-zh.webp?v=20260907-2',fr:'/after-threshold/cover-fr.webp?v=20260907-2',es:'/after-threshold/cover-es.webp?v=20260907-2'},evidence:{en:'/evidence/cover-apple.jpg?v=20260907-2',zh:'/evidence/cover-zh.webp?v=20260907-2',fr:'/evidence/cover-fr.webp?v=20260907-2',es:'/evidence/cover-es.webp?v=20260907-2'}};function L(){const d=document.documentElement.dataset.runluLanguage;if(['en','zh','fr','es'].includes(d))return d;const s=document.querySelector('[data-runlu-language-select]');return s&&['en','zh','fr','es'].includes(s.value)?s.value:'en'}function S(){const l=L();document.querySelectorAll('[data-runlu-cover]').forEach(i=>{const u=M[i.dataset.runluCover]?.[l];if(u)i.src=u})}S();addEventListener('runlu:languagechange',S);addEventListener('pageshow',S)})();",encoding='utf-8')
          def add(t,p):return t if 'localized-book-covers.js' in t else t.replace('</body>',f'<script src=\"{p}?v=20260907-2\"></script></body>')
          p=Path('notes.html');s=p.read_text();s=s.replace('<img src=\"/after-threshold/att-cover-web-v3.webp?v=20260906-3\"','<img data-runlu-cover=\"threshold\" src=\"/after-threshold/att-cover-web-v3.webp?v=20260907-2\"');s=s.replace('<img data-runlu-book-cover=\"evidence\" src=\"/evidence/cover-apple.jpg?v=20260906-3\"','<img data-runlu-cover=\"evidence\" src=\"/evidence/cover-apple.jpg?v=20260907-2\"');p.write_text(add(s,'localized-book-covers.js'))
          p=Path('after-threshold/index.html');s=p.read_text();s=s.replace('<img class=\"threshold-cover\" src=\"att-cover-web-v3.webp?v=20260906-3\"','<img class=\"threshold-cover\" data-runlu-cover=\"threshold\" src=\"/after-threshold/att-cover-web-v3.webp?v=20260907-2\"');p.write_text(add(s,'../localized-book-covers.js'))
          p=Path('evidence/index.html');s=p.read_text();s=s.replace('<img class=\"evidence-cover\" src=\"cover-apple.jpg?v=20260906-3\"','<img class=\"evidence-cover\" data-runlu-cover=\"evidence\" src=\"/evidence/cover-apple.jpg?v=20260907-2\"');p.write_text(add(s,'../localized-book-covers.js'))
      - name: Commit localized covers
        run: |
          git config user.name "RUNLU Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add after-threshold/cover-*.webp evidence/cover-*.webp localized-book-covers.js notes.html after-threshold/index.html evidence/index.html
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Localize After the Threshold and Evidence covers" && git push; fi
