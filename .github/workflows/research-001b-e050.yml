name: Research 001B E050 Temporal Sufficiency

on:
  push:
    branches: [research-001-experiment-001]
    paths:
      - "research/001/experiment-050/**"
      - ".github/workflows/research-001b-e050.yml"
  pull_request:
    paths:
      - "research/001/experiment-050/**"

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run E050 temporal-sufficiency self-test
        run: node research/001/experiment-050/selftest.mjs
