name: Wire GUANSHI V2.3 Auto Vault
on:
  push:
    paths:
      - '.github/workflows/guanshi-v23-wire.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch GUANSHI V2.3 routes and controls
        run: |
          python - <<'PY'
          from pathlib import Path

          auto_script='  <script src="guanshi-auto-vault.js?v=20260907-1"></script>\n'
          pages=['guanshi.html','guanshi-consult.html','guanshi-traditional-consult.html','guanshi-library.html','guanshi-validation.html']
          for name in pages:
              p=Path(name); text=p.read_text(encoding='utf-8')
              if 'guanshi-auto-vault.js?v=20260907-1' not in text:
                  text=text.replace('</body>',auto_script+'</body>',1)
              text=text.replace('RUNLU GUANSHI · V2.2','RUNLU GUANSHI · V2.3').replace('RUNLU GUANSHI · V2.1','RUNLU GUANSHI · V2.3')
              p.write_text(text,encoding='utf-8')

          p=Path('guanshi-vault.html'); text=p.read_text(encoding='utf-8')
          text=text.replace('RUNLU GUANSHI · V2.2','RUNLU GUANSHI · V2.3').replace('V2.2 · LOCAL VAULT','V2.3 · AUTO VAULT')
          if 'data-auto-vault-enable' not in text:
              marker='      <aside class="vault-card">\n        <h2 data-en="Cross-device rule"'
              card='''      <section class="vault-card">\n        <h2 data-en="Automatic encrypted backup" data-zh="自动加密备份" data-fr="Sauvegarde automatique chiffrée" data-es="Copia automática cifrada">Automatic encrypted backup</h2>\n        <p data-en="Opt in on this device after the first manual backup or restore. When Local Library or Validation data changes, GUANSHI creates a new encrypted snapshot automatically. The recovery phrase itself is not stored; this browser remembers only a non-extractable WebCrypto key and the vault credential needed to move ciphertext." data-zh="在第一次手动备份或恢复以后，可以为这台设备主动开启。以后“本地知识库”或“验证账本”发生变化，观势会自动创建新的加密快照。恢复密钥原文本身不会保存；浏览器只记住不可导出的 WebCrypto 密钥和传输密文所需的保险箱凭据。" data-fr="Après une première sauvegarde ou restauration manuelle, activez cette option. Les changements locaux déclenchent ensuite un nouvel instantané chiffré. La phrase de récupération n’est pas stockée." data-es="Después de una primera copia o restauración manual, activa esta opción. Los cambios locales crean una nueva instantánea cifrada. La frase de recuperación no se guarda.">Opt-in automatic encrypted backup.</p>\n        <div class="vault-actions">\n          <button class="vault-btn" type="button" data-auto-vault-enable data-en="Enable on this device" data-zh="在这台设备开启" data-fr="Activer sur cet appareil" data-es="Activar en este dispositivo">Enable on this device</button>\n          <button class="vault-btn secondary" type="button" data-auto-vault-disable data-en="Turn off & forget device key" data-zh="关闭并删除设备密钥" data-fr="Désactiver et oublier la clé" data-es="Desactivar y olvidar la clave">Turn off & forget device key</button>\n        </div>\n        <div class="vault-status" data-auto-vault-state></div>\n        <p class="vault-note" data-en="Conflict rule: automatic backup never overwrites a newer cloud revision. It pauses and asks you to Restore & merge first." data-zh="冲突规则：自动备份绝不会覆盖更新的云端版本；发现云端更新时会自动暂停，并要求先“恢复并合并”。" data-fr="Une révision cloud plus récente met la sauvegarde automatique en pause jusqu’à la fusion." data-es="Una revisión más nueva en la nube pausa la copia automática hasta fusionar.">Newer cloud revisions pause auto backup.</p>\n      </section>\n\n'''
              if marker not in text: raise SystemExit('vault insertion marker not found')
              text=text.replace(marker,card+marker,1)
          if 'guanshi-auto-vault.js?v=20260907-1' not in text:
              text=text.replace('  <script src="guanshi-vault.js?v=20260907-1"></script>','  <script src="guanshi-vault.js?v=20260907-1"></script>\n'+auto_script.strip(),1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit V2.3 wiring
        run: |
          git config user.name "RUNLU maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add guanshi.html guanshi-consult.html guanshi-traditional-consult.html guanshi-library.html guanshi-validation.html guanshi-vault.html
          git commit -m "Connect GUANSHI V2.3 automatic encrypted backup"
          git push