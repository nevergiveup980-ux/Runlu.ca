name: Deerfoot Paper Reference Calibration V1
on:
  pull_request:
    paths:
      - 'flooring/deerfoot-paper-reference-calibration-v1.html'
      - 'flooring/deerfoot-paper-reference-calibration-v1.css'
      - 'scripts/run-deerfoot-paper-reference-calibration-v1.mjs'
      - '.github/workflows/deerfoot-paper-reference-calibration-v1.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/run-deerfoot-paper-reference-calibration-v1.mjs
