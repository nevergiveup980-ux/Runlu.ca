name: Fix After Threshold bookshelf

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-att-bookshelf.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update bookshelf cover and sitemap
        shell: python
        run: |
          from pathlib import Path

          notes = Path('notes.html')
          text = notes.read_text(encoding='utf-8')
          text = text.replace('/after-threshold/cover-apple.jpg?v=20260906-2', '/after-threshold/cover-c-final.jpg?v=20260906-3')
          text = text.replace('/after-threshold/cover-apple.jpg?v=20260906-1', '/after-threshold/cover-c-final.jpg?v=20260906-3')
          notes.write_text(text, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          sm = sitemap.read_text(encoding='utf-8')
          urls = [
              'https://runlu.ca/after-threshold/prologue.html',
              'https://runlu.ca/after-threshold/chapter-01.html',
              'https://runlu.ca/after-threshold/chapter-02.html',
              'https://runlu.ca/after-threshold/chapter-03.html',
          ]
          entries = ''.join(f'  <url><loc>{u}</loc><lastmod>2026-09-06</lastmod></url>\n' for u in urls if u not in sm)
          if entries:
              sm = sm.replace('</urlset>', entries + '</urlset>')
              sitemap.write_text(sm, encoding='utf-8')
      - name: Commit fixes
        run: |
          git config user.name "RUNLU Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add notes.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix After the Threshold bookshelf and sample links"
            git push
          fi
