name: Flooring Morning Brief V0.4.01
on:
  pull_request:
    paths:
      - 'flooring/week-schedule-v0401.js'
      - 'flooring/index-v0401-morning-brief-preview.html'
      - 'scripts/run-flooring-week-schedule-v0401.mjs'
      - '.github/workflows/flooring-week-schedule-v0401.yml'
  workflow_dispatch:
jobs:
  morning-brief-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run V0.4.01 morning brief, action, dispatch, pressure and read-only gates
        run: node scripts/run-flooring-week-schedule-v0401.mjs
