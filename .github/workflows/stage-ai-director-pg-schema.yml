name: RUNLU STAGE AI Director PostgreSQL Schema
on:
  push:
    branches: [stage-2-engine-prototype]
    paths:
      - 'stage-2/ai-director/**'
      - '.github/workflows/stage-ai-director-pg-schema.yml'
  pull_request:
    paths:
      - 'stage-2/ai-director/**'
      - '.github/workflows/stage-ai-director-pg-schema.yml'
jobs:
  schema-smoke:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stage
          POSTGRES_PASSWORD: stage_test_only
          POSTGRES_DB: stage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stage -d stage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: stage_test_only
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: stage
      PGDATABASE: stage_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Apply schema twice (idempotence)
        run: |
          psql -v ON_ERROR_STOP=1 -f stage-2/ai-director/001_approval_schema.sql
          psql -v ON_ERROR_STOP=1 -f stage-2/ai-director/001_approval_schema.sql
      - name: Verify constraints and relationships
        run: psql -v ON_ERROR_STOP=1 -f stage-2/ai-director/schema-smoke.sql
      - name: Verify transaction claims and rollback on real PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f stage-2/ai-director/transaction-smoke.sql
      - name: Verify two-connection budget locking
        run: bash stage-2/ai-director/concurrency-smoke.sh
