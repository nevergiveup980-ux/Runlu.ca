name: Flooring Mobile Safe Fast Boot V0.3.94
on:
  pull_request:
    paths:
      - 'flooring/index-v071-pricing-workspace.html'
      - 'flooring/index-v0403-release.html'
      - 'flooring/mobile-safe-fastboot-v0403g.js'
      - 'scripts/run-flooring-mobile-safe-fastboot-v0394.mjs'
      - 'scripts/run-flooring-mobile-safari-hotfix-v0403a.mjs'
      - '.github/workflows/flooring-mobile-safe-fastboot-v0394.yml'
  workflow_dispatch:
jobs:
  mobile-safe-fastboot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run V0.3.94 Safe Fast Boot gate
        run: node scripts/run-flooring-mobile-safe-fastboot-v0394.mjs
