name: RUNLU MUSIC orchestration tests
on:
  push:
    paths:
      - 'music/job-service.mjs'
      - 'music/job-service.test.mjs'
      - 'music/job-service.stress.test.mjs'
      - 'music/auth-boundary.mjs'
      - 'music/auth-boundary.test.mjs'
      - 'music/private-storage.mjs'
      - 'music/private-storage.test.mjs'
      - 'music/music-library.mjs'
      - 'music/music-library.test.mjs'
      - 'music/offline-e2e.test.mjs'
      - 'music/billing-gate.mjs'
      - 'music/billing-gate.test.mjs'
      - 'music/concurrency-model.test.mjs'
      - 'music/local-postgres/**'
      - 'music-studio-tools/job-contract.mjs'
      - '.github/workflows/runlu-music-orchestration.yml'
  pull_request:
    paths:
      - 'music/local-postgres/**'
      - 'music/concurrency-model.test.mjs'
      - 'music/billing-gate.test.mjs'
      - 'music/offline-e2e.test.mjs'
      - 'music/job-service.mjs'
      - 'music/job-service.test.mjs'
      - 'music-studio-tools/job-contract.mjs'
      - '.github/workflows/runlu-music-orchestration.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test isolated music service and job contract
        run: node --test music/job-service.stress.test.mjs music/concurrency-model.test.mjs music/billing-gate.test.mjs music/offline-e2e.test.mjs music/job-service.test.mjs music/auth-boundary.test.mjs music/private-storage.test.mjs music/music-library.test.mjs music-studio-tools/job-contract.test.mjs

      - name: Static validation of local PostgreSQL harness (no database or network)
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path("music/local-postgres/test_concurrency.py").read_text())
          print("PASS: local PostgreSQL Python harness parses")
          PY
          bash -n music/local-postgres/run-local.sh
          echo "PASS: local PostgreSQL shell runner parses"
