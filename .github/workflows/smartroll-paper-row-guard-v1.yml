name: SmartRoll Paper Row Confirm Guard V1
on:
  pull_request:
    paths:
      - 'flooring/smartroll-paper-row-guard-v1.js'
      - 'scripts/run-smartroll-paper-row-guard-v1.mjs'
      - '.github/workflows/smartroll-paper-row-guard-v1.yml'
  push:
    branches: [main]
    paths:
      - 'flooring/smartroll-paper-row-guard-v1.js'
      - 'scripts/run-smartroll-paper-row-guard-v1.mjs'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/run-smartroll-paper-row-guard-v1.mjs
