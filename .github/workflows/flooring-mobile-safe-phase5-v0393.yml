name: Flooring Mobile Safe Phase 5 V0.3.93
on:
  pull_request:
    paths:
      - 'flooring/index-v071-pricing-workspace.html'
      - 'flooring/mobile-safe-phase5-v0403f.js'
      - 'flooring/carpet-line-rc-v093-safe.js'
      - 'scripts/run-flooring-mobile-safe-phase5-v0393.mjs'
      - '.github/workflows/flooring-mobile-safe-phase5-v0393.yml'
  workflow_dispatch:
jobs:
  mobile-safe-phase5:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run V0.3.93 Carpet Line RC Phase 5 gate
        run: node scripts/run-flooring-mobile-safe-phase5-v0393.mjs
