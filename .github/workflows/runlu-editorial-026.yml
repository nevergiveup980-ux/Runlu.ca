name: Complete RUNLU VIEW 026
on:
  push:
    branches: [main]
    paths: ['.github/workflows/runlu-editorial-026.yml']
permissions:
  contents: write
jobs:
  close-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Complete publication metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('sitemap.xml'); s=p.read_text()
          needle='<url><loc>https://runlu.ca/view-025-when-ai-forms-a-company.html</loc><lastmod>2026-09-18</lastmod></url>'
          add=needle+'<url><loc>https://runlu.ca/view-026-when-ai-builds-ai.html</loc><lastmod>2026-09-19</lastmod></url>'
          if 'view-026-when-ai-builds-ai.html' not in s: s=s.replace(needle,add)
          s=s.replace('https://runlu.ca/frontiers.html</loc><lastmod>2026-09-18</lastmod>','https://runlu.ca/frontiers.html</loc><lastmod>2026-09-19</lastmod>')
          p.write_text(s)

          p=Path('frontiers.html'); s=p.read_text().replace('view-catalog.js?v=20260918-1','view-catalog.js?v=20260919-1'); p.write_text(s)

          p=Path('RUNLU_KNOWLEDGE_MAP.json'); m=json.loads(p.read_text()); m['updated']='2026-09-19'
          if not any(n['id']=='view-026' for n in m['nodes']):
              m['nodes'].append({'id':'view-026','stream':'VIEW','path':'view-026-when-ai-builds-ai.html','topics':['agentic-organization','human-control']})
              m['edges'].append({'from':'view-022','to':'view-026','relation':'adds_time_dimension','note':'Goal-setting governance gains urgency when AI begins materially accelerating the R&D process that produces successor systems.'})
              m['edges'].append({'from':'view-025','to':'view-026','relation':'closes_feedback_loop','note':'AI organized as a workforce extends into AI helping build future AI, turning organization into a potential development feedback loop.'})
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')

          p=Path('RUNLU_DECISION_LOG.jsonl'); s=p.read_text()
          if 'Anthropic AI-led AI R&D / recursive self-improvement measurements' not in s:
              row={'schema':'runlu.decision.v1','date':'2026-09-19','type':'editorial','stream':'VIEW','subject':'Anthropic AI-led AI R&D / recursive self-improvement measurements','decision':'publish','result':'VIEW 026','reason':'New primary-source internal measurements make the self-improvement question concrete and measurable: Claude is reported to lead 26% of measured AI R&D while remaining human-supervised. This materially advances RUNLU human-control and agentic-organization threads rather than repeating generic AI-safety debate.','limits':['Figures are Anthropic internal measurements, not independent cross-lab benchmarks','Claude is not fully autonomous in any measured AI R&D area','Recursive self-improvement has not been demonstrated','The automation index itself uses Claude evaluators and contains judgment calls'],'public_verification':'repository_closure_pending_qa_public_cdn_not_claimed_without_verification'}
              s += json.dumps(row,ensure_ascii=False,separators=(',',':'))+'\n'
              p.write_text(s)
          PY
      - name: Run publication and memory checks
        run: |
          node scripts/check-publication-closure.mjs
          node scripts/check-decision-log.mjs
          node scripts/check-knowledge-map.mjs
      - name: Commit closure
        run: |
          git config user.name 'RUNLU Editorial Operator'
          git config user.email 'actions@users.noreply.github.com'
          git add sitemap.xml frontiers.html RUNLU_KNOWLEDGE_MAP.json RUNLU_DECISION_LOG.jsonl
          git commit -m 'Close RUNLU VIEW 026 publication loop'
          git push
