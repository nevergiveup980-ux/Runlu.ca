<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUNLU MUSIC — Living Visuals prototype</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f7f5f1;background:#0c1221}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}.app{width:min(100%,490px);background:#171e30;border:1px solid #354055;border-radius:24px;padding:18px;box-shadow:0 20px 60px #0007}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:18px;margin:0}.sub{font-size:12px;color:#b3c1d4}#scene{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:18px;margin:16px 0;background:linear-gradient(160deg,#244269,#bd875d 70%,#242e43);transition:background 1s}.sun{position:absolute;left:50%;top:32%;width:85px;height:85px;border-radius:50%;background:#ffda9e;filter:blur(2px);transform:translate(-50%,-50%);box-shadow:0 0 100px #ffc47b}.land{position:absolute;bottom:-20%;left:-25%;width:150%;height:52%;background:#1e3140;border-radius:50% 50% 0 0;transform:rotate(-8deg)}.land.two{bottom:-28%;background:#101d2c;transform:rotate(12deg)}canvas{position:absolute;inset:0;width:100%;height:100%}.caption{position:absolute;bottom:14px;left:14px;right:14px;font-size:12px;text-shadow:0 1px 8px #000a}.classic{background:linear-gradient(#0d1939,#3b5076 75%,#101c34)!important}.classic .sun{background:#dcecff;box-shadow:0 0 80px #b8d9ff}.classic .land{background:#253650}.classic .land.two{background:#15253b}.neon{background:radial-gradient(circle at 50% 60%,#442269,#080e24 70%)!important}.neon .sun{background:#fa5bcd;box-shadow:0 0 90px #ff42c9}.neon .land{background:#15102e}.neon .land.two{background:#080b1e}label{display:block;margin:12px 0 5px;font-size:13px;color:#c6d3e6}input[type=file]{max-width:100%;font-size:13px}#playlist{list-style:none;padding:0;margin:8px 0;max-height:210px;overflow:auto}#playlist li{display:flex;gap:6px;align-items:center;margin:5px 0}#playlist li button{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#playlist li button.active{background:#456c92;border-color:#a8d7ff}#playlist li .remove{flex:0 0 auto;padding:8px 10px}#now{font-size:12px;color:#c5d8eb;margin:5px 0}.library{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.track{text-align:left;min-height:88px;line-height:1.5}.track strong{display:block}.track span{display:block;font-size:12px;color:#c1d0e4}.track.active{border-color:#a8d7ff;background:#36516d}.hint{font-size:12px;color:#c4d1df}audio{width:100%;margin:12px 0}select,button{border:1px solid #52617a;background:#26354d;color:white;padding:10px 12px;border-radius:10px;font-size:14px}select{width:100%}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row button{flex:1}button[aria-pressed=true]{background:#456c92}small{display:block;color:#aab8c9;line-height:1.5;margin-top:12px}#status{font-size:12px;color:#b9d2e9;min-height:18px}@media(prefers-reduced-motion:reduce){#scene{transition:none}}
 .scenery{position:absolute;inset:0;width:100%;height:100%;display:block;filter:contrast(1.07) saturate(1.12)}#scene .sun,#scene .land{display:none}.classic .scenery{filter:hue-rotate(155deg) saturate(.7) brightness(.75)}.neon .scenery{filter:hue-rotate(240deg) saturate(1.6) contrast(1.15)}#scene canvas{z-index:1}#scene .caption{z-index:2;font-weight:600;font-size:13px;background:linear-gradient(90deg,#081321ad,transparent);padding:7px 9px;border-radius:6px}  
/* Gentle motion: scenic layers, not costly video generation */
.scenery g[fill="#fff"]{animation:cloudDrift 32s ease-in-out infinite alternate;transform-origin:center}
.scenery circle{animation:glowBreath 7s ease-in-out infinite alternate}
@keyframes cloudDrift{from{transform:translateX(-12px)}to{transform:translateX(18px)}}
@keyframes glowBreath{from{opacity:.78}to{opacity:1}}
.classic .scenery circle{fill:#e4efff}
.classic .scenery rect:first-of-type{opacity:.8}
@media(prefers-reduced-motion:reduce){.scenery *{animation:none!important}}
#scene.still .scenery *{animation:none!important}
</style></head><body><main class="app"><header><div><h1>RUNLU MUSIC · Living Visuals</h1><div class="sub">本地试听原型 · 不上传音频</div></div><span aria-hidden="true">♫</span></header>
<div id="scene" role="img" aria-label="随音乐变化的风景和波形"><svg class="scenery" viewBox="0 0 960 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#254c80"/><stop offset=".54" stop-color="#edac7d"/><stop offset="1" stop-color="#f6d6a2"/></linearGradient><linearGradient id="road" x2="0" y2="1"><stop stop-color="#f9cf9c"/><stop offset="1" stop-color="#6a6770"/></linearGradient><linearGradient id="lake" x2="0" y2="1"><stop stop-color="#54749c"/><stop offset="1" stop-color="#112945"/></linearGradient></defs><rect width="960" height="720" fill="url(#sky)"/><g fill="#fff" opacity=".6"><path d="M60 156q75-50 153 0 55-35 114 5-88-9-142 12-72-18-125-17Z"/><path d="M560 116q64-32 124 1 54-25 114 10-106-6-152 11-45-17-86-22Z"/></g><circle cx="670" cy="255" r="82" fill="#ffe3a5"/><path d="M0 430 130 300 242 405 380 274 565 428 706 314 960 438V720H0Z" fill="#758aa0"/><path d="M0 470 178 361 332 455 509 343 726 465 890 376 960 422V720H0Z" fill="#435f72"/><path d="M0 500Q170 440 340 504T700 480Q840 460 960 502V720H0Z" fill="#304f4d"/><path d="M0 550Q200 510 410 550T960 528V720H0Z" fill="#203d3b"/><path d="M395 720 490 505 510 505 695 720Z" fill="url(#road)"/><path d="M499 531 504 559M505 580 514 616M518 650 528 707" stroke="#fce7bb" stroke-width="5" stroke-linecap="round"/><g fill="#142f2c"><path d="M50 565l20-120 18 120Zm46 7 24-153 24 153Zm675-24 26-140 24 140Zm75 14 24-166 28 166Z"/></g></svg><canvas id="visual"></canvas><div class="caption" id="caption">夕阳之路 · 抒情民谣</div></div>
<label>RUNLU 原创试听作品</label><div class="library"><button class="track" data-track="male" type="button"><strong>01 · 一路走来，所幸有你</strong><span>中文男声 · 夕阳之路</span></button><button class="track" data-track="female" type="button"><strong>02 · Through Every Mile</strong><span>英文女声 · 月光湖畔</span></button></div><div class="hint">点击作品后，从手机“文件”中选择对应 MP3。原型不托管歌曲。</div><label for="file">选择本地 MP3 / 音频文件</label><input id="file" type="file" multiple><div class="hint">可一次选择多首普通音频文件；列表仅保存在当前页面，刷新后需重新选择。</div><div id="now" aria-live="polite">尚未载入歌曲</div><div class="row"><button id="prev" type="button">⏮ 上一首</button><button id="next" type="button">下一首 ⏭</button><button id="repeat" type="button" aria-pressed="false">循环：关</button></div><label for="playlist">本地播放列表</label><ol id="playlist"></ol><button id="clear" type="button">清空列表</button>
<audio id="audio" controls preload="metadata"></audio><div id="status" aria-live="polite">选择音频后，点击播放器的播放按钮。</div>
<label for="style">视觉风格</label><select id="style"><option value="folk">夕阳之路 · 抒情民谣</option><option value="classic">月光湖畔 · 经典民谣</option><option value="neon">霓虹律动 · 流行电子</option></select>
<label>画面模式</label><div class="row"><button id="waves" aria-pressed="true">音乐波形</button><button id="still" aria-pressed="false">静态画面</button></div>
<small>原型只读取本地选择的音频，不会上传或存储。音频分析仅在用户播放后启动。遵循系统“减少动态效果”设置；可随时切换静态画面。正式版还需移动端兼容性和无障碍验收。</small></main>
<script>
const audio=document.getElementById('audio'),file=document.getElementById('file'),scene=document.getElementById('scene'),canvas=document.getElementById('visual'),ctx=canvas.getContext('2d'),style=document.getElementById('style'),caption=document.getElementById('caption'),status=document.getElementById('status'),waves=document.getElementById('waves'),still=document.getElementById('still');
let url=null,context=null,analyser=null,source=null,pendingTrack=null,mode=matchMedia('(prefers-reduced-motion: reduce)').matches?'still':'waves',raf=0;
function setMode(v){mode=v;waves.setAttribute('aria-pressed',v==='waves');still.setAttribute('aria-pressed',v==='still');scene.classList.toggle('still',v==='still');if(v==='still'){cancelAnimationFrame(raf);ctx.clearRect(0,0,canvas.width,canvas.height)}else if(!audio.paused)draw()}
waves.onclick=()=>setMode('waves');still.onclick=()=>setMode('still');setMode(mode);
style.onchange=()=>{scene.className=(style.value==='folk'?'':style.value)+(mode==='still'?' still':'');caption.textContent=style.selectedOptions[0].textContent};
document.querySelectorAll('[data-track]').forEach(button=>button.addEventListener('click',()=>{pendingTrack=button.dataset.track;style.value=pendingTrack==='male'?'folk':'classic';style.onchange();status.textContent='请选择对应的本地 MP3 文件';file.click()}));
const playlist=document.getElementById('playlist'),now=document.getElementById('now'),prev=document.getElementById('prev'),next=document.getElementById('next'),repeat=document.getElementById('repeat'),clear=document.getElementById('clear');
const songs=[];let current=-1,loop=false;
const validAudio=f=>f.type.startsWith('audio/')||/\.(mp3|m4a|wav|ogg|aac|flac)$/i.test(f.name);
function inferredStyle(name){name=name.toLowerCase();return /demo02|english|through.every.mile/.test(name)?'classic':/first.full.song|一路走来/.test(name)?'folk':null}
function renderList(){playlist.replaceChildren();songs.forEach((song,i)=>{const li=document.createElement('li'),b=document.createElement('button'),del=document.createElement('button');b.type='button';b.textContent=(i+1)+'. '+song.file.name;b.className=i===current?'active':'';b.onclick=()=>loadSong(i,true);del.type='button';del.className='remove';del.textContent='移除';del.setAttribute('aria-label','移除 '+song.file.name);del.onclick=()=>removeSong(i);li.append(b,del);playlist.append(li)});}
function loadSong(i,autoplay=false){if(i<0||i>=songs.length)return;const wasPlaying=!audio.paused;audio.pause();current=i;audio.src=songs[i].url;audio.load();const suggested=inferredStyle(songs[i].file.name);if(suggested){style.value=suggested;style.onchange()}now.textContent='当前：'+songs[i].file.name;status.textContent='已载入：'+songs[i].file.name;renderList();if(autoplay||wasPlaying)audio.play().catch(()=>{status.textContent='歌曲已载入，请点击播放按钮'})}
function removeSong(i){const playing=i===current;const item=songs[i];if(playing){audio.pause();audio.removeAttribute('src');audio.load()}songs.splice(i,1);URL.revokeObjectURL(item.url);if(!songs.length){current=-1;now.textContent='尚未载入歌曲';status.textContent='播放列表已清空'}else if(playing){current=-1;loadSong(Math.min(i,songs.length-1))}else if(i<current)current--;renderList()}
file.onchange=()=>{const selected=Array.from(file.files||[]);const accepted=selected.filter(validAudio);if(!accepted.length){status.textContent='请选择 MP3、M4A、WAV 等可播放音频文件';file.value='';pendingTrack=null;return}const first=songs.length;songs.push(...accepted.map(f=>({file:f,url:URL.createObjectURL(f)})));if(current<0)loadSong(first);renderList();status.textContent='已加入 '+accepted.length+' 首歌曲'+(accepted.length<selected.length?'，部分文件格式不支持':'');file.value='';pendingTrack=null};
prev.onclick=()=>{if(songs.length)loadSong(current>0?current-1:songs.length-1,true)};
next.onclick=()=>{if(songs.length)loadSong((current+1)%songs.length,true)};
repeat.onclick=()=>{loop=!loop;repeat.setAttribute('aria-pressed',String(loop));repeat.textContent='循环：'+(loop?'开':'关')};
clear.onclick=()=>{audio.pause();audio.removeAttribute('src');audio.load();songs.forEach(s=>URL.revokeObjectURL(s.url));songs.length=0;current=-1;now.textContent='尚未载入歌曲';renderList();status.textContent='播放列表已清空'};

async function setup(){if(context)return;const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext){status.textContent='此浏览器不支持实时频谱，仍可播放音频。';return}context=new AudioContext();analyser=context.createAnalyser();analyser.fftSize=256;source=context.createMediaElementSource(audio);source.connect(analyser);analyser.connect(context.destination)}
audio.addEventListener('play',async()=>{try{await setup();if(context?.state==='suspended')await context.resume();status.textContent='正在播放 · '+(mode==='still'?'静态画面':'实时音乐波形');draw()}catch(e){status.textContent='音频可以继续播放，但可视化初始化失败。'}});
audio.addEventListener('pause',()=>cancelAnimationFrame(raf));audio.addEventListener('ended',()=>{cancelAnimationFrame(raf);if(current>=0&&(current<songs.length-1||loop))loadSong((current+1)%songs.length,true);else status.textContent='播放列表结束'});
function draw(){cancelAnimationFrame(raf);if(mode!=='waves'||audio.paused||!analyser)return;const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.scale(dpr,dpr);const data=new Uint8Array(analyser.frequencyBinCount);const paint=()=>{if(audio.paused||mode!=='waves')return;analyser.getByteFrequencyData(data);ctx.clearRect(0,0,w,h);const n=48,bw=w/n;for(let i=0;i<n;i++){const value=data[Math.floor(i*data.length/n)]/255;const height=Math.max(2,value*h*.34);ctx.fillStyle=style.value==='neon'?'rgba(255,107,226,.8)':'rgba(245,240,224,.72)';ctx.fillRect(i*bw+1,h*.75-height,bw-3,height)}raf=requestAnimationFrame(paint)};paint()}
window.addEventListener('pagehide',()=>{songs.forEach(s=>URL.revokeObjectURL(s.url));if(context)context.close()});
</script></body></html>
