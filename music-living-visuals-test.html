<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUNLU MUSIC — Living Visuals prototype</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f7f5f1;background:#0c1221}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}.app{width:min(100%,490px);background:#171e30;border:1px solid #354055;border-radius:24px;padding:18px;box-shadow:0 20px 60px #0007}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:18px;margin:0}.sub{font-size:12px;color:#b3c1d4}#scene{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:18px;margin:16px 0;background:linear-gradient(160deg,#244269,#bd875d 70%,#242e43);transition:background 1s}.sun{position:absolute;left:50%;top:32%;width:85px;height:85px;border-radius:50%;background:#ffda9e;filter:blur(2px);transform:translate(-50%,-50%);box-shadow:0 0 100px #ffc47b}.land{position:absolute;bottom:-20%;left:-25%;width:150%;height:52%;background:#1e3140;border-radius:50% 50% 0 0;transform:rotate(-8deg)}.land.two{bottom:-28%;background:#101d2c;transform:rotate(12deg)}canvas{position:absolute;inset:0;width:100%;height:100%}.caption{position:absolute;bottom:14px;left:14px;right:14px;font-size:12px;text-shadow:0 1px 8px #000a}.classic{background:linear-gradient(#0d1939,#3b5076 75%,#101c34)!important}.classic .sun{background:#dcecff;box-shadow:0 0 80px #b8d9ff}.classic .land{background:#253650}.classic .land.two{background:#15253b}.neon{background:radial-gradient(circle at 50% 60%,#442269,#080e24 70%)!important}.neon .sun{background:#fa5bcd;box-shadow:0 0 90px #ff42c9}.neon .land{background:#15102e}.neon .land.two{background:#080b1e}label{display:block;margin:12px 0 5px;font-size:13px;color:#c6d3e6}input[type=file]{max-width:100%;font-size:13px}.library{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.track{text-align:left;min-height:88px;line-height:1.5}.track strong{display:block}.track span{display:block;font-size:12px;color:#c1d0e4}.track.active{border-color:#a8d7ff;background:#36516d}.hint{font-size:12px;color:#c4d1df}audio{width:100%;margin:12px 0}select,button{border:1px solid #52617a;background:#26354d;color:white;padding:10px 12px;border-radius:10px;font-size:14px}select{width:100%}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row button{flex:1}button[aria-pressed=true]{background:#456c92}small{display:block;color:#aab8c9;line-height:1.5;margin-top:12px}#status{font-size:12px;color:#b9d2e9;min-height:18px}@media(prefers-reduced-motion:reduce){#scene{transition:none}}
</style></head><body><main class="app"><header><div><h1>RUNLU MUSIC · Living Visuals</h1><div class="sub">本地试听原型 · 不上传音频</div></div><span aria-hidden="true">♫</span></header>
<div id="scene" role="img" aria-label="随音乐变化的风景和波形"><div class="sun"></div><div class="land"></div><div class="land two"></div><canvas id="visual"></canvas><div class="caption" id="caption">夕阳之路 · 抒情民谣</div></div>
<label>RUNLU 原创试听作品</label><div class="library"><button class="track" data-track="male" type="button"><strong>01 · 一路走来，所幸有你</strong><span>中文男声 · 夕阳之路</span></button><button class="track" data-track="female" type="button"><strong>02 · Through Every Mile</strong><span>英文女声 · 月光湖畔</span></button></div><div class="hint">点击作品后，从手机“文件”中选择对应 MP3。原型不托管歌曲。</div><label for="file">选择本地 MP3 / 音频文件</label><input id="file" type="file" accept="audio/*">
<audio id="audio" controls preload="metadata"></audio><div id="status" aria-live="polite">选择音频后，点击播放器的播放按钮。</div>
<label for="style">视觉风格</label><select id="style"><option value="folk">夕阳之路 · 抒情民谣</option><option value="classic">月光湖畔 · 经典民谣</option><option value="neon">霓虹律动 · 流行电子</option></select>
<label>画面模式</label><div class="row"><button id="waves" aria-pressed="true">音乐波形</button><button id="still" aria-pressed="false">静态画面</button></div>
<small>原型只读取本地选择的音频，不会上传或存储。音频分析仅在用户播放后启动。遵循系统“减少动态效果”设置；可随时切换静态画面。正式版还需移动端兼容性和无障碍验收。</small></main>
<script>
const audio=document.getElementById('audio'),file=document.getElementById('file'),scene=document.getElementById('scene'),canvas=document.getElementById('visual'),ctx=canvas.getContext('2d'),style=document.getElementById('style'),caption=document.getElementById('caption'),status=document.getElementById('status'),waves=document.getElementById('waves'),still=document.getElementById('still');
let url=null,context=null,analyser=null,source=null,pendingTrack=null,mode=matchMedia('(prefers-reduced-motion: reduce)').matches?'still':'waves',raf=0;
function setMode(v){mode=v;waves.setAttribute('aria-pressed',v==='waves');still.setAttribute('aria-pressed',v==='still');if(v==='still'){cancelAnimationFrame(raf);ctx.clearRect(0,0,canvas.width,canvas.height)}else if(!audio.paused)draw()}
waves.onclick=()=>setMode('waves');still.onclick=()=>setMode('still');setMode(mode);
style.onchange=()=>{scene.className=style.value==='folk'?'':style.value;caption.textContent=style.selectedOptions[0].textContent};
document.querySelectorAll('[data-track]').forEach(button=>button.addEventListener('click',()=>{pendingTrack=button.dataset.track;style.value=pendingTrack==='male'?'folk':'classic';style.onchange();status.textContent='请选择对应的本地 MP3 文件';file.click()}));
file.onchange=()=>{const f=file.files?.[0];if(!f)return;if(!f.type.startsWith('audio/')&&!/\\.(mp3|m4a|wav|ogg|aac)$/i.test(f.name)){status.textContent='请选择音频文件';return}audio.pause();audio.removeAttribute('src');audio.load();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);audio.src=url;document.querySelectorAll('[data-track]').forEach(button=>button.classList.toggle('active',button.dataset.track===pendingTrack));status.textContent='已载入：'+f.name;pendingTrack=null};
async function setup(){if(context)return;const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext){status.textContent='此浏览器不支持实时频谱，仍可播放音频。';return}context=new AudioContext();analyser=context.createAnalyser();analyser.fftSize=256;source=context.createMediaElementSource(audio);source.connect(analyser);analyser.connect(context.destination)}
audio.addEventListener('play',async()=>{try{await setup();if(context?.state==='suspended')await context.resume();status.textContent='正在播放 · '+(mode==='still'?'静态画面':'实时音乐波形');draw()}catch(e){status.textContent='音频可以继续播放，但可视化初始化失败。'}});
audio.addEventListener('pause',()=>cancelAnimationFrame(raf));audio.addEventListener('ended',()=>{cancelAnimationFrame(raf);status.textContent='播放结束'});
function draw(){cancelAnimationFrame(raf);if(mode!=='waves'||audio.paused||!analyser)return;const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.scale(dpr,dpr);const data=new Uint8Array(analyser.frequencyBinCount);const paint=()=>{if(audio.paused||mode!=='waves')return;analyser.getByteFrequencyData(data);ctx.clearRect(0,0,w,h);const n=48,bw=w/n;for(let i=0;i<n;i++){const value=data[Math.floor(i*data.length/n)]/255;const height=Math.max(2,value*h*.34);ctx.fillStyle=style.value==='neon'?'rgba(255,107,226,.8)':'rgba(245,240,224,.72)';ctx.fillRect(i*bw+1,h*.75-height,bw-3,height)}raf=requestAnimationFrame(paint)};paint()}
window.addEventListener('pagehide',()=>{if(url)URL.revokeObjectURL(url);if(context)context.close()});
</script></body></html>
