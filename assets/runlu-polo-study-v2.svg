<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">RUNLU cream polo design study</title>
<desc id="desc">A clean cream polo shirt with a burgundy and gold RUNLU crest on a warm beige studio background.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f2dfbf"/>
    <stop offset=".55" stop-color="#d8b486"/>
    <stop offset="1" stop-color="#b8875b"/>
  </linearGradient>
  <linearGradient id="shirt" x1="0" y1="0" x2=".8" y2="1">
    <stop offset="0" stop-color="#fff9eb"/>
    <stop offset=".5" stop-color="#f7ead1"/>
    <stop offset="1" stop-color="#ead9bb"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffe7a2"/>
    <stop offset=".4" stop-color="#d7a42d"/>
    <stop offset="1" stop-color="#8c5a0a"/>
  </linearGradient>
  <pattern id="weave" width="10" height="10" patternUnits="userSpaceOnUse">
