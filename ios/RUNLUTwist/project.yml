name: RUNLUTwist
options:
  bundleIdPrefix: ca.runlu
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.1'
    CURRENT_PROJECT_VERSION: '4'
    DEVELOPMENT_TEAM: F2J2Z8H2L4
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
targets:
  RUNLUTwist:
    type: application
    platform: iOS
    sources:
      - path: RUNLUTwist
        excludes: [Web]
      - path: RUNLUTwist/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: ca.runlu.twist
        INFOPLIST_FILE: RUNLUTwist/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  RUNLUTwistUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RUNLUTwistUITests]
    dependencies:
      - target: RUNLUTwist
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RUNLUTwist:
    build:
      targets:
        RUNLUTwist: all
    test:
      targets: [RUNLUTwistUITests]
