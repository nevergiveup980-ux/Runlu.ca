<section class="opening-head"><span class="opening-badge">润庐原创 · RUNLU Original</span><p class="section-kicker" data-en="RUNLU ORIGINAL · NOVEL 03 · OPENING PREVIEW" data-zh="润庐原创 · 长篇 03 · 开篇试读" data-fr="ORIGINAL RUNLU · ROMAN 03 · APERÇU" data-es="ORIGINAL RUNLU · NOVELA 03 · AVANCE">RUNLU ORIGINAL · NOVEL 03 · OPENING PREVIEW</p><h1 data-en="Warmth in the Night" data-zh="《夜色有温度》" data-fr="La chaleur de la nuit" data-es="Calor en la noche">Warmth in the Night</h1><p data-en="Volume I · Lingering Warmth. A quiet contemporary novel about marriage, desire, memory, and the distances that can grow inside an ordinary life. The Chinese manuscript of Volume I currently reaches Chapter 24; RUNLU is releasing Chapters 1–3 here first." data-zh="第一卷 · 余温。一部写婚姻、欲望、记忆，也写普通生活中那些悄然拉开距离的当代长篇。第一卷中文母稿目前已写到第24章；网站先放出第1—3章作为试读。" data-fr="Tome I · Chaleur persistante. Un roman contemporain tout en retenue sur le mariage, le désir, la mémoire et les distances qui peuvent s’installer dans une vie ordinaire. Le manuscrit chinois du premier tome atteint actuellement le chapitre 24 ; RUNLU publie d’abord ici les chapitres 1 à 3." data-es="Volumen I · Calor que permanece. Una novela contemporánea y contenida sobre el matrimonio, el deseo, la memoria y las distancias que pueden crecer dentro de una vida corriente. El manuscrito chino del primer volumen llega actualmente al capítulo 24; RUNLU publica aquí primero los capítulos 1–3.">Volume I · Lingering Warmth.</p><div class="opening-note" data-en="This is a reviewed four-language literary preview. The Chinese manuscript remains the source text, and the multilingual edition will expand only after each section is prepared and reviewed." data-zh="这是英、中、法、西四语文学试读。中文母稿仍是源文本；后续多语言正文只在每一部分完成整理与审校后再继续扩展。" data-fr="Il s’agit d’un aperçu littéraire révisé en quatre langues. Le manuscrit chinois reste le texte source ; l’édition multilingue ne s’élargira qu’au fur et à mesure de la préparation et de la révision de chaque partie." data-es="Esta es una muestra literaria revisada en cuatro idiomas. El manuscrito chino sigue siendo el texto fuente; la edición multilingüe se ampliará solo después de preparar y revisar cada sección.">This is a reviewed four-language literary preview.</div></section>
