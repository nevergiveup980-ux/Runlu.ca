<!doctype html><meta charset="utf-8"><title>RUNLU Flooring OS V0.3.86 Corruption & Reconciliation Torture</title><style>body{font:14px Arial;margin:24px;background:#f4f7f5;color:#173d30}button{padding:10px 14px;margin:4px}.ok{color:#176b3a}.bad{color:#a32222}pre{background:white;padding:14px;border:1px solid #ccd8d1;white-space:pre-wrap}.banner{font-weight:800}</style><h1>V0.3.86 · Corruption & Reconciliation Torture</h1><p class="banner">SANDBOX ONLY · DETECT → QUARANTINE → RECONCILE → VERIFY · NO PRODUCTION WRITES</p><button onclick="run(1)">Run Suite</button><button onclick="run(400)">Stress ×400</button><pre id="out">Ready.</pre><script>
const must=(x,m)=>{if(!x)throw Error(m)};const clone=x=>JSON.parse(JSON.stringify(x));
function seed(){return{inventory:{A:{qty:20,unit:'CTN'},B:{qty:-2,unit:'CTN'}},holds:[{id:'H1,item:'A',qty:25,status:'Held'},{id:'H2',item:'MISSING',qty:2,status:'Held'}],orders:{O1:{invoice:1000,paid:600,credits:100,status:'Invoiced'},O2:{invoice:null,paid:100,status:'Open'}},payments:[{id:'P1',order:'O1',amount:600,key:'K1'},{id:'P2',order:'GHOST',amount:50,key:'K2'}],pos:{PO1:{ordered:10,received:12,committed:1000}},bills:[{id:'VB1',po:'PO1',amount:1250},{id:'VB2',po:'GHOSTPO',amount:200}],products:{SKU1:{style:'Alpine',unit:'CTN'},SKU2:{style:'',unit:null}},quarantine:[]}}
function scan(s){let f=[];for(const[k,v]of Object.entries(s.inventory))if(v.qty<0)f.push(['NEGATIVE_INVENTORY',k]);for(const h of s.holds.filter(x=>x.status==='Held')){if(!s.inventory[h.item])f.push(['ORPHAN_HOLD',h.id]);else if(h.qty>s.inventory[h.item].qty)f.push(['HOLD_GT_PHYSICAL',h.id])}for(const p of s.payments)if(!s.orders[p.order])f.push(['ORPHAN_PAYMENT',p.id]);for(const[k,o]of Object.entries(s.orders)){if(o.invoice==null&&o.paid>0)f.push(['PAYMENT_WITHOUT_INVOICE',k]);if(o.invoice!=null&&o.paid+(o.credits||0)>o.invoice)f.push(['AR_OVERSETTLED',k])}for(const[k,p]of Object.entries(s.pos))if(p.received>p.ordered)f.push(['PO_OVERRECEIVED',k]);for(const b of s.bills)if(!s.pos[b.po])f.push(['ORPHAN_VENDOR_BILL',b.id]);for(const[k,p]of Object.entries(s.products))if(!p.style||!p.unit)f.push(['INCOMPLETE_PRODUCT',k]);return f}
function quarantine(s,type,id){s.quarantine.push({type,id});}
function suite(){let r=[];const t=(n,fn)=>{try{fn();r.push([1,n])}catch(e){r.push([0,n+': '+e.message])}};let s=seed(),f=scan(s);
t('negative inventory detected',()=>must(f.some(x=>x[0]==='NEGATIVE_INVENTORY'&&x[1]==='B'),'missing'));
t('Hold greater than physical stock detected',()=>must(f.some(x=>x[0]==='HOLD_GT_PHYSICAL'&&x[1]==='H1'),'missing'));
t('orphan Hold detected',()=>must(f.some(x=>x[0]==='ORPHAN_HOLD'&&x[1]==='H2'),'missing'));
t('orphan Payment detected',()=>must(f.some(x=>x[0]==='ORPHAN_PAYMENT'&&x[1]==='P2'),'missing'));
t('payment without invoice detected',()=>must(f.some(x=>x[0]==='PAYMENT_WITHOUT_INVOICE'&&x[1]==='O2'),'missing'));
t('PO over-receipt detected',()=>must(f.some(x=>x[0]==='PO_OVERRECEIVED'&&x[1]==='PO1'),'missing'));
t('orphan Vendor Bill detected',()=>must(f.some(x=>x[0]==='ORPHAN_VENDOR_BILL'&&x[1]==='VB2'),'missing'));
t('incomplete Product Master detected',()=>must(f.some(x=>x[0]==='INCOMPLETE_PRODUCT'&&x[1]==='SKU2'),'missing'));
t('Vendor Bill variance preserved separately',()=>{let p=s.pos.PO1,b=s.bills[0];must(b.amount-p.committed===250,'variance lost')});
t('corrupt record can be quarantined without deletion',()=>{let before=clone(s.payments.find(x=>x.id==='P2'));quarantine(s,'ORPHAN_PAYMENT','P2');must(s.quarantine.length===1&&JSON.stringify(before)===JSON.stringify(s.payments.find(x=>x.id==='P2')),'destructive quarantine')});
t('repair negative inventory requires explicit reconciliation',()=>{let x=clone(s);x.inventory.B.qty=0;must(!scan(x).some(q=>q[0]==='NEGATIVE_INVENTORY'),'repair failed');must(s.inventory.B.qty===-2,'source silently mutated')});
t('repair over-Hold requires explicit release/adjustment',()=>{let x=clone(s);x.holds.find(h=>h.id==='H1').qty=20;must(!scan(x).some(q=>q[0]==='HOLD_GT_PHYSICAL'&&q[1]==='H1'),'repair failed')});
t('A/R reconciles invoice minus cash minus credits',()=>{let o=s.orders.O1;must(o.invoice-o.paid-o.credits===300,'AR mismatch')});
t('reconciliation is repeatable and deterministic',()=>must(JSON.stringify(scan(s))===JSON.stringify(scan(clone(s))),'non-deterministic'));
t('clean repaired snapshot passes targeted critical checks',()=>{let x=clone(s);x.inventory.B.qty=0;x.holds.find(h=>h.id==='H1').qty=20;x.holds.find(h=>h.id==='H2').status='Quarantined';x.payments=x.payments.filter(p=>p.id!=='P2');x.orders.O2.invoice=100;x.pos.PO1.received=10;x.bills=x.bills.filter(b=>b.id!=='VB2');x.products.SKU2={style:'Recovered',unit:'CTN'};let z=scan(x);must(!z.length,'remaining findings '+JSON.stringify(z))});
return r}
function run(n){let all=[],bad=0;for(let i=0;i<n;i++){let r=suite();all=r;bad+=r.filter(x=>!x[0]).length}let total=all.length*n,pass=total-bad;out.className=bad?'bad':'ok';out.textContent=(bad?'FAIL':'PASS')+' · '+pass+'/'+total+' assertions · '+n+' cycle(s)\n\n'+all.map(x=>(x[0]?'PASS  ':'FAIL  ')+x[1]).join('\n')}
</script>
