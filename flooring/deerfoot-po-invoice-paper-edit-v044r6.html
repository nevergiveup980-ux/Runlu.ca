<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d30">
<title>PO Editable Deerfoot Invoice · V0.3.44R6</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf1ef}#editor{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}</style>
</head>
<body><iframe id="editor" title="PO Editable Deerfoot Invoice V0.3.44R6"></iframe>
<script>
(function(){
'use strict';
const outer=document.getElementById('editor');
function forceScrollLayout(){
  try{
    const d1=outer.contentDocument;if(!d1)return;
    const f2=d1.getElementById('editor');if(!f2)return;
    const d2=f2.contentDocument;if(!d2)return;
    const f3=d2.getElementById('editor');if(!f3)return;
    const d3=f3.contentDocument;if(!d3)return;
    const paper=d3.getElementById('paper');if(!paper)return;
    d3.documentElement.style.setProperty('height','auto','important');
    d3.documentElement.style.setProperty('min-height','100%','important');
    d3.documentElement.style.setProperty('overflow-y','auto','important');
    d3.body.style.setProperty('height','auto','important');
    d3.body.style.setProperty('min-height','100%','important');
    d3.body.style.setProperty('overflow-y','auto','important');
    d3.body.style.setProperty('padding-bottom','150px','important');
    const bar=d3.querySelector('.bar');if(bar){bar.style.setProperty('position','sticky','important');bar.style.setProperty('top','0','important');bar.style.setProperty('z-index','200','important')}
    function resizePaper(){
      try{
        const pd=paper.contentDocument;if(!pd)return;
        const h=Math.max(pd.documentElement.scrollHeight||0,pd.body?.scrollHeight||0,1180)+80;
        paper.style.setProperty('height',h+'px','important');
        paper.style.setProperty('min-height',h+'px','important');
        paper.style.setProperty('overflow','hidden','important');
        paper.setAttribute('scrolling','no');
      }catch(e){console.error('R6 paper resize failed',e)}
    }
    paper.addEventListener('load',()=>{setTimeout(resizePaper,80);setTimeout(resizePaper,300)});
    resizePaper();setTimeout(resizePaper,200);setTimeout(resizePaper,600);
    const title=d3.querySelector('.bar b');if(title)title.textContent='PO → Deerfoot Invoice · Paper Edit Mode · V0.3.44R6 Research';
    const guide=d3.getElementById('poPaperGuide044R2');if(guide&&!guide.dataset.r6){guide.dataset.r6='1';guide.insertAdjacentHTML('beforeend',' <b>Full-paper view:</b> the editable invoice now expands to its full paper height so the lower-left PO number and signature area remain reachable on mobile.');}
  }catch(e){console.error('R6 full-paper layout failed',e)}
}
function schedule(){[120,350,700,1200].forEach(ms=>setTimeout(forceScrollLayout,ms))}
outer.addEventListener('load',schedule);
outer.src='deerfoot-po-invoice-paper-edit-v044r5.html?layout=044r6&t='+Date.now();
})();
</script></body></html>
