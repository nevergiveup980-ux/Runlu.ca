<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173d30">
<title>RUNLU Deerfoot Flooring OS V0.3.43R4 Full Build</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf1ef;font-family:Arial,Helvetica,sans-serif}#os{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}.boot{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:#edf1ef;color:#173d30;font-weight:800;text-align:center;line-height:1.45;transition:opacity .18s ease}.boot.ready{opacity:0;pointer-events:none}.boot.fail{color:#7a2b2b;background:#fff4f1}.boot small{display:block;margin-top:8px;font-weight:500;color:#63716b}
</style>
</head>
<body>
<div id="boot" class="boot"><div>RUNLU Deerfoot Flooring OS<br>V0.3.43R4 Full Build<small>Loading verified modules + PO Delivery + Training Reset…</small></div></div>
<iframe id="os" title="RUNLU Deerfoot Flooring OS V0.3.43R4"></iframe>
<script>
(function(){
'use strict';
const frame=document.getElementById('os'),boot=document.getElementById('boot');
function fail(msg){boot.classList.remove('ready');boot.classList.add('fail');boot.innerHTML='<div>'+msg+'<small>V0.3.43R3 and stable/v0.3.43r2-combined remain available for rollback.</small></div>'}
function patchLabels(w,d){
  try{
    d.title='RUNLU Deerfoot Flooring OS V0.3.43R4 Full Build';
    const pill=d.querySelector('header .pill');if(pill)pill.textContent='V0.3.43R4 Full Build';
    const brand=d.querySelector('header .brand span');if(brand)brand.textContent='Integrated full build · Deerfoot-native PO + Delivery + Claim + Training Reset';
    const demo=d.querySelector('#command .demo');if(demo)demo.textContent='V0.3.43R4 FULL BUILD · Safe PO Training Reset restored with local backup.';
    const poMuted=d.querySelector('#purchasing .statusLine .muted');if(poMuted)poMuted.textContent='V0.3.43R4 · PO Delivery + Source / Reference + Deerfoot Invoice + safe Training Reset.';
    const svc=d.querySelector('#serviceclaims .statusLine .muted');if(svc)svc.textContent='After-sale service, original Deerfoot Claim Invoice, inspection, supplier recovery and final resolution.';
    const poModule=[...d.querySelectorAll('.module')].find(x=>x.querySelector('strong')?.textContent==='PO / Supplier Orders');if(poModule){const s=poModule.querySelector('small');if(s)s.textContent='Delivery, Source / Reference, pricing, Alberta GST 5%, Deerfoot Invoice and Training Reset.'}
    const claimModule=d.getElementById('serviceClaimsModule');if(claimModule){const s=claimModule.querySelector('small');if(s)s.textContent='Service / Claims with original Deerfoot Claim Invoice and Job-bound data handoff.'}
  }catch(e){console.error('V043R4 label patch failed',e)}
}
function patchPOOutput(w){
  try{
    if(w.__runluV043R4POOutputPatch)return;
    w.__runluV043R4POOutputPatch=true;
    const nativeOpen=w.open.bind(w);
    w.open=function(url,target,features){
      try{
        const u=String(url||'');
        if(u.includes('deerfoot-po-invoice-v040.html')){
          const key='runlu_flooring_po_deerfoot_invoice_v040';
          const data=JSON.parse(w.localStorage.getItem(key)||'{}')||{};
          const po=String(data.poNumber||'').trim();if(po)data.invoiceNumber=po;
          const delivery=String(w.document.getElementById('poDeliverySafe')?.value||'').trim();if(delivery)data.delivery=delivery;
          w.localStorage.setItem(key,JSON.stringify(data));
        }
      }catch(e){console.error('V043R4 PO output compatibility patch failed',e)}
      return nativeOpen(url,target,features);
    };
  }catch(e){console.error('V043R4 PO output patch failed',e)}
}
function loadScript(d,src,flag){
  return new Promise((resolve,reject)=>{
    const old=d.querySelector('script['+flag+']');if(old)return resolve();
    const s=d.createElement('script');s.src=src;s.setAttribute(flag,'1');s.onload=resolve;s.onerror=reject;d.body.appendChild(s);
  });
}
async function inject(){
  try{
    const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return fail('V0.3.43R4 could not access the integrated app.');
    patchLabels(w,d);patchPOOutput(w);
    await loadScript(d,'po-delivery-bridge-v043r3.js?v=043r4','data-runlu-v043r3-delivery');
    try{w.RUNLUPODelivery043R3?.install()}catch(_){}
    await loadScript(d,'po-training-reset-v043r4.js?v=043r4','data-runlu-v043r4-reset');
    try{w.RUNLUPOTrainingReset043R4?.install()}catch(_){}
    await loadScript(d,'claim-integration-v042r1.js?v=043r4','data-runlu-v043-claim');
    try{w.RUNLUClaimIntegration042R2?.install()}catch(_){}
    patchLabels(w,d);patchPOOutput(w);boot.classList.add('ready');
  }catch(e){console.error(e);fail('V0.3.43R4 integration failed to initialize.');}
}
frame.addEventListener('load',()=>setTimeout(inject,80));
frame.src='index-v040.html?v=043r4&t='+Date.now();
})();
</script>
</body>
</html>
