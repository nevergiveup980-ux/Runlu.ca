function patchLabels(w,d){try{d.title='RUNLU Deerfoot Flooring OS V0.3.44 Dual-Track Invoice Research';const pill=d.querySelector('header .pill');if(pill)pill.textContent='V0.3.44 Dual-Track Invoice';const brand=d.querySelector('header .brand span');if(brand)brand.textContent='Research · R4 verified base + Database Mode + Editable Regular / PO Paper Invoice';const demo=d.querySelector('#command .demo');if(demo)demo.textContent='V0.3.44 RESEARCH · Production V0.3.43R4 remains unchanged.';const inv=[...d.querySelectorAll('.module')].find(x=>x.querySelector('strong')?.textContent==='Deerfoot Invoice');if(inv){const s=inv.querySelector('small');if(s)s.textContent='Dual-track: system database workflow or direct paper-style editable invoice.'}const po=[...d.querySelectorAll('.module')].find(x=>x.querySelector('strong')?.textContent==='PO / Supplier Orders');if(po){const s=po.querySelector('small');if(s)s.textContent='Dual-track PO: structured form entry plus standard or editable Deerfoot paper preview.'}}catch(e){console.error(e)}}
function patchPOOutput(w){try{if(w.__runluV044POOutputPatch)return;w.__runluV044POOutputPatch=true;const nativeOpen=w.open.bind(w);w.open=function(url,target,features){try{const u=String(url||'');if(u.includes('deerfoot-po-invoice-v040.html')){const key='runlu_flooring_po_deerfoot_invoice_v040',data=JSON.parse(w.localStorage.getItem(key)||'{}')||{},po=String(data.poNumber||'').trim();if(po)data.invoiceNumber=po;const delivery=String(w.document.getElementById('poDeliverySafe')?.value||'').trim();if(delivery)data.delivery=delivery;w.localStorage.setItem(key,JSON.stringify(data))}}catch(e){console.error(e)}return nativeOpen(url,target,features)}}catch(e){console.error(e)}}
