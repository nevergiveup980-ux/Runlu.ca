<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUNLU Flooring · Customer Desk</title>
<style>body{font:16px system-ui;margin:0;background:#f5f6f7;color:#17202a}header,main{max-width:1100px;margin:auto;padding:18px}.bar{display:flex;gap:10px;flex-wrap:wrap}.bar>*{min-height:48px;font-size:16px}.az button{min-width:44px;min-height:44px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:14px;margin:10px 0}.muted{color:#667085}.hidden{display:none}.card{cursor:pointer}.pill{display:inline-block;padding:3px 8px;border:1px solid #d0d5dd;border-radius:999px;font-size:13px}.profile{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:10px 0}.profile input,.profile textarea{width:100%;box-sizing:border-box;min-height:44px;font-size:16px;margin:5px 0}.profile button{min-height:44px;font-size:16px;margin:4px}.contact{border-top:1px solid #eee;padding:10px 0}</style></head><body><header><h1>Customer Desk</h1><p class="muted">Company-owned customer master · your Desk shows customers assigned to you.</p><div class="bar"><input id="search" placeholder="Search name, company, phone, email, address"><select id="sales"></select><button id="new">New Customer</button><button id="picker">Customer Picker</button><span class="muted">Job bridge: safe adapter only · no Job writes from Customer Desk</span></div><div class="az" id="az"></div></header><main><section id="pickerPanel" class="hidden profile"><button id="pickerClose">← Customer Desk</button><h2>Select Customer</h2><p class="muted">Search only customers assigned to this Sales Desk. Search by name, company, phone, email or address.</p><input id="pickerSearch" placeholder="Search customer"><div id="pickerResults"></div></section><section id="profile" class="hidden"></section><section id="list"></section></main><script src="customer-master-v1.js?v=1"></script><script>
const pp=document.getElementById('pickerPanel'),ps=document.getElementById('pickerSearch'),pr=document.getElementById('pickerResults');
document.getElementById('picker').onclick=()=>{pp.classList.remove('hidden');ps.value='';drawPicker('');ps.focus()};
document.getElementById('pickerClose').onclick=()=>pp.classList.add('hidden');
function drawPicker(q){const rows=window.RUNLUCustomerMasterV1.pickCustomer(q);pr.innerHTML=rows.map(c=>'<div class="card" data-pick="'+c.id+'"><b>'+c.name+'</b><div>'+c.phone+' '+c.email+'</div><div class="muted">'+c.address+'</div></div>').join('')||'<div class="muted">No matching customers on this Desk.</div>'}
ps.oninput=()=>drawPicker(ps.value);
pr.onclick=e=>{const x=e.target.closest('[data-pick]');if(!x)return;const c=window.RUNLUCustomerMasterV1.pickCustomer().find(v=>v.id===x.dataset.pick);window.dispatchEvent(new CustomEvent('runlu:customer-picked',{detail:c}));pp.classList.add('hidden')};
</script></body></html>
