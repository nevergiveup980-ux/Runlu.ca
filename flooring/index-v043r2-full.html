<script>
(function(){
'use strict';
const frame=document.getElementById('os'),boot=document.getElementById('boot');
function fail(msg){boot.classList.remove('ready');boot.classList.add('fail');boot.innerHTML='<div>'+msg+'<small>Rollback snapshots remain preserved.</small></div>'}
function patchLabels(w,d){
  try{
    d.title='RUNLU Deerfoot Flooring OS V0.3.43R2 Full Build';
    const pill=d.querySelector('header .pill');if(pill)pill.textContent='V0.3.43R2 Full Build';
    const brand=d.querySelector('header .brand span');if(brand)brand.textContent='Integrated Deerfoot build · Sales Desk + PO + Claim workflows';
    const demo=d.querySelector('#command .demo');if(demo)demo.textContent='V0.3.43R2 FULL BUILD · Verified PO and Claim workflows integrated.';
    const poMuted=d.querySelector('#purchasing .statusLine .muted');if(poMuted)poMuted.textContent='V0.3.43R2 · structured Source / Reference + Deerfoot Invoice preview / print.';
    const svc=d.querySelector('#serviceclaims .statusLine .muted');if(svc)svc.textContent='After-sale service, original Deerfoot Claim Invoice, inspection, supplier recovery and final resolution.';
    const poModule=[...d.querySelectorAll('.module')].find(x=>x.querySelector('strong')?.textContent==='PO / Supplier Orders');if(poModule){const s=poModule.querySelector('small');if(s)s.textContent='Source / Reference, pricing, Alberta GST 5%, Deerfoot Invoice preview / print.'}
    const claimModule=d.getElementById('serviceClaimsModule');if(claimModule){const s=claimModule.querySelector('small');if(s)s.textContent='Service / Claims with original Deerfoot Claim Invoice and Job-bound data handoff.'}
  }catch(e){console.error('V043R2 full label patch failed',e)}
}
function patchPOOutput(w){
  try{
    if(w.__runluV043R2FullPOOutputPatch)return;
    w.__runluV043R2FullPOOutputPatch=true;
    const nativeOpen=w.open.bind(w);
    w.open=function(url,target,features){
      try{
        const u=String(url||'');
        if(u.includes('deerfoot-po-invoice-v040.html')){
          const key='runlu_flooring_po_deerfoot_invoice_v040';
          const data=JSON.parse(w.localStorage.getItem(key)||'{}')||{};
          const po=String(data.poNumber||'').trim();
          if(po){data.invoiceNumber=po;w.localStorage.setItem(key,JSON.stringify(data));}
        }
      }catch(e){console.error('V043R2 full PO number patch failed',e)}
      return nativeOpen(url,target,features);
    };
  }catch(e){console.error('V043R2 full PO output patch failed',e)}
}
function inject(){
  try{
    const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return fail('V0.3.43R2 could not access the integrated app.');
    patchLabels(w,d);patchPOOutput(w);
    let s=d.querySelector('script[data-runlu-v043-claim]');
    if(s){try{w.RUNLUClaimIntegration042R2?.install()}catch(_){};boot.classList.add('ready');return}
    s=d.createElement('script');s.src='claim-integration-v042r1.js?v=043r2full';s.dataset.runluV043Claim='1';
    s.onload=()=>{try{patchLabels(w,d);patchPOOutput(w);w.RUNLUClaimIntegration042R2?.install();boot.classList.add('ready')}catch(e){console.error(e);fail('V0.3.43R2 Claim integration did not finish loading.')}};

    d.body.appendChild(s);
  }catch(e){console.error(e);fail('V0.3.43R2 integration failed to initialize.');}
}
frame.addEventListener('load',()=>setTimeout(inject,80));
frame.src='index-v040.html?v=043r2full&t='+Date.now();
})();
</script>
