(function(){

const state={version:'0.3.81',base:'V0.3.78',baseVisible:false,deepReady:false,modules:{},startedAt:new Date().toISOString()};
window.RUNLUResilientV081=state;

function paint(){if(!showDiag)return;const xs=Object.entries(state.modules),ok=xs.filter(([,v])=>v==='loaded').length,bad=xs.filter(([,v])=>v==='failed').length,pending=xs.filter(([,v])=>v==='loading').length;diag.textContent=`V0.3.81 · base ${state.baseVisible?'OPEN':'WAIT'} · deep ${state.deepReady?'READY':'WAIT'} · modules ${ok} loaded / ${bad} failed / ${pending} loading`;}

function assetUrl(src){return new URL(src,location.href).href+(src.includes('?')?'&':'?')+'t='+Date.now()}
function loadOptional(ctx,item){return new Promise(resolve=>{
