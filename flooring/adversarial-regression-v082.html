<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUNLU Flooring OS V0.3.82 Adversarial Regression</title><style>body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#edf1ef;color:#21372d}.top{padding:18px;background:#173d30;color:white}.top h1{margin:0 0 6px}.wrap{max-width:1300px;margin:auto;padding:14px}.card{background:white;border:1px solid #dce5e0;border-radius:12px;padding:12px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.test{border:1px solid #dce5e0;border-radius:9px;padding:10px}.pass{color:#17653f;font-weight:800}.fail{color:#963c32;font-weight:800}.warn{color:#8b6a1d;font-weight:800}.btn{border:1px solid #dce5e0;border-radius:8px;background:#fff;padding:9px 12px;font-weight:800;cursor:pointer}.log{background:#102019;color:#dce8df;padding:10px;border-radius:8px;height:280px;overflow:auto;font-family:monospace;font-size:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><h1>RUNLU Flooring OS · Adversarial Regression</h1><div>V0.3.82 · intentionally hostile business tests · sandbox only</div></div><div class="wrap"><div class="card"><button id="run" class="btn">Run Adversarial Suite</button> <button id="stress" class="btn">Stress × 50</button> <button id="back" class="btn">Back</button><p><b>Rule:</b> these tests are designed to break unsafe assumptions. They do not write production data.</p></div><div class="card"><h3 id="summary">Not run</h3><div id="tests" class="grid"></div></div><div class="card"><h3>Event Log</h3><div id="log" class="log"></div></div></div><script>(function(){'use strict';const $=id=>document.getElementById(id);function state(){return{inv:{X:20},holds:[],po:{},orders:{},payments:[],events:[]}}function assert(name,fn){try{fn();return{name,pass:true}}catch(e){return{name,pass:false,error:e.message}}function must(c,m){if(!c)throw new Error(m)}function available(s,id){return s.inv[id]-(s.holds.filter(h=>h.item===id&&h.status==='Held').reduce((a,h)=>a+h.qty,0))}function hold(s,o,item,q){must(q>0,'qty must be positive');must(q<=available(s,item),'over-hold blocked');must(!s.holds.some(h=>h.order===o&&h.item===item&&h.status==='Held'),'duplicate active hold blocked');s.holds.push({order:o,item,qty:q,status:'Held'})}function release(s,o,item){const h=s.holds.find(h=>h.order===o&&h.item===item&&h.status==='Held');must(h,'active hold missing');h.status='Released'}function consumeForOrder(s,o,item,q){const h=s.holds.find(h=>h.order===o&&h.item===item&&h.status==='Held');must(h,'order hold required');must(q<=h.qty,'cannot consume beyond order hold');must(q<=s.inv[item],'cannot consume beyond physical stock');s.inv[item]-=q;h.qty-=q;if(h.qty===0)h.status='Consumed'}function makePO(s,id,q){must(q>0,'PO qty must be positive');s.po[id]={qty:q,received:0,status:'Issued'}}function receive(s,id,q){const p=s.po[id];must(p,'PO missing');must(q>0,'receipt qty must be positive');must(p.received+q<=p.qty,'over-receipt blocked');p.received+=q;p.status=p.received===p.qty?'Received':'Partial'}function invoice(s,id,amt){must(amt>=0,'invoice negative');s.orders[id]={invoice:amt,paid:0,status:'Invoiced'}}function pay(s,id,amt,key){const o=s.orders[id];must(o,'order missing');must(amt>0,'payment positive');must(o.paid+amt<=o.invoice,'overpayment blocked');must(!s.payments.some(p=>p.key===key),'duplicate payment blocked');o.paid+=amt;s.payments.push({id,amt,key})}function cancel(s,id){Object.values(s.holds).forEach(()=>{});s.holds.filter(h=>h.order===id&&h.status==='Held').forEach(h=>h.status='Released');if(s.orders[id])s.orders[id].status='Cancelled'}function suite(){const out=[];out.push(assert('Two orders share same inventory safely',()=>{let s=state();hold(s,'A','X',8);hold(s,'B','X',7);consumeForOrder(s,'A','X',8);must(s.holds.find(h=>h.order==='B').status==='Held','B hold was consumed');must(available(s,'X')===5,'available mismatch')}));out.push(assert('Over-hold is rejected',()=>{let s=state();hold(s,'A','X',21)}));out[out.length-1].pass=!out[out.length-1].pass;out[out.length-1].error=out[out.length-1].pass?null:'over-hold was not rejected';out.push(assert('Duplicate active hold is rejected',()=>{let s=state();hold(s,'A','X',5);hold(s,'A','X',2)}));out[out.length-1].pass=!out[out.length-1].pass;out[out.length-1].error=out[out.length-1].pass?null:'duplicate hold was not rejected';out.push(assert('Partial PO receipt remains Partial',()=>{let s=state();makePO(s,'P1',10);receive(s,'P1',4);must(s.po.P1.status==='Partial','status not Partial');must(s.po.P1.received===4,'received mismatch')}));out.push(assert('PO over-receipt is rejected',()=>{let s=state();makePO(s,'P1',10);receive(s,'P1',11)}));out[out.length-1].pass=!out[out.length-1].pass;out[out.length-1].error=out[out.length-1].pass?null:'over-receipt was not rejected';out.push(assert('Duplicate receipt after full receive is rejected',()=>{let s=state();makePO(s,'P1',5);receive(s,'P1',5);receive(s,'P1',1)}));out[out.length-1].pass=!out[out.length-1].pass;out[out.length-1].error=out[out.length-1].pass?null:'duplicate receipt was not rejected';out.push(assert('Overpayment is rejected',()=>{let s=state();invoice(s,'O1',1000);pay(s,'O1',1200,'K1')}));out[out.length-1].pass=!out[out.length-1].pass;out[out.length-1].error=out[out.length-1].pass?null:'overpayment was not rejected';out.push(assert('Duplicate payment key is rejected',()=>{let s=state();invoice(s,'O1',1000);pay(s,'O1',500,'K1');pay(s,'O1',500,'K1')}));out[out.length-1].pass=!out[out.length-1].pass;out[out.length-1].error=out[out.length-1].pass?null:'duplicate payment was not rejected';out.push(assert('Cancel releases active hold',()=>{let s=state();invoice(s,'O1',1000);hold(s,'O1','X',10);cancel(s,'O1');must(available(s,'X')===20,'hold not released');must(s.holds[0].status==='Released','status mismatch')}));out.push(assert('Partial consume preserves remaining hold',()=>{let s=state();hold(s,'O1','X',10);consumeForOrder(s,'O1','X',4);must(s.holds[0].qty===6,'remaining hold wrong');must(s.holds[0].status==='Held','hold status wrong');must(s.inv.X===16,'physical inventory wrong')}));out.push(assert('Negative or zero hold rejected',()=>{let s=state();hold(s,'O1','X',0)}));out[out.length-1].pass=!out[out.length-1].pass;out[out.length-1].error=out[out.length-1].pass?null:'zero hold was not rejected';out.push(assert('Consume without order hold rejected',()=>{let s=state();consumeForOrder(s,'O1','X',2)}));out[out.length-1].pass=!out[out.length-1].pass;out[out.length-1].error=out[out.length-1].pass?null:'unreserved consume was not rejected';return out}function run(cycles){let all=[],fails=0;for(let i=0;i<cycles;i++){const r=suite();all=r;fails+=r.filter(x=>!x.pass).length}const total=all.length*cycles;$('summary').innerHTML=`${fails===0?'<span class="pass">PASS</span>':'<span class="fail">FAIL</span>'} · ${total-fails}/${total} assertions · ${cycles} cycle(s)`;$('tests').innerHTML=all.map(x=>`<div class="test"><div class="${x.pass?'pass':'fail'}">${x.pass?'✓ PASS':'✕ FAIL'}</div><b>${x.name}</b>${x.error?`<div>${x.error}</div>`:''}</div>`).join('');$('log').innerHTML=`Suite completed. Cycles=${cycles}, assertions=${total}, failed=${fails}<br>`+all.map(x=>`${x.pass?'PASS':'FAIL'} · ${x.name}${x.error?' · '+x.error:''}`).join('<br>')} $('run').onclick=()=>run(1);$('stress').onclick=()=>run(50);$('back').onclick=()=>location.href='simulation-lab-v081.html';run(1)})();</script></body></html>
