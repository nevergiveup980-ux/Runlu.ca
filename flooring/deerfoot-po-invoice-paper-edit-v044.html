<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173d30">
<title>PO Editable Deerfoot Invoice · V0.3.44 Research</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf1ef;font-family:Arial,Helvetica,sans-serif;color:#203129}.bar{min-height:66px;background:#173d30;color:#fff;padding:max(9px,env(safe-area-inset-top)) 12px 9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bar b{font-size:15px;margin-right:auto}.bar button{border:0;border-radius:10px;padding:10px 12px;font-weight:800;background:#e8eeeb;color:#173d30}.bar .save{background:#d9ebff;color:#1f568f}.bar .commit{background:#fff0c6;color:#684d00}.bar .print{background:#fff;color:#173d30}.sub{background:#f5f7f6;border-bottom:1px solid #dce4e0;padding:7px 12px;font-size:12px;line-height:1.35;color:#53615a}.sub b{color:#173d30}.sub .draft{font-weight:800;color:#8a5b00}#paper{width:100%;height:calc(100% - 112px);border:0;background:#fff}@media(max-width:760px){.bar b{width:100%;margin-right:0}.bar button{padding:9px 10px}.sub{font-size:11px}#paper{height:calc(100% - 164px)}}
</style>
</head>
<body>
<div class="bar">
  <b>PO → Deerfoot Invoice · Paper Edit Mode · V0.3.44 Research</b>
  <button onclick="reloadFromPO()">Reload from PO</button>
  <button onclick="loadDraft()">Load Draft</button>
  <button class="save" onclick="saveDraft()">Save Draft</button>
  <button onclick="recalculateLines()">Recalculate</button>
  <button class="commit" onclick="saveToPO()">Save to PO</button>
  <button class="print" onclick="printPaper()">Print / Save PDF</button>
</div>
<div class="sub"><b>Dual-track PO rule:</b> the normal PO form remains unchanged. Paper Edit Mode writes directly on the familiar Deerfoot Invoice; Save to PO updates the PO record, not the customer Job. <span id="status">Loading PO…</span></div>
<iframe id="paper" title="Editable PO Deerfoot Invoice"></iframe>
<script>
(function(){
'use strict';
const PO_STORE='runlu_deerfoot_supplier_orders_v1',PREVIEW='runlu_flooring_po_deerfoot_invoice_v040',DRAFTS='runlu_deerfoot_po_paper_drafts_v044',DELIVERY_SIDE='runlu_deerfoot_po_delivery_v043r3',GST=.05;
const frame=document.getElementById('paper'),status=document.getElementById('status');let doc=null,win=null,payload={};
const read=(k,f)=>{try{const x=JSON.parse(localStorage.getItem(k)||'null');return x==null?f:x}catch(_){return f}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const n=v=>{const x=Number(String(v??'').replace(/[$,]/g,'').trim());return Number.isFinite(x)?x:0},money=v=>'$'+Number(v||0).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});
function poNo(){return String(payload.poNumber||payload.invoiceNumber||'').replace(/^PO\s*#?\s*/i,'').trim()}
function key(){return poNo()?'po:'+poNo():'draft:'+String(payload.jobNumber||'none')+':'+String(payload.invoiceDate||'')}
function iso(v,f=''){const s=String(v||'').trim();if(!s)return f;if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const d=new Date(s);return Number.isNaN(d.getTime())?f:d.toISOString().slice(0,10)}
function splitQtyUnit(text,old){const s=String(text||'').trim();const m=s.match(/^(-?\d+(?:\.\d+)?)\s*(.*)$/);return m?{qty:m[1],unit:(m[2]||old?.unit||'').trim().toLowerCase()}:{qty:s,unit:old?.unit||''}}
function injectStyle(){const s=doc.createElement('style');s.textContent=`.appbar,.controls,.hint{display:none!important}.previewWrap{padding-top:10px!important}.data{z-index:8!important;pointer-events:auto!important}.static{z-index:2!important}.paperEditField,.paperEditPrice{cursor:text!important;pointer-events:auto!important;border-radius:1px;min-height:3mm}.paperEditField:hover,.paperEditPrice:hover{background:rgba(255,247,188,.45)}.paperEditField:focus,.paperEditPrice:focus{outline:.35mm solid rgba(207,166,32,.7)!important;background:#fff5b8!important}.items{z-index:9!important}.items td{position:relative;z-index:10;pointer-events:auto!important}.priceRowData{z-index:12!important;pointer-events:auto!important}.paperEditCalculated{background:rgba(232,238,235,.42)}.paperEditHint{position:absolute;left:11mm;top:278mm;font-size:5pt;color:#8a6b1b;z-index:20}@media print{.paperEditField,.paperEditPrice{outline:none!important;background:transparent!important}.paperEditHint{display:none!important}}`;doc.head.appendChild(s)}
function editable(sel){const el=doc.querySelector(sel);if(!el)return;el.contentEditable='true';el.spellcheck=false;el.classList.add('paperEditField')}
function ensurePriceRows(){const data=doc.querySelector('.data');if(!data)return;doc.querySelectorAll('.priceRowData').forEach(x=>x.remove());const items=Array.isArray(payload.items)?payload.items:[];for(let i=0;i<15;i++){const top=108+i*5.02;['price','total'].forEach(kind=>{const el=doc.createElement('div');el.className='priceRowData '+kind+' paperEditPrice';el.dataset.row=i;el.dataset.kind=kind;el.style.top=top+'mm';el.contentEditable='true';el.spellcheck=false;const x=items[i]||{};el.innerText=kind==='price'?(x.unitCost!==''&&x.unitCost!=null?Number(x.unitCost).toFixed(2):''):(x.lineTotal?Number(x.lineTotal).toFixed(2):'');data.appendChild(el)})}}
function enable(){['.soldData','.shipData','.emailData','.cellData','.phoneHData','.phoneWData','.pickData','.deliveryData','.requiredData','.clerkData','.dateData','.notesData'].forEach(editable);doc.querySelectorAll('#rows td').forEach(td=>{td.contentEditable='true';td.spellcheck=false;td.classList.add('paperEditField')});ensurePriceRows();const sums=[...doc.querySelectorAll('.totalData')];[0,4].forEach(i=>{if(sums[i]){sums[i].contentEditable='true';sums[i].classList.add('paperEditField')}});[1,2,3,5].forEach(i=>sums[i]?.classList.add('paperEditCalculated'));const hint=doc.createElement('div');hint.className='paperEditHint';hint.textContent='PO PAPER EDIT MODE · PO number stays protected';doc.querySelector('.invoice')?.appendChild(hint);doc.addEventListener('input',()=>recalc(false))}
function apply(d){payload={...payload,...d};const q=s=>doc.querySelector(s);q('.soldData').innerText=[d.customerName,d.soldToAddress].filter(Boolean).join('\n');q('.shipData').innerText=[d.shipToName||d.customerName,d.shipToAddress].filter(Boolean).join('\n');q('.emailData').innerText=d.email||'';q('.cellData').innerText=d.cell||'';q('.phoneHData').innerText=d.phoneHome||'';q('.phoneWData').innerText=d.phoneWork||'';q('.pickData').innerText=d.pickup||'';q('.deliveryData').innerText=d.delivery||'';q('.requiredData').innerText=d.dateRequired||'';q('.clerkData').innerText=d.clerk||'';q('.dateData').innerText=d.invoiceDate||'';q('.notesData').innerText=d.notes||'';doc.querySelectorAll('.invoiceNoTop,.invoiceNoBottom').forEach(x=>x.textContent=poNo());const rows=[...doc.querySelectorAll('#rows tr')],items=Array.isArray(d.items)?d.items:[];rows.forEach((tr,i)=>{const x=items[i]||{},vals=[[x.qty,x.unit].filter(Boolean).join(' '),x.size||'',x.style||'',x.colour||'',x.sourceRef||x.supplier||''];[...tr.children].forEach((td,j)=>td.innerText=vals[j]||'')});ensurePriceRows();const sums=[...doc.querySelectorAll('.totalData')];if(sums[0])sums[0].innerText=money(d.deliveryCharge||0);if(sums[4])sums[4].innerText=money(d.depositPaid||0);recalc(false)}
function collect(){const q=s=>doc.querySelector(s),rows=[...doc.querySelectorAll('#rows tr')],prices=[...doc.querySelectorAll('.priceRowData.price')],lineTotals=[...doc.querySelectorAll('.priceRowData.total')],oldItems=Array.isArray(payload.items)?payload.items:[];const items=rows.map((tr,i)=>{const c=[...tr.children].map(td=>td.innerText.trim()),old=oldItems[i]||{},qu=splitQtyUnit(c[0],old);return {...old,qty:qu.qty,unit:qu.unit,size:c[1]||'',style:c[2]||'',colour:c[3]||'',sourceRef:c[4]||'',supplier:old.supplier||payload.supplier||'',sourceType:old.sourceType||'Supplier',unitCost:n(prices[i]?.innerText),lineTotal:n(lineTotals[i]?.innerText)}}).filter(x=>x.qty||x.size||x.style||x.colour||x.sourceRef||x.unitCost||x.lineTotal);const sums=[...doc.querySelectorAll('.totalData')];return {invoiceDate:q('.dateData')?.innerText.trim()||'',pickup:q('.pickData')?.innerText.trim()||'',delivery:q('.deliveryData')?.innerText.trim()||'',dateRequired:q('.requiredData')?.innerText.trim()||'',clerk:q('.clerkData')?.innerText.trim()||'',notes:q('.notesData')?.innerText.trim()||'',items,deliveryCharge:n(sums[0]?.innerText),depositPaid:n(sums[4]?.innerText),customerSnapshot:{sold:q('.soldData')?.innerText.trim()||'',ship:q('.shipData')?.innerText.trim()||'',email:q('.emailData')?.innerText.trim()||'',cell:q('.cellData')?.innerText.trim()||'',phoneHome:q('.phoneHData')?.innerText.trim()||'',phoneWork:q('.phoneWData')?.innerText.trim()||''},updatedAt:new Date().toISOString()}}
function recalc(lines){if(!doc)return;const rows=[...doc.querySelectorAll('#rows tr')],prices=[...doc.querySelectorAll('.priceRowData.price')],lineTotals=[...doc.querySelectorAll('.priceRowData.total')];if(lines)rows.forEach((tr,i)=>{const qu=splitQtyUnit(tr.children[0]?.innerText||'',{}),qty=n(qu.qty),price=n(prices[i]?.innerText);if(qty&&price)lineTotals[i].innerText=(qty*price).toFixed(2)});const lineSub=lineTotals.reduce((s,x)=>s+n(x.innerText),0),sums=[...doc.querySelectorAll('.totalData')],delivery=n(sums[0]?.innerText),sub=lineSub+delivery,gst=Math.round(sub*GST*100)/100,total=sub+gst,deposit=n(sums[4]?.innerText);if(sums[1])sums[1].innerText=money(sub);if(sums[2])sums[2].innerText=money(gst);if(sums[3])sums[3].innerText=money(total);if(sums[5])sums[5].innerText=money(Math.max(0,total-deposit))}
function draftDb(){return read(DRAFTS,{})}function updateStatus(){const d=draftDb()[key()];status.innerHTML='<b>PO '+(poNo()||'Unnumbered')+'</b>'+(d?' · <span class="draft">Draft saved '+new Date(d.savedAt||d.updatedAt).toLocaleString()+'</span>':' · No paper draft saved yet.')}
function boot(){win=frame.contentWindow;doc=frame.contentDocument;payload=read(PREVIEW,{});injectStyle();enable();apply(payload);updateStatus()}
window.reloadFromPO=function(){payload=read(PREVIEW,{});frame.src='deerfoot-po-invoice-v040.html?paperedit=044&t='+Date.now()};
window.saveDraft=function(){if(!doc)return;const db=draftDb();db[key()]={...collect(),poNumber:poNo(),savedAt:new Date().toISOString()};write(DRAFTS,db);updateStatus();alert('PO paper draft saved. The PO Ledger record was not changed.')};
window.loadDraft=function(){const d=draftDb()[key()];if(!d)return alert('No saved PO paper draft for this PO.');apply({...payload,...d});alert('Saved PO paper draft loaded.')};
window.recalculateLines=function(){recalc(true)};
window.saveToPO=function(){if(!doc)return;const num=poNo();if(!num)return alert('This preview has no PO number yet. Save/issue the PO first, or use Save Draft.');const rows=read(PO_STORE,[]);if(!Array.isArray(rows))return alert('PO Ledger could not be read.');const i=rows.findIndex(r=>String(r.poNumber||'')===num);if(i<0)return alert('PO #'+num+' was not found in the PO Ledger. Save/record the PO first.');if(!confirm('Save these paper edits back to PO #'+num+'? The customer Job will not be changed.'))return;const x=collect(),r=rows[i];r.orderDate=iso(x.invoiceDate,r.orderDate||'');r.expectedDate=iso(x.dateRequired,r.expectedDate||'');r.requestedDate=iso(x.pickup,r.requestedDate||'');r.delivery=x.delivery;r.salesRep=x.clerk||r.salesRep||'';r.notes=x.notes;r.items=x.items;r.subtotal=Math.round(x.items.reduce((s,a)=>s+n(a.lineTotal),0)*100)/100;r.paperCustomerSnapshot=x.customerSnapshot;r.updatedAt=new Date().toISOString();rows[i]=r;write(PO_STORE,rows);const side=read(DELIVERY_SIDE,{});side['po:'+num]=x.delivery||'';write(DELIVERY_SIDE,side);payload={...payload,poNumber:num,invoiceDate:r.orderDate,pickup:r.requestedDate,delivery:r.delivery,dateRequired:r.expectedDate,clerk:r.salesRep,notes:r.notes,items:r.items,subtotal:r.subtotal};write(PREVIEW,payload);const db=draftDb();db[key()]={...x,poNumber:num,savedAt:new Date().toISOString()};write(DRAFTS,db);apply(payload);updateStatus();alert('Paper edits saved back to PO #'+num+'. Customer Job data was not changed.')};
window.printPaper=function(){win?.focus();win?.print()};
payload=read(PREVIEW,{});frame.addEventListener('load',()=>setTimeout(boot,70));frame.src='deerfoot-po-invoice-v040.html?paperedit=044&t='+Date.now();
})();
</script>
</body>
</html>
