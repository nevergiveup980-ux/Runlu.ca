<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173d30">
<title>RUNLU Deerfoot Flooring OS V0.3.79 Integration Ready</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf1ef;font-family:Arial,Helvetica,sans-serif}
#os79{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#boot79{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:#edf1ef;color:#173d30;font-weight:800;text-align:center;line-height:1.45;transition:opacity .18s ease}
#boot79.ready{opacity:0;pointer-events:none}#boot79.fail{color:#7a2b2b;background:#fff4f1}#boot79 small{display:block;margin-top:8px;font-weight:500;color:#63716b}
</style>
</head>
<body>
<div id="boot79"><div>RUNLU Deerfoot Flooring OS<br>V0.3.79 Integration Ready<small>V0.3.78 Cost Control · Provider-neutral Integration Hub · RFMS bridge reserved…</small></div></div>
<iframe id="os79" title="RUNLU Deerfoot Flooring OS V0.3.79"></iframe>
<script>
(function(){
'use strict';
const outer=document.getElementById('os79'),boot=document.getElementById('boot79');
let done=false,tries=0;
function fail(message){boot.classList.remove('ready');boot.classList.add('fail');boot.innerHTML='<div>'+message+'<small>V0.3.78 remains the rollback baseline.</small></div>'}
function inject(){
  try{
    const d78=outer.contentDocument;if(!d78)return false;
    const os78=d78.getElementById('os78');if(!os78)return false;
    const d71=os78.contentDocument;if(!d71)return false;
    const os71=d71.getElementById('os');if(!os71)return false;
    const appDoc=os71.contentDocument,appWin=os71.contentWindow;if(!appDoc||!appWin||!appDoc.body)return false;
    if(appDoc.querySelector('script[data-runlu-v079-integration]')){
      try{appWin.RUNLUIntegrationHubV079?.install?.()}catch(_){}
      boot.classList.add('ready');done=true;return true;
    }
    const s=appDoc.createElement('script');
    s.src='integration-hub-v079.js?v=079&t='+Date.now();
    s.dataset.runluV079Integration='1';
    s.onload=()=>{try{appWin.RUNLUIntegrationHubV079?.install?.()}catch(e){console.error(e)}try{appDoc.title='RUNLU Deerfoot Flooring OS V0.3.79 Integration Ready';const pill=appDoc.querySelector('header .pill');if(pill)pill.textContent='V0.3.79 Integration Ready';}catch(_){}boot.classList.add('ready');done=true};
    s.onerror=()=>fail('V0.3.79 Integration Hub asset could not load.');
    appDoc.body.appendChild(s);return true;
  }catch(e){console.error(e);return false}
}
function wait(){if(done)return;if(inject())return;if(++tries<100)setTimeout(wait,150);else fail('V0.3.79 could not reach the integrated Flooring OS.')}
outer.addEventListener('load',()=>{tries=0;setTimeout(wait,150)});
outer.src='index-v078-business-cost-control.html?v=079&t='+Date.now();
})();
</script>
</body>
</html>
