<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUNLU Flooring · Supplier Master</title><style>*{box-sizing:border-box}body{font:16px system-ui;margin:0;background:#f5f6f7;color:#17202a}header,main{max-width:1100px;margin:auto;padding:18px}.bar{display:flex;gap:10px;flex-wrap:wrap}.bar>*{min-height:48px;font-size:16px}.card,.profile{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin:10px 0}.card{cursor:pointer}.muted{color:#667085}.hidden{display:none}.pill{margin-left:8px;padding:3px 8px;border:1px solid #d0d5dd;border-radius:999px;font-size:13px}.profile input:not([type=checkbox]),.profile select,.profile textarea,.sheet input,.sheet select,.sheet textarea,.sheet button{width:100%;min-height:48px;font-size:16px;margin:5px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.safe{background:#f3f7f5;border:1px solid #cadbd2;border-radius:12px;padding:12px;margin:12px 0}.contact{border-top:1px solid #eee;padding:10px 0}.contact button{margin-left:8px;min-height:40px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.hidden{display:none}.sheet{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:18px}.actions{display:flex;gap:10px}.actions button{flex:1}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>Supplier Master</h1><p class="muted">Company-owned supplier directory · portal links, contacts, ordering rules and read-only PO history.</p><div class="bar"><input id="search" placeholder="Search supplier, phone, email, address"><button id="new">New Supplier</button></div></header><main><section id="profile" class="hidden"></section><section id="list"></section></main><div id="supplierModal" class="modal hidden"><form id="supplierForm" class="sheet"><h2>New Supplier</h2><p class="muted">Create the supplier record first. Credentials are never entered here.</p><input id="supplierName" placeholder="Supplier name" required><div class="grid"><input id="supplierWebsite" placeholder="Website" inputmode="url"><input id="supplierPortal" placeholder="Supplier portal URL" inputmode="url"><input id="supplierPhone" placeholder="Phone" inputmode="tel"><input id="supplierEmail" placeholder="Email" inputmode="email"><input id="supplierFreight" placeholder="Freight rule"><input id="supplierMinimum" placeholder="Minimum order"><input id="supplierDiscount" placeholder="Discount rule"></div><textarea id="supplierAddress" placeholder="Address"></textarea><textarea id="supplierNotes" placeholder="Account / ordering notes"></textarea><div id="supplierMsg" class="muted"></div><div class="actions"><button type="button" id="supplierCancel">Cancel</button><button type="submit">Create Supplier</button></div></form></div><div id="contactModal" class="modal hidden"><form id="contactForm" class="sheet"><h2>Add Supplier Contact</h2><div class="grid"><input id="contactName" placeholder="Contact name" required><input id="contactRole" placeholder="Role / title"><input id="contactPhone" placeholder="Phone" inputmode="tel"><input id="contactEmail" placeholder="Email" inputmode="email"></div><div class="actions"><button type="button" id="contactCancel">Cancel</button><button type="submit">Add Contact</button></div></form></div><script src="supplier-master-v1.js?v=1"></script><script>
const sm=document.getElementById('supplierModal'),sf=document.getElementById('supplierForm'),msg=document.getElementById('supplierMsg');document.getElementById('new').onclick=()=>{sf.reset();msg.textContent='';sm.classList.remove('hidden');document.getElementById('supplierName').focus()};document.getElementById('supplierCancel').onclick=()=>sm.classList.add('hidden');sf.onsubmit=e=>{e.preventDefault();const r=RUNLUSupplierMasterV1.createSupplier({name:supplierName.value,website:supplierWebsite.value,portalUrl:supplierPortal.value,phone:supplierPhone.value,email:supplierEmail.value,address:supplierAddress.value,freightRule:supplierFreight.value,minimumOrder:supplierMinimum.value,discountRule:supplierDiscount.value,accountNotes:supplierNotes.value});if(!r.ok){msg.textContent=r.message;return}sm.classList.add('hidden')};
const cm=document.getElementById('contactModal'),cf=document.getElementById('contactForm');document.getElementById('contactCancel').onclick=()=>cm.classList.add('hidden');window.addEventListener('runlu:add-supplier-contact',()=>{cf.reset();cm.classList.remove('hidden');contactName.focus()});cf.onsubmit=e=>{e.preventDefault();const r=RUNLUSupplierMasterV1.addContact({name:contactName.value,role:contactRole.value,phone:contactPhone.value,email:contactEmail.value});if(r.ok){cm.classList.add('hidden');cf.reset()}else alert(r.message)};
</script></body></html>
