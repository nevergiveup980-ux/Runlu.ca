<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101713"><title>RUNLU LAB 005 · Garden Ambient Audio</title><style>
:root{--bg:#101713;--ink:#edf0e9;--muted:#9ca99f;--line:#2b3930;--green:#9ab9a2}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 28%,#1c2b21,#101713 58%);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{height:70px;max-width:960px;margin:auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center}.brand,.back{color:inherit;text-decoration:none}.brand{font-weight:700;letter-spacing:.18em}.right{display:flex;gap:12px;align-items:center}.back{font-size:12px;color:var(--muted)}select{border:1px solid var(--line);background:#142019;color:var(--ink);border-radius:999px;padding:7px 26px 7px 10px}main{max-width:760px;margin:auto;padding:8vh 22px 12vh;text-align:center}.eyebrow{font:600 11px ui-monospace,SFMono-Regular,monospace;letter-spacing:.18em;color:var(--green)}h1{font-size:clamp(42px,8vw,74px);letter-spacing:-.055em;margin:18px 0 12px}.lead{max-width:580px;margin:auto;color:var(--muted);line-height:1.7}.power{margin:34px 0;border:1px solid var(--green);background:transparent;color:var(--ink);border-radius:999px;padding:12px 20px;cursor:pointer}.mixer{margin:18px auto 0;max-width:580px;border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:1fr 1.4fr 42px;gap:16px;align-items:center;text-align:left;padding:23px 0;border-bottom:1px solid var(--line)}.row b{font-weight:500}.row small{display:block;color:var(--muted);margin-top:5px}.row output{text-align:right;color:var(--muted);font:11px ui-monospace,SFMono-Regular,monospace}input{width:100%;accent-color:#9ab9a2}.note{max-width:560px;margin:34px auto 0;color:var(--muted);font-size:12px;line-height:1.7}.breath{width:92px;height:92px;margin:42px auto 0;border:1px solid #425748;border-radius:50%;animation:breathe 9s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.16);opacity:.65}}@media(max-width:560px){.row{grid-template-columns:1fr}.row output{display:none}}</style></head><body>
<header class="top"><a class="brand" href="index.html">RUNLU</a><div class="right"><select data-runlu-language-select><option value="en">English</option><option value="zh">中文</option><option value="fr">Français</option><option value="es">Español</option></select><a class="back" href="lab.html" data-en="← LAB" data-zh="← 实验室" data-fr="← LAB" data-es="← LAB">← LAB</a></div></header><main>
<div class="eyebrow" data-en="RUNLU LAB · EXPERIMENT 005" data-zh="RUNLU LAB · 实验 005" data-fr="RUNLU LAB · EXPÉRIENCE 005" data-es="RUNLU LAB · EXPERIMENTO 005">RUNLU LAB · EXPERIMENT 005</div>
<h1 data-en="Garden Ambient Audio." data-zh="数字花园声景。" data-fr="Paysage sonore du jardin." data-es="Paisaje sonoro del jardín.">Garden Ambient Audio.</h1>
<p class="lead" data-en="Four quiet layers. Mix only what you need." data-zh="四层安静的声音。只留下你需要的。" data-fr="Quatre couches calmes. Ne gardez que ce dont vous avez besoin." data-es="Cuatro capas tranquilas. Mezcla solo lo que necesites.">Four quiet layers. Mix only what you need.</p>
<button class="power" id="power" type="button" aria-pressed="false" data-en="Enter the sound garden" data-zh="进入声音花园" data-fr="Entrer dans le jardin sonore" data-es="Entrar al jardín sonoro">Enter the sound garden</button><div class="breath"></div><section class="mixer">
<div class="row"><div><b data-en="Wind" data-zh="远山微风" data-fr="Vent" data-es="Viento">Wind</b><small>soft · distant</small></div><input id="wind" type="range" min="0" max="100" value="28"><output>28</output></div>
<div class="row"><div><b data-en="Leaves" data-zh="竹叶沙沙" data-fr="Feuilles" data-es="Hojas">Leaves</b><small>dry · close</small></div><input id="leaves" type="range" min="0" max="100" value="18"><output>18</output></div>
<div class="row"><div><b data-en="Rain" data-zh="静夜微雨" data-fr="Pluie" data-es="Lluvia">Rain</b><small>fine · even</small></div><input id="rain" type="range" min="0" max="100" value="12"><output>12</output></div>
<div class="row"><div><b data-en="Chime" data-zh="远处钟声" data-fr="Carillon" data-es="Campana">Chime</b><small>rare · far away</small></div><input id="chime" type="range" min="0" max="100" value="8"><output>8</output></div></section>
<p class="note" data-en="No recording is loaded. This experiment synthesizes sound locally in your browser. Nothing is uploaded." data-zh="没有加载录音。这一版声音直接在你的浏览器里本地合成，不上传任何东西。" data-fr="Aucun enregistrement n’est chargé. Le son est synthétisé localement dans votre navigateur." data-es="No se carga ninguna grabación. El sonido se sintetiza localmente en tu navegador.">No recording is loaded. Sound is synthesized locally.</p></main>
<script>
(()=>{
 let ctx=null,master=null,on=false,timer=null,noiseNodes={};
 const $=id=>document.getElementById(id),power=$('power'),scale={wind:.40,leaves:.20,rain:.28};
 function init(){
   const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Web Audio unavailable');
   ctx=new AC();master=ctx.createGain();master.gain.value=.85;master.connect(ctx.destination);
 }
 function makeNoise(id,type,freq){
   const seconds=3,len=Math.floor(ctx.sampleRate*seconds),buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
   for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
   const src=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
   src.buffer=buf;src.loop=true;f.type=type;f.frequency.value=freq;g.gain.value=0;
   src.connect(f);f.connect(g);g.connect(master);src.start();
   noiseNodes[id]={src,g}; return g;
 }
 function ensureNoise(){
   if(!noiseNodes.wind)makeNoise('wind','lowpass',760);
   if(!noiseNodes.leaves)makeNoise('leaves','bandpass',2900);
   if(!noiseNodes.rain)makeNoise('rain','highpass',1300);
 }
 function apply(id){if(!ctx||!noiseNodes[id])return;noiseNodes[id].g.gain.setTargetAtTime(on?(+$(id).value/100)*scale[id]:0,ctx.currentTime,.05)}
 function bell(){
   if(!on||!ctx||+$('chime').value<1)return;const t=ctx.currentTime,v=+$('chime').value/100;
   [440,554.37,659.25].forEach((hz,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=hz;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,v*.32/(i+1)),t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+3.8+i*.4);o.connect(g).connect(master);o.start(t);o.stop(t+5)});
 }
 function label(){
   const zh=(document.documentElement.lang||'').toLowerCase().startsWith('zh');
   power.textContent=on?(zh?'暂停声音花园':'Pause the sound garden'):(zh?'进入声音花园':'Enter the sound garden');
 }
 async function activate(){
   try{
     if(!ctx)init();
     await ctx.resume();
     if(ctx.state!=='running'){power.textContent='Audio blocked · tap again';return}
     on=!on;
     if(on){
       ensureNoise();['wind','leaves','rain'].forEach(apply);bell();clearInterval(timer);timer=setInterval(bell,17000);
     }else{
       ['wind','leaves','rain'].forEach(apply);clearInterval(timer);
     }
     label();
   }catch(e){power.textContent='Audio unavailable'}
 }
 power.addEventListener('click',activate);
 ['wind','leaves','rain','chime'].forEach(id=>$(id).addEventListener('input',()=>{$(id).nextElementSibling.value=$(id).value;apply(id)}));
})();
</script><script src="runlu-language.js?v=2.2"></script></body></html>
