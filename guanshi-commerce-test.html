  <style>
    .test-shell{max-width:980px;margin:0 auto;padding:36px 20px 72px}.test-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap}.test-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:24px}.card{padding:20px;border:1px solid rgba(67,56,40,.16);border-radius:18px;background:rgba(255,255,255,.54)}.card h2,.card h3{margin-top:0}.status-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.status-row{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid rgba(67,56,40,.1)}.status-row strong{display:block;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;opacity:.6}.good{color:#245f49}.warn{color:#8a5a15}.bad{color:#8b2f2f}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.action-top{padding:10px 0}.next-action{margin:8px 0 4px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.72);border:1px solid rgba(67,56,40,.12);line-height:1.6}.next-action strong{display:block;margin-bottom:2px}.btn{border:1px solid rgba(67,56,40,.22);background:white;color:inherit;border-radius:999px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}.btn.primary{background:#3f3a34;color:white;border-color:#3f3a34}.btn:disabled{opacity:.5;cursor:wait}.plans{display:grid;gap:10px}.plan{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:12px;border:1px solid rgba(67,56,40,.12);border-radius:14px}.plan-copy{display:grid;gap:4px}.plan-copy small{opacity:.65}.log{white-space:pre-wrap;word-break:break-word;min-height:90px;padding:14px;border-radius:14px;background:#292724;color:#f8f4ea;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.notice{margin:18px 0;padding:15px 17px;border-left:3px solid rgba(67,56,40,.45);background:rgba(255,255,255,.35);line-height:1.7}.language-select{min-width:110px}@media(max-width:760px){.test-grid,.status-grid{grid-template-columns:1fr}.plan{align-items:flex-start;flex-direction:column}.plan .btn{width:100%}.action-top{display:grid;grid-template-columns:1fr;position:sticky;top:76px;z-index:5;background:#f4efe4;padding:10px 0 12px}.action-top .btn{width:100%;min-height:48px}.next-action{font-size:.95rem}}</style>
</head>
<body class="guanshi-page">
  <header class="gs-header">
    <a class="brand" href="index.html">RUNLU</a>
    <nav class="gs-top-nav"><a href="guanshi-pricing.html" data-en="Pricing" data-zh="价格" data-fr="Tarifs" data-es="Precios">Pricing</a><a href="account.html" data-en="Account" data-zh="账户" data-fr="Compte" data-es="Cuenta">Account</a></nav>
    <select class="lang-toggle language-select" data-runlu-language-select aria-label="Choose site language"><option value="en">English</option><option value="zh">中文</option><option value="fr">Français</option><option value="es">Español</option></select>
  </header>
  <main class="test-shell">
    <div class="test-head"><div><p class="gs-overline">RUNLU FORESIGHT · COMMERCE</p><h1 data-en="Commerce Integration Center" data-zh="商业接入中心" data-fr="Centre d’intégration commerciale" data-es="Centro de integración comercial">Commerce Integration Center</h1><p data-en="Owner/admin only. Reuse the proven RUNLU Live Stripe trunk; validate only the new GUANSHI commerce branch." data-zh="仅限 owner/admin。复用已经跑通的 RUNLU Live Stripe 主干，只验收 GUANSHI 新增的商业分支。" data-fr="Réservé au propriétaire/admin. Réutiliser le tronc Stripe Live RUNLU déjà éprouvé et ne valider que la nouvelle branche GUANSHI." data-es="Solo owner/admin. Reutiliza el tronco Stripe Live de RUNLU ya probado y valida solo la nueva rama comercial de GUANSHI.">Owner/admin only. Reuse the proven RUNLU Live Stripe trunk.</p></div></div>
    <div class="notice" data-en="RUNLU already has real Live Stripe payment evidence. GUANSHI will use that same account, webhook and verification trunk. The remaining work is only to map three GUANSHI Live prices/payment links and verify subscription entitlement or Deep Reading credit behavior." data-zh="RUNLU 已经有真实的 Live Stripe 付款证据。GUANSHI 直接复用同一个 Stripe 账户、Webhook 和验签主干。剩下只需建立三套 GUANSHI Live 价格 / Payment Link，并验收 Plus 权限或 Deep Reading 点数。" data-fr="RUNLU dispose déjà de preuves de paiement Stripe Live réelles. GUANSHI réutilise le même compte, webhook et tronc de vérification. Il reste seulement à mapper trois prix/liens Live GUANSHI et à valider les droits Plus ou crédits Deep Reading." data-es="RUNLU ya tiene evidencia real de pagos Stripe Live. GUANSHI reutiliza la misma cuenta, webhook y tronco de verificación. Solo falta mapear tres precios/enlaces Live de GUANSHI y validar permisos Plus o créditos Deep Reading.">RUNLU already has real Live Stripe payment evidence.</div>

    <section class="test-grid">
      <article class="card">
        <h2 data-en="Readiness" data-zh="准备状态" data-fr="État de préparation" data-es="Estado">Readiness</h2>
        <div id="nextAction" class="next-action"></div>
        <div class="actions action-top"><button id="refreshBtn" class="btn primary" type="button" data-en="Refresh status" data-zh="刷新状态" data-fr="Actualiser l’état" data-es="Actualizar estado">Refresh status</button><a class="btn" href="https://dashboard.stripe.com/" target="_blank" rel="noopener" data-en="Open Stripe Dashboard" data-zh="打开 Stripe 后台" data-fr="Ouvrir Stripe Dashboard" data-es="Abrir Stripe Dashboard">Open Stripe Dashboard</a></div>
        <div id="statusGrid" class="status-grid"></div>
      </article>

      <article class="card">
        <h2 data-en="GUANSHI Live plans" data-zh="GUANSHI Live 方案" data-fr="Forfaits GUANSHI Live" data-es="Planes GUANSHI Live">GUANSHI Live plans</h2>
        <div id="plans" class="plans"></div>
        <p style="opacity:.65" data-en="This center does not charge customers. Public Buy buttons remain locked until the GUANSHI branch is verified." data-zh="本中心不会向客户扣款。GUANSHI 分支验收完成以前，公开购买按钮继续锁定。" data-fr="Ce centre ne débite aucun client. Les boutons d’achat publics restent verrouillés jusqu’à validation de la branche GUANSHI." data-es="Este centro no cobra a clientes. Los botones públicos seguirán bloqueados hasta validar la rama GUANSHI.">This center does not charge customers.</p>
      </article>
    </section>

    <section class="card" style="margin-top:16px">
      <h2 data-en="Test log" data-zh="测试日志" data-fr="Journal de test" data-es="Registro de prueba">Test log</h2>
      <div id="log" class="log">—</div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (()=>{"use strict";
    const SUPABASE_URL="https://ekrnknlawekeoszzkamd.supabase.co";
    const KEY="sb_publishable_Jr12gnQ7UrU6Wv9xz4L1aA_bcTZiGqn";
    const ENDPOINT=SUPABASE_URL+"/functions/v1/runlu-stripe-checkout";
    const client=window.supabase.createClient(SUPABASE_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
    const $=s=>document.querySelector(s), grid=$("#statusGrid"), plans=$("#plans"), log=$("#log"), refresh=$("#refreshBtn"), nextAction=$("#nextAction");
    let session=null,state=null;
    const language=()=>{const v=String(localStorage.getItem("runlu_site_language")||navigator.language||"en").toLowerCase();return v.startsWith("zh")?"zh":v.startsWith("fr")?"fr":v.startsWith("es")?"es":"en"};
    const msg={en:{signin:"Sign in to RUNLU Account first.",owner:"This page requires RUNLU owner/admin access.",working:"Working…",ready:"Ready",notReady:"Not ready",trunk:"Shared Live Stripe trunk",evidence:"Live payment evidence",catalog:"GUANSHI Live catalog",webhook:"Verified webhook",normalizer:"Event normalizer",public:"Public checkout",payout:"Bank payout",legal:"Legal terms",approved:"Public sales approval",mapped:"Mapped",pending:"Awaiting Stripe mapping",next:"Next action",needLiveCatalog:"The shared Live Stripe trunk is already proven. Create the three GUANSHI Live Product / Price / Payment Link entries in the same Stripe account, then map them here. No separate test secret is required.",readyToVerify:"All three GUANSHI Live price mappings are present. Next verify one controlled owner purchase for each new fulfillment type before public launch.",publicStillLocked:"Public checkout remains locked."},zh:{signin:"请先登录 RUNLU Account。",owner:"本页需要 RUNLU owner/admin 权限。",working:"正在处理…",ready:"已就绪",notReady:"未就绪",trunk:"共享 Live Stripe 主干",evidence:"Live 真实付款证据",catalog:"GUANSHI Live 商品映射",webhook:"Webhook 已验签",normalizer:"事件归一化",public:"公开结账",payout:"银行入账",legal:"法律条款",approved:"公开销售批准",mapped:"已映射",pending:"等待 Stripe 映射",next:"下一步",needLiveCatalog:"共享 Live Stripe 主干已经由真实交易证明。现在只需在同一个 Stripe 账户建立三套 GUANSHI Live Product / Price / Payment Link，再把它们映射进 RUNLU。不需要另装测试密钥。",readyToVerify:"三套 GUANSHI Live 价格映射已经齐全。下一步只需由 owner 控制性购买一次新增的交付类型，验收权限 / 点数后再公开。",publicStillLocked:"公开结账仍然保持锁定。"}},fr:{signin:"Connectez-vous d’abord à RUNLU Account.",owner:"Accès owner/admin requis.",working:"Traitement…",ready:"Prêt",notReady:"Non prêt",trunk:"Tronc Stripe Live partagé",evidence:"Preuve de paiement Live",catalog:"Catalogue GUANSHI Live",webhook:"Webhook vérifié",normalizer:"Normaliseur",public:"Paiement public",payout:"Versement bancaire",legal:"Conditions légales",approved:"Approbation de vente publique",mapped:"Mappé",pending:"Mappage Stripe en attente",next:"Prochaine étape",needLiveCatalog:"Le tronc Stripe Live partagé est déjà prouvé. Créez les trois Product / Price / Payment Link GUANSHI Live dans le même compte Stripe, puis mappez-les ici. Aucune clé test séparée n’est nécessaire.",readyToVerify:"Les trois prix GUANSHI Live sont mappés. Validez ensuite un achat contrôlé par type de livraison avant l’ouverture publique.",publicStillLocked:"Le paiement public reste verrouillé."},es:{signin:"Inicia sesión primero en RUNLU Account.",owner:"Esta página requiere acceso owner/admin.",working:"Procesando…",ready:"Listo",notReady:"No listo",trunk:"Tronco Stripe Live compartido",evidence:"Evidencia de pago Live",catalog:"Catálogo GUANSHI Live",webhook:"Webhook verificado",normalizer:"Normalizador",public:"Checkout público",payout:"Pago bancario",legal:"Términos legales",approved:"Aprobación de venta pública",mapped:"Mapeado",pending:"Mapeo de Stripe pendiente",next:"Siguiente paso",needLiveCatalog:"El tronco Stripe Live compartido ya está probado. Crea los tres Product / Price / Payment Link GUANSHI Live en la misma cuenta de Stripe y mapéalos aquí. No hace falta una clave de prueba separada.",readyToVerify:"Los tres precios GUANSHI Live ya están mapeados. Verifica después una compra controlada por cada nuevo tipo de entrega antes de abrir al público.",publicStillLocked:"El checkout público sigue bloqueado."}};
    const t=k=>msg[language()]?.[k]||msg.en[k]||k;
    function write(v){log.textContent=typeof v==="string"?v:JSON.stringify(v,null,2)}
    async function call(action,extra={}){
      if(!session)throw new Error(t("signin"));
      const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"apikey":KEY},body:JSON.stringify({action,...extra})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok||d.ok===false)throw new Error(d.error||("HTTP "+r.status));
      return d;
    }
    function chip(label,ok,value){
      const d=document.createElement("div");d.className="status-row";
      const s=document.createElement("strong");s.textContent=label;
      const v=document.createElement("span");v.className=ok?"good":"warn";v.textContent=value||(ok?t("ready"):t("notReady"));
      d.append(s,v);return d;
    }
    function render(){
      grid.replaceChildren();
      if(!state)return;
      const a=state.adapter||{},c=state.checkout_control||{};
      const nextText=state.live_guanshi_catalog_ready?t("readyToVerify"):t("needLiveCatalog");
      nextAction.innerHTML="<strong>"+t("next")+"</strong>"+nextText+"<br><span style='opacity:.65'>"+t("publicStillLocked")+"</span>";
      grid.append(
        chip(t("trunk"),state.shared_live_trunk_ready===true),
        chip(t("evidence"),state.live_payment_evidence_seen===true),
        chip(t("webhook"),state.verified_webhook_seen&&a.verify_webhook_ready===true),
        chip(t("normalizer"),a.normalize_event_ready===true),
        chip(t("catalog"),state.live_guanshi_catalog_ready===true),
        chip(t("payout"),c.payout_destination_ready===true),
        chip(t("legal"),c.legal_terms_accepted===true),
        chip(t("approved"),c.public_checkout_approved===true),
        chip(t("public"),c.checkout_enabled===true&&c.public_checkout_approved===true,(c.checkout_enabled&&c.public_checkout_approved)?t("ready"):"LOCKED")
      );
      plans.replaceChildren();
      const liveMaps=new Map((state.price_maps||[]).filter(x=>x.environment==="live").map(x=>[x.plan_key,x]));
      for(const p of state.plans||[]){
        const row=document.createElement("div");row.className="plan";
        const copy=document.createElement("div");copy.className="plan-copy";
        const strong=document.createElement("strong");strong.textContent=p.name;
        const map=liveMaps.get(p.plan_key);
        const mapped=!!(map&&map.mapping_status==="verified"&&map.provider_product_reference&&map.provider_price_reference);
        const small=document.createElement("small");small.textContent="CA$"+Number(p.price_cad).toFixed(2)+(p.billing_period==="month"?"/mo":p.billing_period==="year"?"/yr":"/reading")+" · "+(mapped?t("mapped"):t("pending"));
        copy.append(strong,small);
        const badge=document.createElement("span");badge.className=mapped?"good":"warn";badge.textContent=mapped?t("mapped"):t("pending");
        row.append(copy,badge);plans.append(row);
      }
    }
    async function load(){
      try{
        write(t("working"));
        const {data}=await client.auth.getSession();session=data?.session||null;
        if(!session){write(t("signin")+" https://runlu.ca/account.html");return}
        state=await call("status");render();write(state);
      }catch(e){write(e.message||String(e))}
    }
    refresh.addEventListener("click",load);
    load();
  })();
  </script>
  <script src="runlu-language.js?v=2.4"></script>
</body>
</html>
