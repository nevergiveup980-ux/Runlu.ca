<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" role="img" aria-labelledby="title desc">
  <title id="title">All the Evidence Was There — John Zhang</title>
  <desc id="desc">A minimalist suspense novel cover with an interrupted red evidence line crossing archival paper fragments.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101417"/>
      <stop offset="1" stop-color="#262b2d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="800" height="1200" fill="url(#bg)"/>
  <rect x="54" y="54" width="692" height="1092" rx="2" fill="none" stroke="#c7bda9" stroke-opacity="0.35"/>

  <g filter="url(#shadow)" opacity="0.96">
    <rect x="118" y="272" width="262" height="156" rx="3" fill="#eee9dd" transform="rotate(-5 249 350)"/>
    <rect x="426" y="315" width="246" height="142" rx="3" fill="#e8e2d5" transform="rotate(4 549 386)"/>
    <rect x="170" y="493" width="230" height="132" rx="3" fill="#e5dfd3" transform="rotate(2 285 559)"/>
    <rect x="446" y="535" width="190" height="120" rx="3" fill="#eee9dd" transform="rotate(-6 541 595)"/>
  </g>

  <g stroke="#7c7569" stroke-width="3" opacity="0.52">
    <line x1="154" y1="310" x2="338" y2="310"/>
    <line x1="150" y1="334" x2="318" y2="334"/>
    <line x1="146" y1="358" x2="330" y2="358"/>
    <line x1="462" y1="356" x2="628" y2="356"/>
    <line x1="458" y1="380" x2="614" y2="380"/>
    <line x1="204" y1="528" x2="354" y2="528"/>
    <line x1="202" y1="552" x2="338" y2="552"/>
    <line x1="474" y1="573" x2="602" y2="573"/>
    <line x1="470" y1="597" x2="582" y2="597"/>
  </g>

  <path d="M102 470 C210 438 270 486 355 452 S520 405 699 469" fill="none" stroke="#a63c36" stroke-width="8" stroke-linecap="round"/>
  <path d="M699 469 C635 520 588 489 528 535 S384 638 304 590 S166 553 111 610" fill="none" stroke="#a63c36" stroke-width="8" stroke-linecap="round"/>
  <g fill="#a63c36">
    <circle cx="102" cy="470" r="13"/><circle cx="355" cy="452" r="13"/><circle cx="528" cy="535" r="13"/><circle cx="111" cy="610" r="13"/>
  </g>

  <text x="400" y="130" text-anchor="middle" fill="#c8beaa" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="7">RUNLU ORIGINAL</text>
  <text x="400" y="752" text-anchor="middle" fill="#f3efe5" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="2">ALL THE EVIDENCE</text>
  <text x="400" y="826" text-anchor="middle" fill="#f3efe5" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="2">WAS THERE</text>
  <rect x="278" y="872" width="244" height="2" fill="#a63c36"/>
  <text x="400" y="918" text-anchor="middle" fill="#c8beaa" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="6">A NOVEL</text>
  <text x="400" y="1070" text-anchor="middle" fill="#f3efe5" font-family="Arial, Helvetica, sans-serif" font-size="30" letter-spacing="5">JOHN ZHANG</text>
</svg>