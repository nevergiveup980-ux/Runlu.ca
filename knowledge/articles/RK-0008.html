<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>RK-0008 · Why a Profitable Quote Can Turn Into a Losing Job · RUNLU KNOWLEDGE</title><style>:root{font-family:system-ui,-apple-system,sans-serif;background:#f7f4ed;color:#24352f}*{box-sizing:border-box}body{margin:0}main{max-width:840px;margin:auto;padding:20px 14px 70px}header{margin-bottom:18px}.status{color:#855324;font-weight:750;letter-spacing:.05em}h1{font-size:clamp(1.7rem,5vw,2.3rem);line-height:1.25}h2{font-size:1.18rem;margin-top:32px}p,li{line-height:1.85}article{background:white;border:1px solid #dce4db;border-radius:16px;padding:clamp(15px,4vw,30px)}select{font:inherit;padding:12px;border:1px solid #819e90;border-radius:10px;background:white;min-width:150px}label{display:block;margin:12px 0 7px}.table-wrap{max-width:100%;overflow-x:auto;border:1px solid #d9e2da;border-radius:10px;margin:20px 0}table{border-collapse:collapse;width:100%;min-width:530px}th,td{border-bottom:1px solid #e1e6df;padding:10px 12px;text-align:left}th{background:#edf3ee}td:not(:first-child),th:not(:first-child){text-align:right;white-space:nowrap}.table-wrap:focus-visible,select:focus-visible{outline:3px solid #236c61}footer{color:#5b655d;font-size:.9rem;margin-top:20px}a{color:#236c61}@media(max-width:480px){main{padding:12px 10px 40px}article{padding:15px}th,td{padding:9px}}</style></head><body><main><header><div class="status">RUNLU KNOWLEDGE · RK-0008 · PUBLICATION CANDIDATE · NOT PUBLISHED</div><label for="lang">Language / 语言 / Langue / Idioma</label><select id="lang" data-runlu-language-select><option value="en">English</option><option value="zh">中文</option><option value="fr">Français</option><option value="es">Español</option></select></header><article id="article"></article><footer><a id="back" href="../">← RUNLU KNOWLEDGE</a></footer><section id="references" aria-label="References"></section></main><script>const D={"en":"# Why a Profitable Quote Can Turn Into a Losing Job\n\nA business owner sends a quote for a cleaning contract. The customer accepts. The calendar fills up. The work gets done. Yet at the end of the month, the owner looks at the hours, supply receipts and travel costs and wonders where the expected profit went.\n\nThe mistake may not have been the selling price alone. It may have been the difference between **the job that was priced** and **the job that was actually delivered**.\n\nA quote is a prediction. Job costing is the discipline of checking that prediction against what happened.\n\n## 1. What did the original quote actually include?\n\nConsider a fictional small cleaning business in Canada. It agrees to service an office every week for a fixed **CA$1,200 per month**. The owner expects the job to require 24 hours of labour per month.\n\nFor this illustration, the owner uses **$25 per hour as an assumed fully loaded labour cost**. That is an invented planning figure, not a statement about local wages, payroll requirements or what any particular worker must be paid.\n\n| Estimated monthly job cost | CA$ |\n|---|---:|\n| Labour: 24 hours × $25 | 600 |\n| Cleaning supplies | 60 |\n| Travel and parking | 40 |\n| Allocated business overhead | 100 |\n| **Estimated total cost** | **800** |\n| **Quoted monthly revenue** | **1,200** |\n| **Estimated result after these allocated costs** | **400** |\n\nAt first glance, the quote appears attractive. Under these assumptions, the job is expected to leave $400 after the costs shown. But that figure is **not necessarily the business's formal net income**. It is a simplified job-level result, dependent on which costs were included and how overhead was assigned.\n\nThe quote only works as expected if the time, materials, travel and service scope remain close to the original assumptions.\n\n## 2. What happened after the work began?\n\nIn this fictional example, the customer asks for a little more attention to shared areas. Staff take longer than expected to finish the work. Supplies are consumed faster, and travel costs rise. Nobody changes the fixed monthly price.\n\nThe actual monthly costs become:\n\n| Actual monthly job cost | CA$ |\n|---|---:|\n| Labour: 34 hours × $25 | 850 |\n| Cleaning supplies | 90 |\n| Travel and parking | 60 |\n| Allocated business overhead | 100 |\n| **Actual total cost** | **1,100** |\n| **Monthly revenue, unchanged** | **1,200** |\n| **Actual result after these allocated costs** | **100** |\n\nThe job has **not lost money** under this baseline scenario. It still shows a positive $100 result after the listed costs. But the expected $400 has fallen to $100: **$300 of the anticipated result has disappeared**.\n\nWhere did the $300 go? Ten additional labour hours cost $250; supplies rose by $30; and travel rose by $20. Those changes add up to $300. The allocated overhead remained unchanged in this example.\n\nThis is why a busy calendar does not, by itself, demonstrate that individual jobs are meeting their quoted margins.\n\n## 3. A separate scenario: the same job turns into a loss\n\nNow imagine an **additional, separate hypothetical event**: a cleaning error requires corrective work that adds **$150** to the costs above. Assume the business cannot bill that amount to the customer.\n\nThe revised total cost is **$1,100 + $150 = $1,250**. With revenue still at $1,200, the result after the costs shown is **negative $50**.\n\nThis is the loss scenario. It must not be confused with the baseline example, where the job still produced $100. A $50 loss here is an **illustrative job-level loss after allocated costs**, not a verified statement about a real company's accounting profit or tax result.\n\nThe purpose is not to predict that rework will occur. It is to show how little room remains for unexpected costs when the original margin has already narrowed.\n\n## 4. Five ways a quote can quietly deteriorate\n\n**Unrecorded labour.** A task expected to take two hours repeatedly takes nearly three. A few minutes spent unlocking, setting up, collecting supplies or completing paperwork can add up across a month. Record the time actually attributable to the job rather than relying on memory.\n\n**Scope creep.** The customer asks for extra rooms, more frequent service, a new cleaning standard or work that was never part of the original agreement. Sometimes a business chooses to include a small courtesy. The important distinction is between an intentional courtesy and a permanent expansion nobody priced.\n\n**Supplies and equipment.** Chemicals, consumables, replacement parts, wear and disposal may cost more than estimated. Equipment costs require a consistent treatment; do not charge the same item once as a direct cost and again through overhead.\n\n**Travel and access.** Distance, parking, building access, waiting time and return trips can make a short job expensive to service. The quote should reflect the actual operating pattern, not merely the minutes spent inside the customer's premises.\n\n**Rework.** Correcting errors or returning for missed work uses labour and materials that were not in the plan. Track rework separately so it is not mistaken for normal service time.\n\nNone of these items automatically justifies charging a customer more. Whether a price can change depends on the agreement, the documented scope and what the parties authorize.\n\n## 5. Margin is not markup\n\nTwo percentages can describe the same quote and still mean different things.\n\nUsing the **original estimated costs**, the job has revenue of $1,200 and an estimated result of $400 after the costs listed.\n\n**Estimated margin on revenue** = $400 ÷ $1,200 × 100 = **33.3%** (rounded).\n\n**Estimated markup on estimated cost** = $400 ÷ $800 × 100 = **50%**.\n\nThese percentages are not interchangeable. Margin uses the selling price as the denominator; markup uses cost. In this article, the $400 figure includes an assumed overhead allocation, so the 33.3% is a **simplified job margin after allocated costs**, not a universally defined accounting gross-profit margin.\n\nUsing the **actual baseline costs**, the result is $100 on $1,200 revenue, or about **8.3%** on revenue. After the separate $150 rework scenario, the result is −$50, or approximately **−4.2%** on revenue.\n\nAlways name both the numerator and denominator when discussing percentages.\n\n## 6. How to handle overhead without double counting\n\nDirect costs can often be linked to a particular job: labour hours, supplies used on site, a parking receipt or a subcontractor invoice. Overhead may include shared expenses such as administration, bookkeeping, software or office costs.\n\nTo compare jobs consistently, a business may allocate a portion of shared overhead to each job using a documented method. The **$100 overhead figure in our example is an assumption**, not a recommended rate. A different allocation method could produce a different job-level result.\n\nDo not confuse an allocated cost with an additional cash payment made that month. Do not add the same vehicle, equipment or administrative expense twice. If the allocation method changes, explain that before comparing one month's job margin with another's.\n\nJob costing also differs from cash-flow management. A job can be profitable under the assumptions used here and still create a cash shortage while the customer has not yet paid. RK-0007 explores that separate timing problem.\n\n## 7. Define the job before the work begins\n\nA useful written scope can be short and plain. It should identify the location, service frequency, rooms or areas included, expected tasks, special requests, access arrangements, who supplies consumables, and the agreed price.\n\nFor recurring service, distinguish **regular tasks** from **periodic or extra tasks**. For example, weekly office cleaning may not automatically include carpet extraction, window washing or post-renovation cleanup.\n\nWhen a request changes, record what changed, the expected additional time or cost, and whether the customer has authorized a revised price or scope. The aim is to prevent surprises, not to turn every small conversation into a dispute.\n\nKeep the customer's actual agreement and applicable rules in view; this article is not legal advice and does not establish a right to unilaterally alter a contract.\n\n## 8. A one-page estimate-versus-actual checklist\n\nUse the following fields for each job or recurring contract. A notebook, spreadsheet or simple digital tool can work.\n\n| Checkpoint | Before accepting | After the work |\n|---|---|---|\n| Agreed price | Record quoted price and billing period | Confirm actual billable amount |\n| Scope | List included areas and tasks | Record additions or exclusions |\n| Labour | Estimate hours and assumed loaded cost | Record actual hours and comparable cost |\n| Supplies | Estimate consumables | Record actual consumption |\n| Travel | Estimate visits, distance, parking | Record actual visits and costs |\n| Equipment | Choose direct charge or allocation method | Apply the same method consistently |\n| Overhead | Document allocation assumption | Reconcile consistently |\n| Rework | Note potential risk and contingency | Track actual corrective work separately |\n| Changes | Define who can approve extras | Save approvals and revised terms |\n| Result | Revenue minus included estimated costs | Revenue minus comparable actual costs |\n\nFor a recurring job, review the results after the first few service visits, not only at the end of the year. Compare the same period and the same categories of cost. If the job requires more time than quoted, determine whether the cause is temporary, operational or a lasting scope change.\n\n## 9. When should the owner change course?\n\n**Improve the process** when the scope is stable but the team is losing time through avoidable travel, setup or inefficient scheduling. Efficiency should not come at the expense of safety or the agreed service quality.\n\n**Discuss scope** when the customer regularly requests work outside the agreement. Document the additional work and offer a clear revised arrangement rather than allowing unpriced extras to become the default.\n\n**Revisit pricing** when comparable actual costs consistently exceed the assumptions behind the quote. Explain the reason and respect existing contractual commitments.\n\n**Decline or stop pursuing a job** when the available price cannot support the work under reasonable assumptions and the scope cannot be changed. More revenue is not always better revenue.\n\nThe central question is not simply, “Did we win the contract?” It is, **“Did we understand what it would cost to deliver what we promised?”**\n\n## 10. The habit that protects a small business\n\nThe most useful job-costing system may be a simple routine: **estimate, record, compare, investigate, adjust**.\n\nAn estimate gives a reasoned starting point. Actual records show where that starting point was wrong. A comparison turns an uncomfortable surprise into something the business can learn from.\n\nA full calendar is evidence of demand. A signed quote is evidence of an agreement. Neither is proof of job-level profitability. That proof requires attention to the work performed, the costs incurred and the assumptions used to measure the result.\n\n**Editorial note:** All companies, amounts and situations in this article are fictional educational illustrations. The figures exclude any taxes or other items not explicitly listed. Accounting classifications, wage obligations, contract rights and tax treatment vary with circumstances; consult qualified professionals for business-specific decisions.","zh":"# 为什么报价看着有利润，订单做完却亏了钱？\n\n一家小型清洁公司的老板接到一份新合同。报价发出去，客户同意了，日程排得满满当当，工作也按时做完。可到了月底，老板把工时、耗材、停车费和往返路程算在一起，却发现：原来以为能赚的钱，怎么剩下这么一点？\n\n问题未必只在报价高低，而在于：**当初报价时设想的工作，和后来实际完成的工作，可能已经不是同一回事。**\n\n报价，是对未来成本的预测；项目成本核算，则是用真实记录检验这份预测。\n\n## 一、报价时，我们到底算进去了什么？\n\n假设加拿大有一家虚构的小型清洁公司，承接一处办公室的每周保洁，合同月价为 **1,200 加元**。老板预计每月需要 24 小时人工。\n\n为了便于演示，假设每小时的**综合人工成本**为 25 加元。这只是教学用的假设数字，不代表任何地区的实际工资水平、法定雇主成本或最低工资要求。\n\n| 每月预计项目成本 | 加元 |\n|---|---:|\n| 人工：24 小时 × $25 | 600 |\n| 清洁耗材 | 60 |\n| 交通及停车 | 40 |\n| 分摊的企业间接费用 | 100 |\n| **预计成本合计** | **800** |\n| **合同月收入** | **1,200** |\n| **扣除上述成本后的预计结余** | **400** |\n\n账面上看，这份报价相当不错。但这里的 400 加元，只是**按上述成本范围计算的项目结余**，并不必然等于企业财务报表中的净利润。计算结果取决于哪些成本被纳入，以及间接费用如何分摊。\n\n更重要的是：这个预计结果有一个前提——实际工时、耗材、交通和工作范围，都与最初设想相差不大。\n\n## 二、工作做起来以后，发生了什么？\n\n假设客户陆续提出，希望公共区域打扫得更细致一些。清洁人员完成任务所需的时间增加，耗材用得更多，交通费用也略有上升，但固定月价没有改变。\n\n实际账目变成了这样：\n\n| 每月实际项目成本 | 加元 |\n|---|---:|\n| 人工：34 小时 × $25 | 850 |\n| 清洁耗材 | 90 |\n| 交通及停车 | 60 |\n| 分摊的企业间接费用 | 100 |\n| **实际成本合计** | **1,100** |\n| **合同月收入（不变）** | **1,200** |\n| **扣除上述成本后的实际结余** | **100** |\n\n注意，**这个基本情景还没有亏损**。扣除表中列出的成本后，仍然有 100 加元结余。\n\n但原本预计的 400 加元，现在只剩 100 加元，**300 加元的预期结余不见了**。\n\n这 300 加元究竟花在哪里？多出的 10 小时人工增加了 250 加元，耗材增加了 30 加元，交通增加了 20 加元，三项合计正好 300 加元。本例中分摊的间接费用保持不变。\n\n这就是为什么，日程排满了，并不等于每一份合同都达到了原先预计的盈利水平。\n\n## 三、再看一个独立情景：真正发生亏损\n\n现在另设一种**额外的假设情况**：由于一次清洁失误，公司需要返工，新增成本 **150 加元**，而这笔费用不能再向客户收取。\n\n新的总成本是 **1,100 + 150 = 1,250 加元**。合同收入仍为 1,200 加元，因此扣除所列成本后的结果是 **负 50 加元**。\n\n**这才是本文所说的亏损情景。** 不能把前面仍有 100 加元结余的基本情景直接称为亏损。这里的负 50 加元是一个包含假设间接费用分摊的项目层面结果，并非真实企业的会计净利润或税务结果。\n\n设置这个情景，不是说返工必然发生，而是说明：当原有结余已被侵蚀得很薄时，一次额外支出就可能使项目转亏。\n\n## 四、五种容易悄悄吞掉利润的成本\n\n**1. 没有如实记录的人工时间。** 原以为两小时能完成的任务，实际每次都要将近三小时。开门、准备工具、收拾物品、填写记录，这些零散时间一个月累积起来可能不少。与其凭记忆估算，不如记录真正归属于该项目的工时。\n\n**2. 工作范围不断扩大。** 客户要求增加房间、提高频率、提升清洁标准，或者安排合同里原本没有的任务。偶尔提供一点额外服务可以是有意识的客户维护，但应分清：这是一次主动赠送，还是未经重新报价就永久增加了工作量。\n\n**3. 耗材和设备成本。** 清洁剂、消耗品、配件更换、设备磨损和垃圾处理等费用，可能超过最初预计。设备费用尤其需要采用一致的核算方法，避免既直接计入项目成本，又通过间接费用重复计算。\n\n**4. 交通与进场成本。** 距离、停车、进入建筑物的手续、等待时间以及额外往返，都可能让一项看似简单的工作变得昂贵。报价不能只看人在客户场所内实际清洁的分钟数。\n\n**5. 返工。** 补做遗漏的任务、修正错误或重新到场，都会消耗额外人工与材料。最好把返工单独记录，别让它混在正常服务时间里，看不出问题所在。\n\n当然，成本增加不等于企业就有权自动向客户加价。价格能否调整，要看双方约定的工作范围、合同条款以及获得的授权。\n\n## 五、利润率和加价率，别混为一谈\n\n同一份报价，可以算出两个不同的百分比。\n\n按最初预计数字：收入 1,200 加元，列示成本 800 加元，预计结余 400 加元。\n\n**按收入计算的预计项目结余率** = 400 ÷ 1,200 × 100 ≈ **33.3%**。\n\n**按预计成本计算的加价率** = 400 ÷ 800 × 100 = **50%**。\n\n一个以售价为分母，一个以成本为分母，所以不能把 33.3% 和 50% 当作同一个概念。\n\n由于本例的 400 加元已经扣除了假设分摊的间接费用，33.3% 应理解为**按本文列示成本计算的简化项目结余率**，而不能不加说明地称为所有会计口径下通用的毛利率。\n\n基本情景的实际结余为 100 加元，占收入约 **8.3%**；在另外增加 150 加元返工成本的独立情景中，结余变为负 50 加元，占收入约 **−4.2%**。\n\n谈百分比之前，先说清楚分子和分母是什么。\n\n## 六、间接费用怎么分摊，才不会重复计算？\n\n直接成本通常较容易对应到某个项目：现场人工、实际耗材、停车票据或分包费用。间接费用则可能包括行政管理、记账、软件、办公场所等多个项目共同使用的资源。\n\n为了比较不同合同，企业可以按照一种有记录、前后一致的方法，把部分间接费用分配给各项目。上例中的 **100 加元分摊额纯属假设**，不是推荐标准。换一种分摊方法，算出的项目结余可能也不同。\n\n还要记住：分摊到项目上的费用，不一定意味着当月为该项目另外支付了一笔现金。车辆、设备或管理费用也不能既在直接成本里算一次，又在间接费用里再算一次。\n\n项目成本核算和现金流管理也不是一回事。一份合同即使按上述假设仍有结余，如果客户迟迟没有付款，企业照样可能缺现金。这个时间差问题，咱们在 RK-0007 中已经单独讨论过。\n\n## 七、开工之前，先把工作范围写清楚\n\n一份实用的工作范围说明，不必写得复杂，却应该明确：服务地点、频率、房间和区域、具体任务、特殊要求、进入场所的安排、耗材由谁提供，以及约定价格。\n\n对于周期性服务，最好区分**常规工作**和**周期性或额外工作**。例如，每周办公室保洁，不必然包含地毯深度清洗、玻璃清洗或装修后的彻底清理。\n\n当客户提出新要求时，记录改变了什么、预计增加多少时间或成本，以及双方是否同意调整范围或价格。这样做不是为了斤斤计较，而是为了让双方都清楚约定的内容。\n\n具体仍须以真实合同和适用规定为准。本文不是法律意见，也不意味着企业可以单方面修改合同。\n\n## 八、一张可以反复使用的“报价与实际成本核对表”\n\n每项工程或周期性合同，都可以使用下面的栏目。纸笔、电子表格或者简单的软件工具都能胜任。\n\n| 核对项目 | 接单之前 | 工作完成之后 |\n|---|---|---|\n| 约定价格 | 记录报价及计费周期 | 确认实际可收金额 |\n| 工作范围 | 列出区域与任务 | 记录增加或取消的项目 |\n| 人工 | 预计工时及综合成本 | 记录实际工时与同口径成本 |\n| 耗材 | 预计使用量 | 记录实际消耗 |\n| 交通 | 预计次数、距离及停车费 | 记录实际往返与费用 |\n| 设备 | 选定直接计费或分摊方法 | 前后一致地应用 |\n| 间接费用 | 写明分摊假设 | 使用一致口径核对 |\n| 返工 | 考虑风险及预留余地 | 单独记录实际返工 |\n| 变更 | 明确额外工作的批准人 | 保存确认记录及调整后的约定 |\n| 项目结果 | 收入减去预计纳入成本 | 收入减去同口径实际成本 |\n\n对于持续性合同，最好在前几次服务之后就进行检查，而不是等到年底才发现问题。比较时要采用相同的时间周期和成本分类。\n\n如果实际工时持续超过报价假设，还要进一步判断：这是短期异常、操作效率问题，还是工作范围已经长期改变。\n\n## 九、什么时候应该调整经营方式？\n\n**优化流程。** 如果工作范围没有变化，却因为路线安排、准备工作或排班不合理而浪费时间，就先改进流程。但不能为了节省成本牺牲安全或承诺的服务质量。\n\n**重新讨论工作范围。** 如果客户经常要求合同之外的任务，应把额外工作记录清楚，并提出双方都明白的调整方案，而不是让未经报价的工作悄悄变成默认义务。\n\n**重新审视报价。** 如果连续多次的真实成本都超过原先假设，就需要分析原因、解释情况，并在尊重现有合同的前提下讨论未来价格。\n\n**必要时放弃不合适的订单。** 如果合理成本已无法由报价覆盖，双方也无法调整范围，那么不接这份工作，可能比继续增加营业额更理性。\n\n真正重要的问题，不只是“这份合同拿到了没有”，而是：**“我们是否真正了解，兑现承诺需要付出多少成本？”**\n\n## 十、保护小企业的一项简单习惯\n\n最有用的项目成本管理，不一定需要复杂软件。先建立一个简单循环：\n\n**预计 → 记录 → 比较 → 查找原因 → 调整。**\n\n预计给出起点；实际记录告诉我们哪些假设错了；认真比较，才能把一次不愉快的经营结果变成下一次报价的经验。\n\n日程排满，说明市场有需求；客户签字，说明双方达成约定。但这两件事，都不能单独证明一份订单真正有利润。要判断结果，必须看实际做了什么、付出了多少成本，以及采用了怎样的计算口径。\n\n**编辑说明：** 本文企业、金额和情景均为虚构教学案例。计算不包括未明确列出的税费及其他项目。会计分类、工资义务、合同权利和税务处理会因具体情况而不同；涉及实际经营决策时，应咨询合格专业人士。","fr":"# Pourquoi un devis rentable peut devenir une prestation déficitaire\n\nLe responsable d'une petite entreprise de nettoyage remporte un contrat. Le client accepte le prix, les interventions sont planifiées et le travail est réalisé. Pourtant, à la fin du mois, le bénéfice espéré semble s'être évaporé.\n\nLe problème ne vient pas nécessairement du tarif lui-même. Il peut venir de l'écart entre **le travail prévu dans le devis** et **le travail réellement effectué**.\n\nUn devis est une prévision. Le suivi des coûts par contrat permet de confronter cette prévision à la réalité.\n\n## 1. Qu'avait-on réellement inclus dans le devis ?\n\nImaginons une petite entreprise de nettoyage fictive au Canada. Elle accepte d'entretenir un bureau chaque semaine pour un prix fixe de **1 200 $ CA par mois**. Elle prévoit 24 heures de travail par mois.\n\nPour cet exemple uniquement, nous supposons un **coût horaire complet de main-d'œuvre de 25 $ CA**. Ce chiffre inventé ne décrit ni les salaires locaux ni les obligations légales de l'employeur.\n\n| Coûts mensuels prévus | $ CA |\n|---|---:|\n| Main-d'œuvre : 24 h × 25 $ | 600 |\n| Produits et consommables | 60 |\n| Déplacements et stationnement | 40 |\n| Quote-part de frais généraux | 100 |\n| **Total des coûts prévus** | **800** |\n| **Revenu mensuel prévu** | **1 200** |\n| **Solde prévu après les coûts indiqués** | **400** |\n\nLe contrat paraît intéressant. Mais les 400 $ représentent un **résultat simplifié par contrat, après la quote-part de frais généraux retenue** : ce n'est pas nécessairement le bénéfice net comptable de l'entreprise. Le résultat dépend des charges incluses et de la méthode de répartition.\n\nCe calcul suppose surtout que le temps, les fournitures, les déplacements et l'étendue des tâches resteront proches des prévisions.\n\n## 2. Que se passe-t-il une fois le contrat commencé ?\n\nLe client souhaite davantage d'attention dans les espaces communs. Les interventions prennent plus de temps, les consommables coûtent davantage et les déplacements sont légèrement plus chers. Le prix mensuel, lui, ne change pas.\n\n| Coûts mensuels réels | $ CA |\n|---|---:|\n| Main-d'œuvre : 34 h × 25 $ | 850 |\n| Produits et consommables | 90 |\n| Déplacements et stationnement | 60 |\n| Quote-part de frais généraux | 100 |\n| **Total des coûts réels** | **1 100** |\n| **Revenu mensuel inchangé** | **1 200** |\n| **Solde réel après les coûts indiqués** | **100** |\n\n**Ce premier scénario n'est pas déficitaire.** Il reste 100 $ après les coûts affichés. Toutefois, le solde attendu de 400 $ est passé à 100 $ : **300 $ de résultat prévu ont disparu**.\n\nL'explication est précise : dix heures de travail supplémentaires coûtent 250 $, les consommables augmentent de 30 $ et les déplacements de 20 $. Total : 300 $. Dans cet exemple, la quote-part de frais généraux reste constante.\n\nUn calendrier rempli ne prouve donc pas que chaque contrat respecte la rentabilité envisagée.\n\n## 3. Scénario distinct : une véritable perte\n\nAjoutons maintenant **un événement hypothétique séparé** : une erreur nécessite une reprise des travaux coûtant **150 $ supplémentaires**, sans possibilité de facturation au client.\n\nLe coût total devient **1 100 $ + 150 $ = 1 250 $**. Avec 1 200 $ de revenus, le solde après les coûts indiqués est de **−50 $**.\n\n**C'est ce second scénario qui présente une perte.** Il ne faut pas appeler « perte » le premier scénario, où il restait 100 $. Les −50 $ correspondent ici à un résultat fictif par contrat après les charges réparties, et non au bénéfice net fiscal ou comptable d'une entreprise réelle.\n\nL'objectif n'est pas de prédire une erreur, mais de montrer qu'une marge de sécurité réduite peut être absorbée par un seul imprévu.\n\n## 4. Cinq coûts qui grignotent le résultat\n\n**Le temps de travail non suivi.** Une intervention prévue pour deux heures en prend presque trois. L'accès au bâtiment, la préparation du matériel et les formalités représentent aussi du temps. Il faut noter les heures réellement attribuables au contrat.\n\n**L'élargissement progressif des tâches.** Des pièces supplémentaires, une fréquence accrue ou un niveau de finition différent peuvent transformer le service. Un geste commercial ponctuel est une décision; une extension permanente non chiffrée en est une autre.\n\n**Les fournitures et les équipements.** Produits, consommables, pièces, usure et élimination des déchets peuvent dépasser les prévisions. Attention à ne pas comptabiliser deux fois le même équipement, directement puis dans les frais généraux.\n\n**Les déplacements et l'accès aux lieux.** Distance, stationnement, attente et visites additionnelles peuvent rendre une petite intervention coûteuse. Le temps passé à nettoyer n'est pas toujours le seul temps nécessaire.\n\n**Les reprises.** Revenir pour corriger une erreur consomme du temps et des fournitures. Enregistrer ces reprises séparément permet de comprendre les écarts.\n\nUne hausse des coûts ne donne pas automatiquement le droit d'augmenter le prix. Les possibilités de modification dépendent du contrat, de l'étendue des tâches et des accords obtenus.\n\n## 5. Marge et majoration : deux pourcentages différents\n\nDans le devis initial, le revenu est de 1 200 $, les coûts prévus sont de 800 $ et le solde prévu est de 400 $.\n\n**Taux de résultat par rapport au revenu** = 400 ÷ 1 200 × 100 ≈ **33,3 %**.\n\n**Taux de majoration par rapport au coût** = 400 ÷ 800 × 100 = **50 %**.\n\nLe premier pourcentage prend le prix de vente comme dénominateur; le second prend le coût. Ils ne sont pas interchangeables. Puisque notre calcul inclut une quote-part hypothétique de frais généraux, le taux de 33,3 % est **un indicateur simplifié de résultat par contrat**, pas une définition universelle de la marge brute comptable.\n\nDans le premier scénario réel, 100 ÷ 1 200 ≈ **8,3 %**. Après la reprise supplémentaire du scénario distinct, −50 ÷ 1 200 ≈ **−4,2 %**.\n\nToujours préciser ce qui figure au numérateur et au dénominateur.\n\n## 6. Répartir les frais généraux sans les compter deux fois\n\nLes coûts directs peuvent généralement être rattachés à une intervention : heures de travail, consommables, stationnement ou sous-traitance. Les frais généraux peuvent comprendre l'administration, la comptabilité, les logiciels ou les locaux.\n\nUne entreprise peut attribuer une partie de ces frais aux contrats selon une méthode documentée et constante. Les **100 $ de frais généraux de notre exemple sont une hypothèse**, pas un taux conseillé. Une autre méthode pourrait donner un autre résultat.\n\nUne charge répartie n'est pas nécessairement une nouvelle sortie de trésorerie ce mois-là. Il faut aussi éviter de facturer deux fois les mêmes dépenses de véhicule, de matériel ou de gestion.\n\nLe suivi de la rentabilité par contrat ne remplace pas le suivi de trésorerie. Même un contrat présentant un solde positif peut provoquer une tension de trésorerie si le client paie tard. RK-0007 examine précisément ce problème distinct.\n\n## 7. Définir les prestations avant de commencer\n\nUne description écrite, même courte, devrait préciser le lieu, la fréquence, les zones incluses, les tâches, les exigences particulières, les modalités d'accès, la fourniture des consommables et le prix convenu.\n\nPour les services récurrents, distinguer les **tâches régulières** des **prestations périodiques ou supplémentaires**. L'entretien hebdomadaire de bureaux n'inclut pas nécessairement le nettoyage en profondeur des tapis, les vitres ou le nettoyage après travaux.\n\nLorsqu'une demande change, noter ce qui a changé, les heures ou coûts supplémentaires envisagés et les accords sur le prix ou le périmètre. Il s'agit d'éviter les surprises, pas de créer un conflit.\n\nLe contrat réel et les règles applicables prévalent. Cet article n'est pas un avis juridique et ne donne aucun droit de modifier unilatéralement un contrat.\n\n## 8. Une fiche de contrôle « devis contre réalité »\n\n| Point à vérifier | Avant l'acceptation | Après l'intervention |\n|---|---|---|\n| Prix | Noter le prix et la période facturée | Vérifier le montant facturable |\n| Prestations | Décrire zones et tâches incluses | Noter ajouts et retraits |\n| Main-d'œuvre | Prévoir heures et coût complet | Relever heures et coût comparable |\n| Fournitures | Estimer la consommation | Noter la consommation réelle |\n| Déplacements | Prévoir visites et stationnement | Noter trajets et dépenses |\n| Équipement | Choisir coût direct ou répartition | Appliquer la même méthode |\n| Frais généraux | Documenter la clé de répartition | Vérifier la cohérence |\n| Reprises | Prévoir un risque éventuel | Isoler les coûts de correction |\n| Modifications | Identifier qui peut les approuver | Conserver les accords |\n| Résultat | Revenu moins coûts prévus inclus | Revenu moins coûts réels comparables |\n\nUn cahier, un tableur ou un outil simple suffit pour commencer. Pour un contrat récurrent, examiner les premiers passages plutôt que d'attendre la fin de l'année. Comparer des périodes et catégories de coûts équivalentes.\n\n## 9. Quand faut-il changer de méthode ?\n\n**Améliorer l'organisation** si les pertes de temps proviennent des trajets, de la préparation ou du planning, sans sacrifier la sécurité ni la qualité promise.\n\n**Rediscuter les prestations** si des demandes hors contrat deviennent habituelles; les documenter et proposer un arrangement explicite.\n\n**Revoir le prix** si les coûts constatés dépassent durablement les hypothèses, tout en respectant les engagements contractuels.\n\n**Refuser un contrat inadapté** si le prix possible ne couvre pas raisonnablement le travail et si le périmètre ne peut être ajusté.\n\nLa vraie question n'est pas seulement : « Avons-nous gagné le contrat ? » mais **« Savons-nous ce qu'il en coûte réellement de tenir notre promesse ? »**\n\n## 10. Une habitude simple qui protège l'entreprise\n\n**Prévoir → enregistrer → comparer → comprendre → ajuster.**\n\nLe devis fixe une hypothèse. Les données réelles révèlent ses faiblesses. Leur comparaison aide à améliorer les décisions futures.\n\nUn agenda chargé montre qu'il existe une demande. Un devis accepté montre qu'un accord a été conclu. Aucun des deux ne prouve, à lui seul, la rentabilité d'un contrat.\n\n**Note éditoriale :** Tous les montants, entreprises et événements sont fictifs et pédagogiques. Les calculs excluent les taxes et autres éléments non mentionnés. Les obligations salariales, règles contractuelles, traitements fiscaux et classifications comptables dépendent des circonstances; consulter des professionnels qualifiés pour une décision particulière.","es":"# Por qué un presupuesto rentable puede terminar en un trabajo con pérdidas\n\nUna pequeña empresa de limpieza consigue un contrato. El cliente acepta el precio, se organizan las visitas y el trabajo se realiza. Sin embargo, al cerrar el mes, la persona responsable suma las horas, los suministros y los desplazamientos y descubre que casi ha desaparecido el resultado esperado.\n\nTal vez el problema no sea únicamente el precio. Puede estar en la diferencia entre **el trabajo que se presupuestó** y **el trabajo que realmente se hizo**.\n\nUn presupuesto es una previsión. El cálculo de costos por trabajo permite contrastarla con la realidad.\n\n## 1. ¿Qué se incluyó realmente en el presupuesto?\n\nImaginemos una empresa ficticia de limpieza en Canadá. Acuerda limpiar una oficina cada semana por **1.200 dólares canadienses al mes** y estima 24 horas de trabajo mensuales.\n\nSolo para este ejemplo se utiliza un **costo laboral integral supuesto de 25 dólares canadienses por hora**. Es una cifra inventada para el cálculo; no representa salarios reales ni obligaciones legales de ningún empleador.\n\n| Costos mensuales previstos | CAD |\n|---|---:|\n| Mano de obra: 24 horas × $25 | 600 |\n| Productos y consumibles | 60 |\n| Transporte y estacionamiento | 40 |\n| Gastos generales asignados | 100 |\n| **Costo total previsto** | **800** |\n| **Ingreso mensual contratado** | **1.200** |\n| **Resultado previsto después de los costos indicados** | **400** |\n\nParece un buen contrato. Pero los 400 dólares son un **resultado simplificado por trabajo después de los gastos generales asignados**; no equivalen necesariamente a la utilidad neta contable de toda la empresa. Dependen de qué costos se incluyan y cómo se distribuyan los gastos generales.\n\nLa previsión funciona solo si el tiempo, los materiales, los desplazamientos y el alcance se mantienen cerca de lo estimado.\n\n## 2. ¿Qué ocurrió cuando comenzó el servicio?\n\nEl cliente pide más atención en las zonas comunes. El personal tarda más, se consumen más productos y aumenta ligeramente el costo de los desplazamientos. El precio mensual permanece igual.\n\n| Costos mensuales reales | CAD |\n|---|---:|\n| Mano de obra: 34 horas × $25 | 850 |\n| Productos y consumibles | 90 |\n| Transporte y estacionamiento | 60 |\n| Gastos generales asignados | 100 |\n| **Costo total real** | **1.100** |\n| **Ingreso mensual sin cambios** | **1.200** |\n| **Resultado real después de los costos indicados** | **100** |\n\n**Este escenario básico todavía no representa una pérdida.** Quedan 100 dólares después de los costos indicados. Pero el resultado previsto bajó de 400 a 100 dólares: **desaparecieron 300 dólares de lo esperado**.\n\nLa diferencia se explica con precisión: diez horas adicionales cuestan 250 dólares; los suministros suben 30 y el transporte 20. En total, 300 dólares. Los gastos generales asignados no cambian en este ejemplo.\n\nTener la agenda llena no demuestra que cada contrato alcance el resultado previsto.\n\n## 3. Un escenario distinto: aparece una pérdida real\n\nAhora añadamos **otro supuesto independiente**: un error obliga a repetir parte del trabajo, con **150 dólares adicionales** que no pueden cobrarse al cliente.\n\nEl costo total pasa a **1.100 + 150 = 1.250 dólares**. Con ingresos de 1.200 dólares, el resultado después de los costos indicados es **−50 dólares**.\n\n**Este segundo escenario sí muestra una pérdida.** No debe confundirse con el escenario básico, que conservaba 100 dólares positivos. Los −50 dólares representan un resultado ficticio por trabajo después de costos asignados, no la utilidad neta fiscal o contable de una empresa real.\n\nEl ejemplo no pretende afirmar que habrá errores, sino mostrar cuánto pesa un imprevisto cuando el margen de seguridad ya se ha reducido.\n\n## 4. Cinco costos que erosionan el resultado\n\n**Horas no registradas.** Una tarea que debía durar dos horas tarda casi tres. Abrir el edificio, preparar materiales y completar registros también requiere tiempo. Conviene anotar las horas realmente atribuibles al contrato.\n\n**Ampliación gradual del alcance.** Se agregan habitaciones, visitas o exigencias de limpieza. Un favor ocasional puede ser deliberado; convertirlo en una obligación permanente sin revisarlo es otra cosa.\n\n**Productos y equipos.** Químicos, consumibles, repuestos, desgaste y eliminación de residuos pueden superar lo previsto. No se debe contabilizar un mismo equipo como costo directo y nuevamente dentro de los gastos generales.\n\n**Transporte y acceso.** Distancias, estacionamiento, esperas y viajes adicionales elevan el costo de servicios aparentemente pequeños. No basta con contar los minutos de limpieza dentro del inmueble.\n\n**Repetición de tareas.** Volver para corregir errores consume horas y materiales. Registrar esas correcciones por separado ayuda a identificar las causas.\n\nQue aumenten los costos no significa que se pueda subir unilateralmente el precio. Todo depende del acuerdo, del alcance documentado y de las autorizaciones correspondientes.\n\n## 5. Margen y recargo no son lo mismo\n\nCon los valores previstos, el ingreso es 1.200 dólares, el costo 800 y el resultado 400.\n\n**Porcentaje del resultado sobre los ingresos** = 400 ÷ 1.200 × 100 ≈ **33,3 %**.\n\n**Porcentaje de recargo sobre el costo** = 400 ÷ 800 × 100 = **50 %**.\n\nEl primero usa el precio de venta como denominador; el segundo, el costo. No son intercambiables. Como el cálculo incluye una asignación supuesta de gastos generales, el 33,3 % es un **indicador simplificado del resultado por trabajo**, no una definición universal del margen bruto contable.\n\nEn el escenario real básico, 100 ÷ 1.200 ≈ **8,3 %**. Tras el trabajo correctivo del escenario independiente, −50 ÷ 1.200 ≈ **−4,2 %**.\n\nAntes de citar un porcentaje, hay que dejar claro qué se divide entre qué.\n\n## 6. Asignar gastos generales sin duplicarlos\n\nLos costos directos suelen relacionarse con un contrato: horas, productos utilizados, estacionamiento o subcontratistas. Los gastos generales pueden incluir administración, contabilidad, software u oficina.\n\nUna empresa puede distribuir parte de esos gastos entre sus trabajos mediante un método documentado y coherente. Los **100 dólares de nuestro ejemplo son una suposición**, no una tarifa recomendada. Otro método podría dar un resultado distinto.\n\nUn gasto asignado no implica necesariamente un nuevo pago en efectivo durante ese mes. Tampoco debe contarse dos veces un vehículo, equipo o gasto administrativo.\n\nLa rentabilidad por trabajo y el flujo de caja son temas distintos. Un contrato con resultado positivo puede provocar falta de efectivo si el cliente paga tarde. RK-0007 explica ese problema de calendario de cobros y pagos.\n\n## 7. Definir el alcance antes de empezar\n\nUna descripción escrita y sencilla debería incluir el lugar, la frecuencia, las zonas, las tareas, las condiciones especiales, el acceso, quién aporta los consumibles y el precio acordado.\n\nEn los servicios recurrentes conviene distinguir entre **tareas habituales** y **trabajos periódicos o adicionales**. La limpieza semanal de una oficina no incluye necesariamente la limpieza profunda de alfombras, los cristales o la limpieza posterior a una reforma.\n\nCuando cambia una solicitud, registrar qué cambió, cuánto tiempo o costo puede agregar y si se aprobó un nuevo alcance o precio. El objetivo es evitar sorpresas, no generar conflictos.\n\nPrevalecen el contrato real y las normas aplicables. Este artículo no constituye asesoramiento legal ni otorga derecho a modificar contratos unilateralmente.\n\n## 8. Lista reutilizable para comparar presupuesto y realidad\n\n| Aspecto | Antes de aceptar | Después del trabajo |\n|---|---|---|\n| Precio | Registrar importe y período | Confirmar importe facturable |\n| Alcance | Detallar áreas y tareas | Anotar cambios |\n| Mano de obra | Estimar horas y costo integral | Registrar horas y costo comparable |\n| Suministros | Estimar consumo | Registrar consumo real |\n| Transporte | Prever visitas y estacionamiento | Registrar viajes y gastos |\n| Equipos | Elegir cargo directo o reparto | Mantener el mismo criterio |\n| Gastos generales | Documentar la asignación | Comprobar consistencia |\n| Repeticiones | Considerar contingencias | Separar costos correctivos |\n| Cambios | Identificar quién los autoriza | Conservar aprobaciones |\n| Resultado | Ingreso menos costos previstos incluidos | Ingreso menos costos reales comparables |\n\nSe puede empezar con papel, una hoja de cálculo o una herramienta sencilla. En contratos recurrentes conviene revisar las primeras visitas, sin esperar al cierre del año. Comparar siempre períodos y categorías equivalentes.\n\nSi las horas reales superan las previstas repetidamente, investigar si la causa es temporal, operativa o un cambio permanente del alcance.\n\n## 9. ¿Cuándo conviene cambiar de rumbo?\n\n**Mejorar los procesos** cuando se pierde tiempo por rutas, preparación u horarios ineficientes, sin comprometer la seguridad ni la calidad prometida.\n\n**Revisar el alcance** cuando el cliente solicita habitualmente tareas fuera del acuerdo. Documentarlas y proponer una solución clara.\n\n**Revisar precios** cuando los costos comparables superan de manera persistente las hipótesis, respetando los compromisos existentes.\n\n**Rechazar un trabajo inadecuado** cuando el precio disponible no permite cubrir razonablemente el servicio y no es posible modificar el alcance.\n\nLa pregunta importante no es solo «¿Conseguimos el contrato?», sino **«¿Entendemos cuánto cuesta cumplir lo prometido?»**\n\n## 10. Un hábito sencillo que protege a una pequeña empresa\n\n**Estimar → registrar → comparar → investigar → ajustar.**\n\nLa estimación ofrece un punto de partida. Los registros reales muestran qué supuestos fallaron. Compararlos permite aprender y presupuestar mejor la próxima vez.\n\nUna agenda ocupada demuestra demanda. Un presupuesto aceptado demuestra que hubo un acuerdo. Ninguno demuestra por sí solo la rentabilidad del trabajo.\n\n**Nota editorial:** Todas las empresas, cantidades y situaciones son ficticias y educativas. Los cálculos excluyen impuestos y cualquier concepto no indicado. Las clasificaciones contables, obligaciones laborales, derechos contractuales y reglas fiscales dependen de cada caso; para decisiones específicas, consultar profesionales cualificados."};const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>").replace(/`([^`]+)`/g,"<code>$1</code>")}function render(md){const lines=md.split(/\r?\n/);let out=[],para=[],table=[];function flush(){if(para.length){out.push("<p>"+inline(para.join(" "))+"</p>");para=[]}if(table.length){const rows=table.filter(x=>!/^\|[\s:\-|]+\|$/.test(x));out.push('<div class="table-wrap" tabindex="0" role="region" aria-label="Scrollable data table"><table>'+rows.map((r,i)=>"<tr>"+r.split("|").slice(1,- g="+l;const a=sourceLabels[l];document.getElementById("references").innerHTML="<h2>"+a[0]+"</h2><p>"+a[4]+"</p><ul>"+sources.map((url,i)=>"<li><a rel=\"noopener noreferrer\" href=\""+url+"\">"+a[i+1]+"</a></li>").join("")+"</ul>";if(location.protocol==="https:"||location.protocol==="http:"){const u=new URL(location.href);u.searchParams.set("lang",l);history.replaceState(null,"",u)}}select.addEventListener("change",update);const initial=new URLSearchParams(location.search).get("lang");select.value=D[initial]?initial:"en";update();</script><script src="../../runlu-language.js?v=2.2"></script></body></html>
