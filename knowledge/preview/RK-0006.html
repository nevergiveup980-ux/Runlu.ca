const copy={"en":{"title":"Why on-hand stock cannot always be promised to a new order","notice":"Research draft for independent technical, rights and language review. Hypothetical examples only.","footer":"HOLD: Not reviewed, approved or published.","body":"<p>A sales screen shows carpet in stock. A customer needs it today. Why might the warehouse still say, “We cannot promise that material yet”?</p>\n<p>The key is that <strong>physical presence is not the same as permission or ability to allocate</strong>. Some material may already be committed to earlier orders. Some may be reserved, quarantined, damaged or otherwise restricted by a particular inventory system. A future expected delivery may support a dated promise but does not mean the goods are physically present today.</p>\n<h2>Three questions, not one number</h2>\n<p><strong>On hand:</strong> What quantity does the inventory system record as physically present? <strong>Available:</strong> What portion can be allocated now, after applying that system’s reservation and status rules? <strong>Available to promise (ATP):</strong> What can reasonably be promised for a particular date when relevant demand and expected receipts are considered? ERP products use different fields and calculations; do not assume these terms are interchangeable.</p>\n<h2>Example A: stock already committed</h2>\n<p>Imagine 100 linear feet of a carpet product on hand. Earlier orders have commitments for 65 linear feet. Under the simple rule “available = on hand − committed,” only 35 linear feet remain. A new order asking for 50 linear feet cannot be confirmed from that quantity alone. The figures are illustrative, not a statement about a real order.</p>\n<h2>Example B: restricted stock</h2>\n<p>Imagine 80 linear feet physically present. Under the hypothetical system rules, 30 linear feet are blocked from commitment by a material-status hold. Another 20 linear feet of eligible stock are already committed. That leaves 30 linear feet for consideration, <strong>assuming these categories do not overlap</strong>. The warehouse must not release a hold simply to satisfy a sale; the responsible authority must review it.</p>\n<h2>A second check: can the available material actually be used?</h2>\n<p>Even when a system shows enough available footage, a project may require a continuous cut, a matching dye lot, an acceptable roll condition and a compatible installation plan. RK-0005 covers the separate question of cut geometry. This article addresses <strong>allocation and promise</strong>, not permission to cut or install.</p>\n<h2>Before confirming a new order</h2>\n<p>Confirm the product and units; inspect reservations and restrictions; identify the actual roll or remnant and dye lot; verify continuous usable dimensions; distinguish expected arrival from goods already received; and record the decision with the responsible sales/inventory authority. If the data conflict, pause the promise and resolve the discrepancy rather than overriding existing commitments.</p>\n<p><strong>Editorial caution:</strong> This is a practical decision framework, not a universal ERP formula or installation standard. Manufacturer instructions, contract terms and company procedures take precedence.</p>"},"zh":{"title":"为什么账面有库存，却不能承诺给新订单？","notice":"研究草稿，等待独立专业、版权和语言审核。案例均为假设。","footer":"HOLD：尚未完成审核、批准或正式发布。","body":"<p>销售系统显示仓库里还有地毯，客户也正等着下单。可库房核对后，却说：“这批材料现在还不能承诺给新订单。”问题出在哪里？</p>\n<p>关键在于：<strong>材料放在仓库里，不等于可以立即分配。</strong> 一部分库存可能已经留给先前的订单；另一部分可能处于预留、质量待检、损坏或其他限制状态。预计未来到货的材料，也不能当作今天已经入库的现货。</p>\n<h2>先分清三个概念</h2>\n<p><strong>账面现存数量（On-hand）</strong>：系统记录的现有实物数量。<strong>当前可用数量（Available）</strong>：按照本系统的预留、承诺和库存状态规则，现在可以分配的部分。<strong>可承诺数量（ATP）</strong>：考虑指定日期的需求和预计入库后，可能对客户作出的交付承诺。不同软件的字段和计算方法不完全相同，不能只凭名称相似就混为一谈。</p>\n<h2>情景一：材料已被其他订单占用</h2>\n<p>假设仓库有某款地毯 100 线性英尺（LF），其中 65 LF 已经承诺给之前的订单。如果系统采用“可用量＝现存量－已承诺量”的简单规则，那么只剩 35 LF。此时新订单要求 50 LF，就不能仅凭“仓库有 100 LF”直接答应客户。这些数字仅用于说明，不对应真实客户订单。</p>\n<h2>情景二：部分材料受到限制</h2>\n<p>再假设仓库实物共有 80 LF，其中 30 LF 按假设的库存状态规则暂时禁止分配；另外 20 LF 合格库存已承诺给其他订单。在这些数量互不重叠的前提下，可供进一步核对的数量为 30 LF。为了完成销售而擅自解除库存限制，是不合适的；必须由有权限的人员核实并批准。</p>\n<h2>数量可用，还要检查能不能真正使用</h2>\n<p>即使系统显示数量足够，也不代表一定能裁出项目要求的连续整块地毯。卷材长度、实际可用幅宽、色批（Dyelot）、材料状态、接缝方案和施工要求都可能改变结论。RK-0005 重点讨论连续裁切问题；本文讨论的是<strong>库存分配和交付承诺</strong>，二者应分别核对。</p>\n<h2>销售与库房如何确认？</h2>\n<p>先核对产品型号和计量单位，再核查已预留、已承诺和受限制的数量；确认实际卷号、余料及色批；检查可用尺寸；将预计到货与已入库材料区分开；最后由负责的销售或库存管理人员确认并留下记录。遇到数字不一致时，应暂停承诺、查清原因，而不是直接覆盖既有预留。</p>\n<p><strong>编辑提示：</strong> 本文是实际工作中的判断框架，不是所有库存软件通用的计算公式，也不是裁切或安装许可。具体操作应以企业授权流程、产品要求和合同条件为准。</p>"},"fr":{"title":"Pourquoi le stock en main n’est pas toujours disponible à la commande","notice":"Brouillon à vérifier sur les plans technique, juridique et linguistique. Exemples fictifs.","footer":"HOLD : ni vérifié, ni approuvé, ni publié.","body":"<p>Le système indique qu’un rouleau de moquette est en stock. Pourtant, l’entrepôt ne peut pas nécessairement le promettre à un nouveau client. <strong>La présence physique ne signifie pas que la marchandise est libre d’affectation.</strong> Une partie peut être réservée, engagée pour une commande antérieure ou soumise à une restriction de qualité ou de statut.</p>\n<h2>Trois notions à distinguer</h2>\n<p><strong>Stock physique (on-hand) :</strong> quantité enregistrée comme présente. <strong>Stock disponible :</strong> quantité qui peut être affectée immédiatement selon les règles de réservation et de statut du système. <strong>Disponible à promettre (ATP) :</strong> quantité pouvant être promise pour une date donnée, en tenant compte, selon la configuration, des besoins et réceptions attendues. Les définitions opérationnelles varient d’un logiciel à l’autre. Une réception prévue ne constitue pas du stock physiquement reçu aujourd’hui.</p>\n<h2>Exemple A — stock déjà engagé</h2>\n<p>Supposons 100 pieds linéaires de moquette en stock, dont 65 déjà engagés pour des commandes précédentes. Avec la règle simplifiée « disponible = stock physique − quantité engagée », il reste 35 pieds linéaires. Une nouvelle demande de 50 pieds linéaires ne peut donc pas être confirmée sur cette seule base. Cet exemple est fictif.</p>\n<h2>Exemple B — stock bloqué</h2>\n<p>Supposons 80 pieds linéaires physiquement présents. Dans cet exemple fictif, 30 sont exclus de l’affectation par un statut de blocage, et 20 autres pieds linéaires admissibles sont déjà engagés. Si ces groupes ne se chevauchent pas, 30 pieds linéaires restent à examiner. Un blocage ne doit pas être levé sans autorisation.</p>\n<h2>Quantité disponible ne signifie pas découpe réalisable</h2>\n<p>Il faut également vérifier le segment continu utilisable, le lot de teinture, l’état du rouleau et les exigences du projet. RK-0005 traite séparément des dimensions de découpe. Le présent article concerne l’affectation du stock et les promesses de livraison, non une autorisation de coupe.</p>\n<h2>Vérification avant de confirmer</h2>\n<p>Contrôler la référence et l’unité de mesure, les réservations, les restrictions, le rouleau et son lot, les dimensions utilisables, ainsi que la différence entre réception attendue et réception effective. Faire valider la décision par la personne responsable et conserver une trace. En cas d’écart, suspendre la promesse jusqu’à clarification.</p>\n<p><strong>Note éditoriale :</strong> cadre de décision pratique, non formule universelle de gestion des stocks ni norme de pose. Traduction et terminologie à réviser.</p>"},"es":{"title":"Por qué las existencias físicas no siempre están disponibles para un nuevo pedido","notice":"Borrador pendiente de revisión técnica, de derechos y lingüística. Ejemplos hipotéticos.","footer":"HOLD: no revisado, aprobado ni publicado.","body":"<p>El sistema muestra alfombra en el almacén, pero eso no significa que pueda prometerse de inmediato a otro cliente. <strong>La presencia física no equivale a disponibilidad para asignación.</strong> Una parte puede estar reservada, comprometida con pedidos anteriores o bloqueada por su estado o calidad.</p>\n<h2>Tres conceptos diferentes</h2>\n<p><strong>Existencias físicas (on-hand):</strong> cantidad registrada como presente. <strong>Cantidad disponible:</strong> parte que puede asignarse ahora según las reglas de reservas y estados del sistema. <strong>Disponible para prometer (ATP):</strong> cantidad que podría prometerse para una fecha determinada teniendo en cuenta, según la configuración, la demanda y las entradas previstas. Los sistemas no utilizan necesariamente las mismas fórmulas. Una recepción prevista no equivale a existencias físicamente recibidas hoy.</p>\n<h2>Ejemplo A: material comprometido</h2>\n<p>Supongamos 100 pies lineales de alfombra en existencias y 65 pies lineales ya comprometidos con pedidos anteriores. Con la regla simplificada «disponible = existencias − comprometido», quedan 35 pies lineales. No sería correcto confirmar un nuevo pedido de 50 pies lineales solo porque el total físico sea 100. Es un ejemplo hipotético.</p>\n<h2>Ejemplo B: material restringido</h2>\n<p>Supongamos 80 pies lineales físicamente presentes. En este ejemplo, 30 pies lineales están bloqueados para asignación por su estado y otros 20 pies lineales aptos ya están comprometidos. Si las categorías no se superponen, quedan 30 pies lineales por evaluar. No debe levantarse una restricción sin la autorización correspondiente.</p>\n<h2>Disponible no siempre significa utilizable</h2>\n<p>También hay que comprobar la longitud continua aprovechable, el lote de teñido (Dyelot), el estado del material y las condiciones de instalación. RK-0005 trata por separado la geometría de corte. Aquí hablamos de <strong>asignación de inventario y compromisos de entrega</strong>, no de autorización para cortar.</p>\n<h2>Antes de prometer un pedido</h2>\n<p>Verificar el producto y la unidad, revisar reservas y restricciones, identificar el rollo y el lote, comprobar las dimensiones útiles, distinguir una recepción prevista de una ya realizada y registrar la decisión con el responsable de ventas o inventario. Si hay discrepancias, detener la promesa hasta aclararlas.</p>\n<p><strong>Nota editorial:</strong> marco práctico, no fórmula universal de ERP ni norma de instalación. Pendiente de revisión técnica y lingüística.</p>"}};
