};const checkpoints={"en":{"heading":"Six checks before confirming an order","items":["Order geometry: required piece sizes, orientation and approved seams.","Physical stock: verify roll IDs, usable width and continuous length.","Availability: account for reservations, holds, damage and discrepancies.","Compatibility: check product, dye lot, pile direction, pattern and applicable instructions.","Allocation: assign each required cut to verified stock; flag substitutions or seams for approval.","Decision: ready only if every condition passes; otherwise record review needed or not fulfillable."],"decision":"A total-area match is not a verified cut plan."},"zh":{"heading":"确认订单前的六项核对","items":["订单尺寸：核实每块材料宽长、方向及获批接缝方案。","实物库存：核对卷号、有效宽度和连续长度。","可分配状态：排除预留、暂停、损坏及账实差异。","材料兼容：核实型号、染色批次、绒毛方向、花纹及适用说明。","实际分配：每块裁切对应具体卷材；替代或接缝先获批准。","出库决定：全部满足才确认，否则记录待复核或无法履约及原因。"],"decision":"面积合计匹配，不等于裁切方案可行。"},"fr":{"heading":"Six contrôles avant de confirmer","items":["Dimensions : vérifier chaque coupe, l'orientation et les joints approuvés.","Stock physique : vérifier les identifiants, la largeur utile et la longueur continue.","Disponibilité : tenir compte des réservations, blocages, dommages et écarts.","Compatibilité : vérifier le produit, le lot de teinture, le velours, les motifs et les consignes.","Affectation : associer chaque coupe à un rouleau vérifié; faire approuver joints et substitutions.","Décision : confirmer uniquement si toutes les conditions sont remplies; sinon consigner le blocage."],"decision":"Une surface cumulée suffisante ne constitue pas un plan de coupe validé."},"es":{"heading":"Seis comprobaciones antes de confirmar","items":["Dimensiones: verificar cada corte, orientación y uniones aprobadas.","Stock físico: comprobar identificadores, ancho útil y longitud continua.","Disponibilidad: descontar reservas, bloqueos, daños y discrepancias.","Compatibilidad: revisar producto, lote de teñido, dirección del pelo, patrón e instrucciones.","Asignación: vincular cada corte a existencias verificadas; aprobar uniones y sustituciones.","Decisión: confirmar solo cuando se cumplan todas las condiciones; si no, registrar el motivo."],"decision":"Que coincida la superficie total no demuestra que el plan de corte sea viable."}};function render(){const lang=document.getElementById("lang").value;document.documentElement.lang=lang==="zh"?"zh-Hans":lang;for(const [id,val] of Object.entries(copy[lang])){const el=document.getElementById(id);if(el)el.textContent=val}document.getElementById("checkHeading").textContent=checkpoints[lang].heading;document.getElementById("decision").textContent=checkpoints[lang].decision;const list=document.getElementById("checkpoints");list.replaceChildren(...checkpoints[lang].items.map(t=>{const li=document.createElement("li");li.textContent=t;return li}))}document.getElementById("lang").addEventListener("change",render);render();
