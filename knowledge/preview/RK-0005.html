en:{status:"EDITORIAL DRAFT — NOT REVIEWED OR PUBLISHED",title:"Why enough carpet inventory may still fail an order",summary:"Total stock area does not establish whether a verified continuous roll segment satisfies cut dimensions, reservations, condition and project constraints.",exampleHeading:"A practical example",example:"Two remnants each measure 12 ft × 12.5 ft. Together they total 300 ft², but neither alone can supply one continuous 12 ft × 20 ft piece (240 ft²). A seam could change the outcome only if the project permits it and the approved layout works.",caution:"This is an inventory-screening example, not a cutting authorization. Check actual stock, reservations, product instructions and approved installation plans.",reviewHeading:"Review status",review:"Independent trade review, rights verification and four-language proofreading are pending. This preview is not part of the approved public knowledge dataset.",footer:"RUNLU KNOWLEDGE editorial preview · Do not cite as an approved technical standard."},

};const scenarios={"en":{"heading":"Test the decision with four sample orders","note":"Illustrative scenarios only. Dimensions omit cutting allowances, pattern matching and installation waste; technical review remains pending.","items":[["A · Area versus length","Two 12 × 12.5 ft remnants; order requires one continuous 12 × 20 ft piece, no approved seam.","Not fulfillable as specified"],["B · Reserved roll","A 12 × 25 ft roll fits a 12 × 18 ft cut but is fully reserved.","Not allocatable without review"],["C · Verified available roll","A 12 × 25 ft roll fits a 12 × 18 ft cut; verified product, required dye lot, no hold, approved orientation.","Potentially fulfillable; cut authorization still required"],["D · Seam approval","Two remnants could be joined, but the seam layout is not approved.","Review needed before commitment"]]},"zh":{"heading":"四个订单场景，检验判断是否可靠","note":"以下均为假设案例，未计裁切余量、花纹对齐及安装损耗；独立技术审核尚未完成。","items":[["A · 面积与长度","两块 12 × 12.5 英尺余料；订单要求一块连续 12 × 20 英尺材料，未批准接缝。","按原要求无法履约"],["B · 已预留卷材","12 × 25 英尺卷材能满足 12 × 18 英尺尺寸，但已全部预留。","未经复核不可分配"],["C · 已核实可用卷材","12 × 25 英尺卷材满足 12 × 18 英尺订单，型号、批次、预留及方向均符合假设条件。","可能履约，仍须裁切授权"],["D · 接缝审批","两块余料可能拼接，但接缝方案尚未获批。","承诺前必须复核"]]},"fr":{"heading":"Quatre commandes pour tester la décision","note":"Scénarios hypothétiques sans marges de coupe, raccords de motifs ni pertes de pose. Révision technique indépendante en attente.","items":[["A · Surface et longueur","Deux chutes de 12 × 12,5 pi; une pièce continue de 12 × 20 pi exigée, sans joint approuvé.","Non réalisable tel que demandé"],["B · Rouleau réservé","Un rouleau de 12 × 25 pi convient à une coupe de 12 × 18 pi mais est entièrement réservé.","Non attribuable sans vérification"],["C · Rouleau disponible vérifié","Un rouleau de 12 × 25 pi convient à 12 × 18 pi; produit, lot, disponibilité et orientation conformes aux hypothèses.","Potentiellement réalisable; autorisation de coupe requise"],["D · Joint à approuver","Deux chutes pourraient être assemblées, mais le plan de joint n'est pas approuvé.","Vérification préalable requise"]]},"es":{"heading":"Cuatro pedidos para comprobar la decisión","note":"Casos hipotéticos sin márgenes de corte, coincidencia de patrones ni desperdicio de instalación. Revisión técnica independiente pendiente.","items":[["A · Superficie frente a longitud","Dos retales de 12 × 12,5 pies; se exige una pieza continua de 12 × 20 pies sin unión aprobada.","No realizable según lo solicitado"],["B · Rollo reservado","Un rollo de 12 × 25 pies admite un corte de 12 × 18 pies, pero está completamente reservado.","No asignable sin revisión"],["C · Rollo disponible verificado","Un rollo de 12 × 25 pies cumple 12 × 18 pies; producto, lote, disponibilidad y orientación correctos según los supuestos.","Posiblemente realizable; requiere autorización de corte"],["D · Unión pendiente","Dos retales podrían unirse, pero el plano de unión no está aprobado.","Revisión necesaria antes de confirmar"]]}};const checkpoints={"en":{"heading":"Six checks before confirming an order","items":["Order geometry: required piece sizes, orientation and approved seams.","Physical stock: verify roll IDs, usable width and continuous length.","Availability: account for reservations, holds, damage and discrepancies.","Compatibility: check product, dye lot, pile direction, pattern and applicable instructions.","Allocation: assign each required cut to verified stock; flag substitutions or seams for approval.","Decision: ready only if every condition passes; otherwise record review needed or not fulfillable."],"decision":"A total-area match is not a verified cut plan."},"zh":{"heading":"确认订单前的六项核对","items":["订单尺寸：核实每块材料宽长、方向及获批接缝方案。","实物库存：核对卷号、有效宽度和连续长度。","可分配状态：排除预留、暂停、损坏及账实差异。","材料兼容：核实型号、染色批次、绒毛方向、花纹及适用说明。","实际分配：每块裁切对应具体卷材；替代或接缝先获批准。","出库决定：全部满足才确认，否则记录待复核或无法履约及原因。"],"decision":"面积合计匹配，不等于裁切方案可行。"},"fr":{"heading":"Six contrôles avant de confirmer","items":["Dimensions : vérifier chaque coupe, l'orientation et les joints approuvés.","Stock physique : vérifier les identifiants, la largeur utile et la longueur continue.","Disponibilité : tenir compte des réservations, blocages, dommages et écarts.","Compatibilité : vérifier le produit, le lot de teinture, le velours, les motifs et les consignes.","Affectation : associer chaque coupe à un rouleau vérifié; faire approuver joints et substitutions.","Décision : confirmer uniquement si toutes les conditions sont remplies; sinon consigner le blocage."],"decision":"Une surface cumulée suffisante ne constitue pas un plan de coupe validé."},"es":{"heading":"Seis comprobaciones antes de confirmar","items":["Dimensiones: verificar cada corte, orientación y uniones aprobadas.","Stock físico: comprobar identificadores, ancho útil y longitud continua.","Disponibilidad: descontar reservas, bloqueos, daños y discrepancias.","Compatibilidad: revisar producto, lote de teñido, dirección del pelo, patrón e instrucciones.","Asignación: vincular cada corte a existencias verificadas; aprobar uniones y sustituciones.","Decisión: confirmar solo cuando se cumplan todas las condiciones; si no, registrar el motivo."],"decision":"Que coincida la superficie total no demuestra que el plan de corte sea viable."}};function render(){const lang=document.getElementById("lang").value;document.documentElement.lang=lang==="zh"?"zh-Hans":lang;for(const [id,val] of Object.entries(copy[lang])){const el=document.getElementById(id);if(el)el.textContent=val}document.getElementById("checkHeading").textContent=checkpoints[lang].heading;document.getElementById("decision").textContent=checkpoints[lang].decision;document.getElementById("casesHeading").textContent=scenarios[lang].heading;document.getElementById("casesNote").textContent=scenarios[lang].note;const cases=document.getElementById("cases");cases.replaceChildren(...scenarios[lang].items.map(([heading,detail,decision])=>{const article=document.createElement("article");const h=document.createElement("h3");h.textContent=heading;const p=document.create
