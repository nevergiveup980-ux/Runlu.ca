<body><main><header><div class="status">RUNLU KNOWLEDGE · RK-0007 · INTERNAL EDITORIAL PREVIEW · NOT PUBLISHED</div><p id="disclaimer">Draft for editorial review. Not approved for publication. All examples are fictional.</p><label for="lang">Language / 语言 / Langue / Idioma</label> <select id="lang" data-runlu-language-select><option value="en">English</option><option value="zh">中文</option><option value="fr">Français</option><option value="es">Español</option></select><h1 id="title"></h1></header><article id="content"></article><footer><p id="footerText">Internal preview only. No professional review or publication approval has been recorded.</p><p><a href="../">RUNLU KNOWLEDGE</a></p></footer></main>
<script>const COPY={"en":{"title":"Why Your Business Can Be Busy but Still Run Out of Cash","body":"\u003cp>\u003cstrong>RUNLU KNOWLEDGE · RK-0007 · English original · Editorial draft v0.1 · 2026-11-18\u003c/strong>\u003c/p>\n\u003cp>\u003cem>This article is for general education. Every business example and amount below is fictional. It is not accounting, tax, lending, or legal advice.\u003c/em>\u003c/p>\n\u003ch2>The calendar is full. The bank account is not.\u003c/h2>\n\u003cp>Imagine a small commercial-cleaning company. Its owner has just added two regular clients. The team is working more hours than ever. Invoices are going out, and the owner has calculated that the work should earn a profit. Yet Friday arrives, payroll is due, and there is not enough cash in the business account.\u003c/p>\n\u003cp>How can a business be busy, and even profitable, but short of money?\u003c/p>\n\u003cp>Because \u003cstrong>work performed, profit earned, and cash received are different events\u003c/strong>. A sale may be recorded before a customer pays. A supplier may need payment before that customer's money arrives. A full schedule does not change the dates on those obligations.\u003c/p>\n\u003ch2>Four numbers that tell four different stories\u003c/h2>\n\u003cp>\u003cstrong>Revenue\u003c/strong> is the value of sales or services recognized for a period under the accounting method used. An invoice is evidence of a claim to payment, not proof that cash has arrived.\u003c/p>\n\u003cp>\u003cstrong>Profit\u003c/strong> is revenue less the costs and expenses recognized for that period. Depending on the accounting method, the timing of recognition can differ from the timing of payments. Profit is not a synonym for the bank balance.\u003c/p>\n\u003cp>\u003cstrong>Cash collected\u003c/strong> is money actually received. An unpaid invoice is normally a receivable, not spendable cash.\u003c/p>\n\u003cp>\u003cstrong>Cash available\u003c/strong> is the money the business can use while still meeting near-term obligations. A bank balance of $8,000 is not necessarily $8,000 of discretionary spending if payroll, supplier invoices, debt payments or required remittances are approaching.\u003c/p>\n\u003cp>These distinctions matter because a business can report positive profit while temporarily experiencing negative cash flow. The Business Development Bank of Canada explains this difference in its cash-flow guidance [1, 2].\u003c/p>\n\u003ch2>A profitable month with a cash gap\u003c/h2>\n\u003cp>Consider a \u003cstrong>hypothetical\u003c/strong> cleaning company with the following simple November activity, in Canadian dollars. To keep the illustration understandable, assume an accrual-style operating profit calculation, no depreciation, no interest, no owner draws, no sales taxes, no income-tax provision, and no other transactions. This is a teaching example, not a complete financial statement.\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Scrollable financial table\">\u003ctable>\u003ctr>\u003cth>November work and operating costs\u003c/th>\u003cth>Amount\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Services performed and invoiced\u003c/td>\u003ctd>$12,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Wages attributable to that work\u003c/td>\u003ctd>($6,000)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Supplies and other operating expenses\u003c/td>\u003ctd>($2,000)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Illustrative operating profit\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>$4,000\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>The owner can reasonably say the month's work generated an illustrative operating profit of $4,000. But the customer is scheduled to pay the $12,000 invoice on \u003cstrong>December 15\u003c/strong>. The $8,000 of wages and expenses must be paid in November. Suppose the business starts November with $5,000 cash and has no other cash receipts.\u003c/p>\n\u003cp>November's cash position becomes \u003cstrong>$5,000 + $0 − $8,000 = −$3,000\u003c/strong>. The business faces a $3,000 funding gap before the customer pays, despite the $4,000 illustrative profit.\u003c/p>\n\u003cp>That negative figure is a \u003cem>projected shortfall\u003c/em>, not a claim that a bank account can freely go below zero. Without an arranged facility or another source of funds, the business would need to change the timing of payments or collections, obtain appropriate financing, reduce spending, or take other lawful steps before bills fall due. A profitable invoice is not itself cash.\u003c/p>\n\u003ch2>The timing trap is often ordinary\u003c/h2>\n\u003cp>The cash gap may have no dramatic cause. A customer pays in 30 or 45 days. Staff are paid every two weeks. Supplies are purchased before the job begins. Rent is due on the first day of the month. A new contract adds revenue, but also requires more labour before the first payment arrives.\u003c/p>\n\u003cp>\u003cstrong>Accounts receivable\u003c/strong> tracks amounts customers owe. \u003cstrong>Accounts payable\u003c/strong> tracks amounts the business owes suppliers. Both matter, but neither is the same as cash on hand. Canada's federal business-planning guidance specifically warns that credit sales belong in a cash forecast when the cash is expected to be collected, not merely when the sale occurs [3].\u003c/p>\n\u003cp>Growth can therefore increase the need for working cash. It is possible to win more work and become \u003cem>less\u003c/em> comfortable in the short term if collections lag behind new expenses.\u003c/p>\n\u003ch2>A cash calendar beats a hopeful guess\u003c/h2>\n\u003cp>Start with a simple rolling forecast, updated at least weekly when cash is tight:\u003c/p>\n\u003cp>\u003cstrong>Projected closing cash = opening cash + cash expected to arrive − cash expected to leave.\u003c/strong>\u003c/p>\n\u003cp>Use dates, not just monthly totals. For the same fictional business, consider a simplified four-week plan beginning with $5,000. This is a separate timing illustration; its figures are not intended to reproduce the November income statement above.\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Scrollable financial table\">\u003ctable>\u003ctr>\u003cth>Week\u003c/th>\u003cth>Opening cash\u003c/th>\u003cth>Expected receipts\u003c/th>\u003cth>Scheduled payments\u003c/th>\u003cth>Projected closing cash\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>$5,000\u003c/td>\u003ctd>$1,000\u003c/td>\u003ctd>$2,000\u003c/td>\u003ctd>$4,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>$4,000\u003c/td>\u003ctd>$0\u003c/td>\u003ctd>$3,500\u003c/td>\u003ctd>$500\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>$500\u003c/td>\u003ctd>$4,000\u003c/td>\u003ctd>$2,500\u003c/td>\u003ctd>$2,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>$2,000\u003c/td>\u003ctd>$3,000\u003c/td>\u003ctd>$2,000\u003c/td>\u003ctd>$3,000\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>The lowest projected balance is only $500 in week 2. That is the warning signal a monthly revenue total might hide. If the week-3 customer payment slips, the owner needs to revisit the forecast immediately. Expected receipts are estimates, not guaranteed money; a cautious version of the plan should test what happens when important invoices arrive late.\u003c/p>\n\u003cp>BDC recommends rolling cash-flow forecasting and discusses a 13-week view as one useful management approach [4]. A one-page calendar is a reasonable starting point for a very small business; the discipline matters more than sophisticated software.\u003c/p>\n\u003ch2>Seven practical habits\u003c/h2>\n\u003col>\u003cli>\u003cstrong>Invoice promptly and accurately.\u003c/strong> A completed job that has not been billed cannot begin the normal payment process.\u003c/li>\u003cli>\u003cstrong>Know the actual payment terms.\u003c/strong> “Net 30” and “the customer usually pays in 30 days” are not identical assurances. Track observed payment behaviour.\u003c/li>\u003cli>\u003cstrong>Review receivables every week.\u003c/strong> Identify overdue invoices, missing approvals and disputed amounts early. Follow up professionally and keep records.\u003c/li>\u003cli>\u003cstrong>Put all predictable outflows on the calendar.\u003c/strong> Include payroll, supplier bills, rent, loan payments, equipment expenses and applicable tax obligations. Confirm the relevant rules with a qualified adviser.\u003c/li>\u003cli>\u003cstrong>Build a buffer when feasible.\u003c/strong> A target reserve should reflect the company's obligations and variability, not a universal number of weeks.\u003c/li>\u003cli>\u003cstrong>Stress-test the plan.\u003c/strong> Ask what happens if the largest customer pays two weeks late or a repair bill arrives unexpectedly.\u003c/li>\u003cli>\u003cstrong>Separate the question of timing from the question of margin.\u003c/strong> Borrowing to cover a temporary collection gap is a different decision from borrowing to sustain work that consistently loses money.\u003c/li>\u003c/ol>\n\u003ch2>Busy does not always mean profitable, either\u003c/h2>\n\u003cp>Cash-flow pressure can hide two different problems. In the first, jobs have healthy margins but customers pay after bills come due. In the second, the business underprices its work or overlooks real costs, so each additional job adds little or no economic benefit.\u003c/p>\n\u003cp>A cash calendar helps identify \u003cem>when\u003c/em> money is needed. A properly prepared profit-and-loss analysis helps determine \u003cem>whether\u003c/em> the work is worth doing. Both questions deserve answers before taking on a large new contract.\u003c/p>\n\u003ch2>A five-minute owner checklist\u003c/h2>\n\u003cp>Before promising another job, ask: What cash will this job require before the first customer payment? When is that payment realistically expected? Which bills fall due in between? What is the lowest projected bank balance? What happens if the payment is late? And does the quoted price still leave an acceptable margin after all relevant costs?\u003c/p>\n\u003cp>The lesson is not that growth is dangerous. It is that \u003cstrong>a busy schedule describes demand, a profit figure describes performance under an accounting method, and a cash forecast describes whether the business can meet its obligations on time\u003c/strong>. A resilient business pays attention to all three.\u003c/p>"},"zh":{"title":"为什么生意很忙，手里却没有钱？","body":"\u003cp>\u003cstrong>RUNLU KNOWLEDGE · RK-0007 · 中文改编初稿 v0.1 · 2026-11-18\u003c/strong>\u003c/p>\n\u003cp>\u003cem>本文用于一般知识普及。文中企业、人物、金额及经营情境均为虚构示例，不构成会计、税务、贷款或法律建议。\u003c/em>\u003c/p>\n\u003ch2>日程排得满满当当，账户却快见底了\u003c/h2>\n\u003cp>想象一家小型商业清洁公司。老板最近又接下两个长期客户，员工每天忙着赶场地，工时比以往更多。服务做完了，发票开出去了，按账面计算，这些合同也确实有利润。\u003c/p>\n\u003cp>可是到了星期五，员工工资该发了，银行账户里的钱却不够。\u003c/p>\n\u003cp>这听起来矛盾：生意明明越来越好，怎么反而缺钱？\u003c/p>\n\u003cp>答案藏在三个不同的时间点里：\u003cstrong>工作完成的时间、利润确认的时间，以及客户真正付款的时间，未必相同。\u003c/strong>\u003c/p>\n\u003cp>客户同意付钱，不代表钱已经到账；公司赚到了利润，也不代表此刻有足够现金支付账单。经营日程上的繁忙，不能改变工资和供应商款项的到期日。\u003c/p>\n\u003ch2>四个数字，讲的是四件不同的事\u003c/h2>\n\u003cp>\u003cstrong>营业收入（Revenue）\u003c/strong>：按照所采用的会计方法，在某个期间确认的销售或服务收入。开出发票通常代表形成收款请求，却不等于已经收到现金。\u003c/p>\n\u003cp>\u003cstrong>利润（Profit）\u003c/strong>：该期间确认的收入扣除相应成本与费用后所得的结果。会计确认时间可能与实际收付款时间不同，所以利润不能直接当作银行余额。\u003c/p>\n\u003cp>\u003cstrong>实际收款（Cash collected）\u003c/strong>：真正进入企业账户的资金。客户尚未支付的发票，一般属于应收账款，而不是可以立即使用的现金。\u003c/p>\n\u003cp>\u003cstrong>可支配现金（Cash available）\u003c/strong>：在考虑近期必须支付的工资、供应商款、贷款及适用的税费等义务后，企业实际能够灵活安排的现金。账户里有8,000加元，并不意味着这8,000加元都可以随意花掉。\u003c/p>\n\u003cp>加拿大商业发展银行（BDC）在现金流管理资料中也明确区分了利润与现金流：企业可以有利润，却在一段时间内出现负现金流。[1][2]\u003c/p>\n\u003ch2>赚了4,000元，为什么还缺3,000元？\u003c/h2>\n\u003cp>下面是一家\u003cstrong>完全虚构\u003c/strong>的清洁公司在11月份的简化经营情况，金额均为加元。为便于理解，假设采用类似权责发生制的经营利润计算，不考虑折旧、利息、老板提款、销售税、所得税准备及其他交易。这只是教学示例，不是完整财务报表。\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Scrollable financial table\">\u003ctable>\u003ctr>\u003cth>11月经营项目\u003c/th>\u003cth>金额\u003c/th>\u003c/tr>\u003ctr>\u003ctd>已完成并开票的服务\u003c/td>\u003ctd>$12,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>对应人工成本\u003c/td>\u003ctd>−$6,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>清洁用品及其他经营费用\u003c/td>\u003ctd>−$2,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>示例经营利润\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>$4,000\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>从经营结果看，这个月确实有4,000加元的示例经营利润。\u003c/p>\n\u003cp>问题在于，客户约定\u003cstrong>12月15日\u003c/strong>才支付12,000加元，而11月的工资和其他费用合计8,000加元却必须先付。假设11月初公司账户只有5,000加元，而且当月没有其他现金收入，那么：\u003c/p>\n\u003cp>\u003cstrong>预计月末现金缺口 = $5,000 + $0 − $8,000 = −$3,000。\u003c/strong>\u003c/p>\n\u003cp>这里的负3,000元表示\u003cstrong>预计资金缺口\u003c/strong>，不是说银行账户可以无条件透支。如果没有获批的信用额度或其他资金来源，老板必须在付款到期前采取合规措施，例如争取客户提前付款、协商付款安排、减少可推迟的支出，或审慎评估融资。\u003c/p>\n\u003cp>一张有利润的发票，并不能替公司发工资。\u003c/p>\n\u003ch2>真正的陷阱，往往只是时间差\u003c/h2>\n\u003cp>客户可能在30天或45天后付款；员工却每两周领一次工资。清洁用品要提前买，房租每月固定到期，新合同带来收入，也可能先带来额外人工成本。\u003c/p>\n\u003cp>\u003cstrong>应收账款（Accounts receivable）\u003c/strong>是客户欠企业的钱；\u003cstrong>应付账款（Accounts payable）\u003c/strong>是企业欠供应商的钱。两者都值得跟踪，但都不能与银行里的现款混为一谈。\u003c/p>\n\u003cp>因此，企业扩大业务时，短期资金需求也可能随之增加。订单越来越多，却因为收款慢于支出而越来越紧张，并不稀奇。\u003c/p>\n\u003ch2>别只盯月营业额，做一张现金日历\u003c/h2>\n\u003cp>现金紧张时，可以每周更新一次滚动预测：\u003c/p>\n\u003cp>\u003cstrong>预计期末现金 = 期初现金 + 预计实际到账金额 − 预计实际付款金额。\u003c/strong>\u003c/p>\n\u003cp>重点不是这个月一共开了多少发票，而是\u003cstrong>钱在哪一天进来，又在哪一天出去\u003c/strong>。\u003c/p>\n\u003cp>下面是同一家虚构企业的另一组四周现金计划，期初现金为5,000加元。此表用于单独演示收付款时间，不与前面11月利润表示例逐项对应。\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Scrollable financial table\">\u003ctable>\u003ctr>\u003cth>周次\u003c/th>\u003cth>期初现金\u003c/th>\u003cth>预计收款\u003c/th>\u003cth>计划付款\u003c/th>\u003cth>预计期末现金\u003c/th>\u003c/tr>\u003ctr>\u003ctd>第1周\u003c/td>\u003ctd>$5,000\u003c/td>\u003ctd>$1,000\u003c/td>\u003ctd>$2,000\u003c/td>\u003ctd>$4,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第2周\u003c/td>\u003ctd>$4,000\u003c/td>\u003ctd>$0\u003c/td>\u003ctd>$3,500\u003c/td>\u003ctd>$500\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第3周\u003c/td>\u003ctd>$500\u003c/td>\u003ctd>$4,000\u003c/td>\u003ctd>$2,500\u003c/td>\u003ctd>$2,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第4周\u003c/td>\u003ctd>$2,000\u003c/td>\u003ctd>$3,000\u003c/td>\u003ctd>$2,000\u003c/td>\u003ctd>$3,000\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>看起来四周结束后还有3,000加元，但\u003cstrong>第2周只剩500加元\u003c/strong>。这才是老板最需要提前看见的危险时刻。\u003c/p>\n\u003cp>如果第3周那笔4,000加元的收款推迟，预测就必须立即重算。预计收款只是预测，不能把它当作已经入账的钱。最好另外做一个保守情景：假设最大客户晚付两周，公司还能否按时履约？\u003c/p>\n\u003cp>BDC也介绍过以13周为周期、每周更新的滚动现金流预测方法。[4] 对很小的企业而言，一张简单表格就能起步，关键在于坚持更新。\u003c/p>\n\u003ch2>七个能立刻用起来的习惯\u003c/h2>\n\u003col>\u003cli>\u003cstrong>工作完成后及时、准确开票。\u003c/strong> 没有开出的发票，通常也就谈不上按正常流程催收。\u003c/li>\u003cli>\u003cstrong>弄清付款条件。\u003c/strong> 合同写着“30天内付款”，不代表客户一定会在第30天付款。实际付款记录同样重要。\u003c/li>\u003cli>\u003cstrong>每周检查应收账款。\u003c/strong> 哪些发票逾期、哪些缺少审批、哪些存在争议，都要尽早处理，并留下沟通记录。\u003c/li>\u003cli>\u003cstrong>把可预见的支出写进日历。\u003c/strong> 工资、材料、房租、设备、贷款和适用的税务义务都要考虑；具体税务规则应向合格专业人士核实。\u003c/li>\u003cli>\u003cstrong>条件允许时建立现金缓冲。\u003c/strong> 需要多少储备，取决于企业成本、客户付款规律及风险，不能机械套用一个统一数字。\u003c/li>\u003cli>\u003cstrong>做一次压力测试。\u003c/strong> 如果最大客户晚付两周，或者突然需要维修设备，企业还能坚持多久？\u003c/li>\u003cli>\u003cstrong>分清暂时缺现金和长期不赚钱。\u003c/strong> 为有利润但收款延迟的业务解决短期周转，与借钱维持持续亏损的业务，是两种完全不同的决策。\u003c/li>\u003c/ol>\n\u003ch2>生意忙，也未必真的赚钱\u003c/h2>\n\u003cp>现金紧张可能来自两个原因。\u003c/p>\n\u003cp>一种是\u003cstrong>利润率尚可，只是客户付款比企业支出晚\u003c/strong>。这种情况下，重点是收付款节奏和周转安排。\u003c/p>\n\u003cp>另一种则是\u003cstrong>报价太低，或漏算了人工、交通、设备损耗、管理时间等成本\u003c/strong>。这样的合同可能越做越忙，却没有产生合理利润。\u003c/p>\n\u003cp>现金日历回答的是：“什么时候需要钱？”\u003c/p>\n\u003cp>利润分析回答的是：“这笔生意究竟值不值得做？”\u003c/p>\n\u003cp>接下大合同之前，两道题都要算清楚。\u003c/p>\n\u003ch2>给小企业主的五分钟检查清单\u003c/h2>\n\u003cp>接下一笔新订单之前，不妨问自己六个问题：第一笔客户款到账前，要先垫多少钱？客户真正付款的日期有多可靠？这段时间哪些账单必须支付？预计最低现金余额是多少？如果客户迟付，会发生什么？把所有相关成本算进去后，报价还留有合理利润吗？\u003c/p>\n\u003cp>生意增长本身不是坏事。真正需要警惕的是，把“忙”当作“赚”，再把“赚”当作“有钱”。\u003c/p>\n\u003cp>\u003cstrong>日程表告诉你市场有没有需求；利润表告诉你业务表现如何；现金预测则告诉你，企业能不能按时履行眼前的责任。\u003c/strong>\u003c/p>\n\u003cp>能够长久经营的企业，需要同时看清这三件事。\u003c/p>"},"fr":{"title":"Pourquoi une entreprise peut être débordée et manquer quand même de liquidités","body":"\u003cp>\u003cstrong>RUNLU KNOWLEDGE · RK-0007 · Adaptation française complète · Brouillon v0.1 · 2026-11-18\u003c/strong>\u003c/p>\n\u003cp>\u003cem>Information générale uniquement. Tous les personnages, entreprises et montants sont fictifs. Ce texte ne constitue pas un conseil comptable, fiscal, juridique ou de financement.\u003c/em>\u003c/p>\n\u003ch2>Un calendrier rempli, mais un compte presque vide\u003c/h2>\n\u003cp>Imaginons une petite entreprise de nettoyage commercial. Elle vient de signer deux contrats réguliers supplémentaires. Les équipes travaillent davantage, les prestations sont réalisées, les factures partent et le propriétaire prévoit un bénéfice. Pourtant, le vendredi venu, il manque de l'argent pour payer les salaires.\u003c/p>\n\u003cp>Comment peut-on avoir beaucoup de travail, et même réaliser un bénéfice, sans disposer des fonds nécessaires?\u003c/p>\n\u003cp>Parce que \u003cstrong>la prestation effectuée, le bénéfice comptabilisé et l'argent encaissé ne surviennent pas nécessairement au même moment\u003c/strong>. Un client peut devoir de l'argent sans l'avoir encore versé. Les employés et les fournisseurs, eux, ont des échéances.\u003c/p>\n\u003ch2>Quatre chiffres à ne pas confondre\u003c/h2>\n\u003cp>\u003cstrong>Chiffre d'affaires (revenue)\u003c/strong> : valeur des ventes ou services comptabilisés pour une période selon la méthode comptable applicable. Une facture émise ne prouve pas que le paiement est reçu.\u003c/p>\n\u003cp>\u003cstrong>Bénéfice (profit)\u003c/strong> : produits moins charges reconnus pour cette période. La reconnaissance comptable ne coïncide pas toujours avec les mouvements bancaires.\u003c/p>\n\u003cp>\u003cstrong>Encaissements (cash collected)\u003c/strong> : sommes réellement reçues. Une facture impayée constitue normalement une créance client, pas des fonds immédiatement disponibles.\u003c/p>\n\u003cp>\u003cstrong>Liquidités disponibles (cash available)\u003c/strong> : argent utilisable en tenant compte des obligations proches : salaires, fournisseurs, remboursements et versements fiscaux applicables. Un solde bancaire de 8 000 $ CA n'est pas nécessairement une somme entièrement libre d'emploi.\u003c/p>\n\u003cp>La Banque de développement du Canada (BDC) distingue ainsi la rentabilité et les flux de trésorerie : une entreprise rentable peut traverser une période de flux négatifs [1][2].\u003c/p>\n\u003ch2>Un bénéfice de 4 000 $, mais un manque de 3 000 $\u003c/h2>\n\u003cp>Voici une entreprise de nettoyage \u003cstrong>entièrement fictive\u003c/strong>, en dollars canadiens. Pour simplifier, nous utilisons un calcul de bénéfice d'exploitation de type comptabilité d'exercice, sans amortissement, intérêts, prélèvements du propriétaire, taxes de vente, provision d'impôt ni autres transactions. Il ne s'agit pas d'états financiers complets.\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Scrollable financial table\">\u003ctable>\u003ctr>\u003cth>Activité de novembre\u003c/th>\u003cth>Montant\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Services réalisés et facturés\u003c/td>\u003ctd>12 000 $\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Salaires associés\u003c/td>\u003ctd>−6 000 $\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fournitures et autres charges d'exploitation\u003c/td>\u003ctd>−2 000 $\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Bénéfice d'exploitation illustratif\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>4 000 $\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>Le client ne réglera toutefois les 12 000 $ que le \u003cstrong>15 décembre\u003c/strong>. Les 8 000 $ de salaires et de dépenses doivent être payés en novembre. Supposons que l'entreprise commence novembre avec 5 000 $ et ne reçoive aucun autre encaissement ce mois-là.\u003c/p>\n\u003cp>\u003cstrong>Trésorerie projetée : 5 000 $ + 0 $ − 8 000 $ = −3 000 $.\u003c/strong>\u003c/p>\n\u003cp>Ce résultat représente un \u003cstrong>besoin de financement prévisionnel\u003c/strong>, pas la possibilité de laisser librement le compte bancaire passer sous zéro. Sans facilité autorisée ou autre financement, il faudra agir avant les échéances : vérifier les encaissements, négocier des modalités licites, différer certaines dépenses ou examiner prudemment les solutions de financement.\u003c/p>\n\u003cp>Une facture bénéficiaire ne paie pas à elle seule les salaires.\u003c/p>\n\u003ch2>Le piège ordinaire des dates\u003c/h2>\n\u003cp>Un client règle à 30 ou 45 jours. Les employés sont payés toutes les deux semaines. Les fournitures sont achetées avant l'intervention. Le loyer arrive à date fixe. Un nouveau contrat augmente le chiffre d'affaires, mais peut aussi exiger des dépenses supplémentaires avant le premier encaissement.\u003c/p>\n\u003cp>Les \u003cstrong>créances clients (accounts receivable)\u003c/strong> correspondent aux montants dus par les clients. Les \u003cstrong>dettes fournisseurs (accounts payable)\u003c/strong> correspondent aux montants dus par l'entreprise. Aucune des deux catégories n'est synonyme de liquidités en banque.\u003c/p>\n\u003cp>La croissance peut donc accroître les besoins de trésorerie à court terme, surtout si les encaissements sont plus lents que les paiements.\u003c/p>\n\u003ch2>Un calendrier de trésorerie plutôt qu'un espoir\u003c/h2>\n\u003cp>Quand les liquidités sont serrées, actualisez une prévision glissante au moins chaque semaine :\u003c/p>\n\u003cp>\u003cstrong>Trésorerie de clôture prévue = trésorerie d'ouverture + encaissements attendus − décaissements prévus.\u003c/strong>\u003c/p>\n\u003cp>Voici un \u003cstrong>second exemple indépendant\u003c/strong> sur quatre semaines, toujours fictif, avec un solde initial de 5 000 $. Ces chiffres illustrent le calendrier des paiements et ne correspondent pas ligne par ligne au compte de résultat de novembre.\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Scrollable financial table\">\u003ctable>\u003ctr>\u003cth>Semaine\u003c/th>\u003cth>Ouverture\u003c/th>\u003cth>Encaissements\u003c/th>\u003cth>Paiements\u003c/th>\u003cth>Clôture prévue\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>5 000 $\u003c/td>\u003ctd>1 000 $\u003c/td>\u003ctd>2 000 $\u003c/td>\u003ctd>4 000 $\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>4 000 $\u003c/td>\u003ctd>0 $\u003c/td>\u003ctd>3 500 $\u003c/td>\u003ctd>500 $\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>500 $\u003c/td>\u003ctd>4 000 $\u003c/td>\u003ctd>2 500 $\u003c/td>\u003ctd>2 000 $\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>2 000 $\u003c/td>\u003ctd>3 000 $\u003c/td>\u003ctd>2 000 $\u003c/td>\u003ctd>3 000 $\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>Le solde le plus bas n'est que de \u003cstrong>500 $ en semaine 2\u003c/strong>. C'est ce point critique qu'un total mensuel pourrait masquer. Si le paiement attendu en semaine 3 arrive en retard, il faut recalculer immédiatement. Une rentrée prévue n'est pas une rentrée garantie.\u003c/p>\n\u003cp>BDC présente également la prévision glissante sur 13 semaines comme outil de gestion de la trésorerie [4]. Une feuille simple suffit pour commencer, à condition de la mettre à jour.\u003c/p>\n\u003ch2>Sept habitudes utiles\u003c/h2>\n\u003col>\u003cli>\u003cstrong>Facturer rapidement et correctement\u003c/strong> après la prestation.\u003c/li>\u003cli>\u003cstrong>Connaître les conditions et les comportements de paiement réels\u003c/strong>, sans confondre « net 30 jours » et paiement certain au trentième jour.\u003c/li>\u003cli>\u003cstrong>Examiner les créances chaque semaine\u003c/strong> et traiter tôt retards, litiges et approbations manquantes.\u003c/li>\u003cli>\u003cstrong>Inscrire les sorties prévisibles au calendrier\u003c/strong> : paie, fournisseurs, loyer, emprunts, équipements et obligations fiscales applicables, à confirmer avec un professionnel qualifié.\u003c/li>\u003cli>\u003cstrong>Constituer une réserve lorsque c'est possible\u003c/strong>, adaptée à la variabilité des dépenses et encaissements.\u003c/li>\u003cli>\u003cstrong>Tester un scénario défavorable\u003c/strong>, notamment un client majeur qui paie deux semaines plus tard.\u003c/li>\u003cli>\u003cstrong>Distinguer un décalage temporaire d'un problème de marge\u003c/strong> : financer une créance tardive et financer une activité structurellement déficitaire sont deux décisions différentes.\u003c/li>\u003c/ol>\n\u003ch2>Beaucoup de travail ne signifie pas toujours bénéfice\u003c/h2>\n\u003cp>Deux problèmes peuvent se ressembler. Dans le premier, les contrats dégagent une marge raisonnable, mais l'argent arrive trop tard. Dans le second, les prix sont trop bas ou les coûts réels — main-d'œuvre, déplacements, usure du matériel, administration — sont sous-estimés.\u003c/p>\n\u003cp>Le calendrier de trésorerie répond à « quand faudra-t-il payer? ». L'analyse du résultat répond à « ce travail est-il réellement rentable? ». Il faut examiner les deux avant d'accepter un gros contrat.\u003c/p>\n\u003ch2>Vérification en cinq minutes\u003c/h2>\n\u003cp>Avant de promettre une nouvelle prestation, demandez-vous : combien faudra-t-il dépenser avant le premier encaissement? Quand ce paiement arrivera-t-il vraisemblablement? Quelles échéances tombent entre-temps? Quel sera le solde minimal? Que se passera-t-il en cas de retard? Le prix couvre-t-il réellement les coûts et laisse-t-il une marge acceptable?\u003c/p>\n\u003cp>La croissance n'est pas le danger. Le danger consiste à confondre \u003cstrong>activité, bénéfice et argent disponible\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Le calendrier des interventions révèle la demande; le résultat comptable mesure la performance selon une méthode donnée; la prévision de trésorerie aide à savoir si l'entreprise pourra honorer ses engagements à temps.\u003c/strong>\u003c/p>"},"es":{"title":"Por qué un negocio puede estar muy ocupado y aun así quedarse sin efectivo","body":"\u003cp>\u003cstrong>RUNLU KNOWLEDGE · RK-0007 · Adaptación española completa · Borrador v0.1 · 2026-11-18\u003c/strong>\u003c/p>\n\u003cp>\u003cem>Este artículo ofrece información general. La empresa, las personas y todas las cifras son ficticias. No constituye asesoramiento contable, fiscal, financiero ni jurídico.\u003c/em>\u003c/p>\n\u003ch2>La agenda está llena, pero la cuenta casi vacía\u003c/h2>\n\u003cp>Imaginemos una pequeña empresa de limpieza comercial. Su propietario acaba de conseguir dos clientes habituales más. El personal trabaja más horas, los servicios se prestan, las facturas se envían y, según los cálculos, los contratos dejan beneficios. Sin embargo, llega el viernes, toca pagar las nóminas y no hay suficiente dinero en la cuenta.\u003c/p>\n\u003cp>¿Cómo puede un negocio tener mucho trabajo, e incluso obtener beneficios, y quedarse sin efectivo?\u003c/p>\n\u003cp>Porque \u003cstrong>realizar el trabajo, reconocer el beneficio y cobrar al cliente son acontecimientos distintos\u003c/strong>. Una factura emitida no significa que el dinero haya llegado. Los sueldos y los proveedores tienen fechas de pago que no esperan a que el cliente liquide su deuda.\u003c/p>\n\u003ch2>Cuatro cifras que cuentan historias distintas\u003c/h2>\n\u003cp>\u003cstrong>Ingresos (revenue):\u003c/strong> valor de las ventas o servicios reconocidos durante un período conforme al método contable utilizado. Emitir una factura no demuestra que se haya cobrado.\u003c/p>\n\u003cp>\u003cstrong>Beneficio (profit):\u003c/strong> ingresos menos costes y gastos reconocidos en ese período. Las fechas contables pueden diferir de las fechas de cobro y pago.\u003c/p>\n\u003cp>\u003cstrong>Efectivo cobrado (cash collected):\u003c/strong> dinero recibido realmente. Una factura pendiente suele ser una cuenta por cobrar, no efectivo disponible.\u003c/p>\n\u003cp>\u003cstrong>Efectivo disponible (cash available):\u003c/strong> dinero que puede utilizarse teniendo en cuenta las obligaciones próximas: nóminas, proveedores, préstamos y pagos tributarios aplicables. Tener 8.000 CAD en el banco no significa necesariamente poder gastar los 8.000 libremente.\u003c/p>\n\u003cp>El Banco de Desarrollo de Canadá (BDC) distingue la rentabilidad del flujo de caja: un negocio rentable puede atravesar períodos con flujo de caja negativo [1][2].\u003c/p>\n\u003ch2>Ganar 4.000 CAD y necesitar otros 3.000\u003c/h2>\n\u003cp>Veamos una empresa de limpieza \u003cstrong>completamente hipotética\u003c/strong>. Todas las cifras están expresadas en dólares canadienses. Para simplificar, usamos un cálculo de beneficio operativo similar al de la contabilidad por devengo, sin depreciación, intereses, retiradas del propietario, impuestos sobre ventas, provisión por impuesto sobre la renta ni otras operaciones. No es un estado financiero completo.\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Scrollable financial table\">\u003ctable>\u003ctr>\u003cth>Actividad de noviembre\u003c/th>\u003cth>Importe\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Servicios prestados y facturados\u003c/td>\u003ctd>12.000 CAD\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Costes salariales relacionados\u003c/td>\u003ctd>−6.000 CAD\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Materiales y otros gastos operativos\u003c/td>\u003ctd>−2.000 CAD\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Beneficio operativo ilustrativo\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>4.000 CAD\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>Pero el cliente pagará los 12.000 CAD el \u003cstrong>15 de diciembre\u003c/strong>, mientras que los 8.000 CAD de salarios y gastos vencen en noviembre. Supongamos que el negocio comienza noviembre con 5.000 CAD en efectivo y no recibe otros cobros ese mes.\u003c/p>\n\u003cp>\u003cstrong>Saldo proyectado: 5.000 + 0 − 8.000 = −3.000 CAD.\u003c/strong>\u003c/p>\n\u003cp>Los 3.000 CAD negativos representan una \u003cstrong>necesidad prevista de financiación\u003c/strong>, no la posibilidad de dejar una cuenta bancaria en descubierto sin autorización. Si no existe una línea aprobada u otra fuente de fondos, el propietario deberá actuar antes del vencimiento: revisar los cobros, acordar condiciones de pago legítimas, posponer gastos cuando sea posible o evaluar con prudencia la financiación.\u003c/p>\n\u003cp>Una factura rentable no paga por sí sola la nómina.\u003c/p>\n\u003ch2>La trampa cotidiana de los plazos\u003c/h2>\n\u003cp>Un cliente puede pagar a 30 o 45 días. Los empleados cobran cada dos semanas. Los materiales se compran antes del servicio. El alquiler vence en una fecha fija. Un nuevo contrato aumenta los ingresos, pero también puede exigir más mano de obra antes de recibir el primer pago.\u003c/p>\n\u003cp>Las \u003cstrong>cuentas por cobrar (accounts receivable)\u003c/strong> representan lo que deben los clientes. Las \u003cstrong>cuentas por pagar (accounts payable)\u003c/strong> representan lo que la empresa debe a proveedores. Ninguna equivale al efectivo que ya está en el banco.\u003c/p>\n\u003cp>Por eso, crecer puede aumentar las necesidades de capital circulante a corto plazo. Más contratos no siempre significan más tranquilidad inmediata.\u003c/p>\n\u003ch2>Un calendario de caja vale más que una suposición optimista\u003c/h2>\n\u003cp>Cuando el efectivo escasea, prepare una previsión móvil y actualícela al menos semanalmente:\u003c/p>\n\u003cp>\u003cstrong>Efectivo final previsto = efectivo inicial + cobros esperados − pagos previstos.\u003c/strong>\u003c/p>\n\u003cp>Las fechas importan tanto como las cantidades. Este es un \u003cstrong>segundo ejemplo independiente\u003c/strong> de cuatro semanas, con 5.000 CAD iniciales. Sirve para ilustrar los plazos y no reproduce línea por línea el resultado de noviembre anterior.\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Scrollable financial table\">\u003ctable>\u003ctr>\u003cth>Semana\u003c/th>\u003cth>Efectivo inicial\u003c/th>\u003cth>Cobros esperados\u003c/th>\u003cth>Pagos previstos\u003c/th>\u003cth>Efectivo final\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>5.000\u003c/td>\u003ctd>1.000\u003c/td>\u003ctd>2.000\u003c/td>\u003ctd>4.000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>4.000\u003c/td>\u003ctd>0\u003c/td>\u003ctd>3.500\u003c/td>\u003ctd>500\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>500\u003c/td>\u003ctd>4.000\u003c/td>\u003ctd>2.500\u003c/td>\u003ctd>2.000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>2.000\u003c/td>\u003ctd>3.000\u003c/td>\u003ctd>2.000\u003c/td>\u003ctd>3.000\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>Todas las cifras están en CAD. Aunque al final de la cuarta semana quedarían 3.000 CAD, el punto más delicado es la \u003cstrong>segunda semana, con solo 500 CAD\u003c/strong>. Un resumen mensual podría ocultarlo. Si el cobro previsto para la tercera semana se retrasa, hay que actualizar toda la previsión. Un cobro esperado no es dinero garantizado.\u003c/p>\n\u003cp>BDC también explica el uso de previsiones móviles de 13 semanas para gestionar la liquidez [4]. Una hoja de cálculo sencilla puede ser suficiente al principio, siempre que se mantenga al día.\u003c/p>\n\u003ch2>Siete hábitos prácticos\u003c/h2>\n\u003col>\u003cli>\u003cstrong>Facturar con rapidez y precisión\u003c/strong> después de completar el trabajo.\u003c/li>\u003cli>\u003cstrong>Conocer las condiciones y los hábitos reales de pago.\u003c/strong> «Neto a 30 días» no garantiza cobrar exactamente ese día.\u003c/li>\u003cli>\u003cstrong>Revisar semanalmente las cuentas por cobrar\u003c/strong>, identificando retrasos, aprobaciones pendientes y disputas.\u003c/li>\u003cli>\u003cstrong>Anotar todos los pagos previsibles:\u003c/strong> nóminas, proveedores, alquiler, préstamos, equipos y obligaciones tributarias aplicables; confirmar las reglas concretas con un profesional.\u003c/li>\u003cli>\u003cstrong>Crear una reserva de efectivo cuando sea posible\u003c/strong>, adaptada a los costes y a la variabilidad del negocio.\u003c/li>\u003cli>\u003cstrong>Probar un escenario desfavorable:\u003c/strong> ¿qué ocurre si el cliente principal paga dos semanas tarde?\u003c/li>\u003cli>\u003cstrong>Distinguir un problema de calendario de un problema de margen.\u003c/strong> Financiar un cobro tardío no es lo mismo que sostener una actividad que pierde dinero de forma habitual.\u003c/li>\u003c/ol>\n\u003ch2>Estar ocupado tampoco garantiza ganar dinero\u003c/h2>\n\u003cp>Dos problemas pueden parecer iguales. En el primero, los trabajos tienen un margen razonable, pero los clientes pagan después de que venzan los gastos. En el segundo, los precios son demasiado bajos o se omiten costes reales como transporte, tiempo administrativo, desgaste de equipos o mano de obra.\u003c/p>\n\u003cp>El calendario de caja responde: «¿Cuándo hará falta el dinero?». El análisis de resultados responde: «¿Vale realmente la pena aceptar este trabajo?». Antes de asumir un contrato importante, conviene responder ambas preguntas.\u003c/p>\n\u003ch2>Una revisión de cinco minutos\u003c/h2>\n\u003cp>Antes de aceptar otro contrato, pregúntese: ¿cuánto efectivo necesitaré antes del primer cobro? ¿Cuándo espero recibirlo de verdad? ¿Qué pagos vencen mientras tanto? ¿Cuál será el saldo mínimo previsto? ¿Qué pasa si el cliente se retrasa? ¿Queda un margen adecuado después de todos los costes relevantes?\u003c/p>\n\u003cp>Crecer no es el problema. El problema es confundir \u003cstrong>tener trabajo, obtener beneficios y disponer de efectivo\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>La agenda muestra la demanda; la cuenta de resultados mide el desempeño según un método contable; la previsión de caja ayuda a saber si el negocio podrá cumplir sus obligaciones a tiempo.\u003c/strong>\u003c/p>"}};const labels={en:["Draft for editorial review. Not approved for publication. All examples are fictional.","Internal preview only. No professional review or publication approval has been recorded."],zh:["仅供内部编辑验收，尚未批准发布。所有案例均为虚构。","内部预览版；尚未完成全部核验及发布批准。"],fr:["Brouillon pour examen éditorial, non approuvé pour publication. Exemples fictifs.","Aperçu interne uniquement. Validation et autorisation de publication en attente."],es:["Borrador para revisión editorial; publicación no autorizada. Ejemplos ficticios.","Vista previa interna. Pendientes la revisión y autorización de publicación."]};const select=document.getElementById("lang");function render(){const l=select.value,d=COPY[l];document.documentElement.lang=l==="zh"?"zh-Hans":l;document.getElementById("title").textContent=d.title;document.getElementById("content").innerHTML=d.body;document.getElementById("content").lang=l;document.getElementById("disclaimer").textContent=labels[l][0];document.getElementById("footerText").textContent=labels[l][1];if(location.protocol==="http:"||location.protocol==="https:"){const u=new URL(location.href);u.searchParams.set("lang",l);history.replaceState(null,"",u)}}select.addEventListener("change",render);const query=new URLSearchParams(location.search).get("lang");select.value=COPY[query]?query:"en";render();</script></body></html>
