<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow"><title>RUNLU KNOWLEDGE — Practical Knowledge</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#24352f;background:#f7f4ed}*{box-sizing:border-box}
body{margin:0}header,main,footer{max-width:1050px;margin:auto;padding:24px}header{border-bottom:1px solid #d9d8cf}
h1{font-size:clamp(2rem,5vw,3.3rem);margin:12px 0}p{line-height:1.65}.eyebrow{letter-spacing:.13em;text-transform:uppercase;font-size:.8rem;color:#60786a}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0}input,select,button{font:inherit;padding:12px;border:1px solid #b8c6bc;border-radius:9px;background:white;color:#24352f}
input{flex:2;min-width:220px}select{flex:1;min-width:140px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
article{background:#fff;border:1px solid #e0e2db;border-radius:14px;padding:20px}article h2{font-size:1.2rem;margin:6px 0 10px}
.meta{font-size:.8rem;color:#53665b}.tag{display:inline-block;padding:4px 8px;border-radius:20px;background:#e9f0e9;margin-right:6px}
a{color:#236c61;overflow-wrap:anywhere}footer{font-size:.85rem;color:#5a695f}.home-nav{display:inline-block;margin:0 0 18px;font-weight:650;text-decoration:underline;text-underline-offset:3px}button{cursor:pointer}
</style></head><body><header><a class="home-nav" href="../" id="homeLink">← RUNLU · Home / 返回主页</a><div class="eyebrow">RUNLU · 润庐 / Knowledge in progress</div><h1>RUNLU KNOWLEDGE<span style="font-size:.5em;vertical-align:top">™</span></h1>
<p id="intro">Global knowledge. Local relevance.</p><label for="languageToggle">Language / 语言</label> <select id="languageToggle" class="language-select" data-runlu-language-select aria-label="Choose site language"><option value="en">English</option><option value="zh">中文</option><option value="fr">Français</option><option value="es">Español</option></select></header>
<main><div class="controls"><input id="search" type="search" placeholder="Search knowledge..." aria-label="Search"><select id="region" aria-label="Region"></select><select id="category" aria-label="Category"></select></div>
<section id="guides" aria-label="Practical guides"><h2 id="guides-heading"></h2><div class="cards" id="guides-results"></div></section><section id="verified-records" aria-label="Verified reference records"><h2 id="records-heading"></h2><p id="records-explainer"></p><p id="count" role="status"></p><div id="results" class="cards" aria-label="Knowledge entries"></div></section><section id="editorial" aria-label="Published editorial essays" hidden><h2 id="editorial-heading"></h2><div id="editorial-results" class="cards"></div></section></main>
<footer><p id="notice">RUNLU KNOWLEDGE publishes reviewed original summaries and factual references. Reuse of protected third-party content requires an appropriate rights basis.</p></footer>
<script>
const UI={
en:{intro:"Global knowledge. Local relevance.",search:"Search knowledge...",allRegions:"All regions",allCategories:"All categories",count:n=>n+" verified records",source:"Reference",empty:"No matching entries.",notice:"Reviewed original summaries and factual references. Reusing protected third-party material requires an appropriate rights basis."},
zh:{intro:"全球知识，本地适用。",search:"搜索知识条目...",allRegions:"全部地区",allCategories:"全部分类",count:n=>n+" 条独立核验记录",source:"参考来源",empty:"没有匹配的条目。",notice:"仅展示经审核的原创摘要与事实参考。转载第三方受保护内容须确认合法使用依据。"},
fr:{intro:"Savoirs mondiaux, pertinence locale.",search:"Rechercher...",allRegions:"Toutes les régions",allCategories:"Toutes les catégories",count:n=>n+" fiches vérifiées",source:"Référence",empty:"Aucun résultat.",notice:"Résumés originaux vérifiés et références factuelles. Toute reproduction de contenus protégés exige une base juridique appropriée."},
es:{intro:"Conocimiento global, relevancia local.",search:"Buscar...",allRegions:"Todas las regiones",allCategories:"Todas las categorías",count:n=>n+" fichas verificadas",source:"Referencia",empty:"Sin resultados.",notice:"Resúmenes originales revisados y referencias a hechos. Reutilizar contenido protegido requiere una base legal adecuada."}
};
// Public dataset only. Draft and inbox records must never be rendered here.
let entries=[];
let loadError=false;
async function loadPublished(){
 try{
  const response=await fetch("./data/published.json",{cache:"no-store"});
  if(!response.ok)throw new Error("HTTP "+response.status);
  const dataset=await response.json();
  if(!dataset||!Array.isArray(dataset.entries))throw new Error("Invalid dataset");
  loadError=false;
  entries=dataset.entries.filter(e=>e.status==="published"&&e.review?.facts_verified===true&&e.review?.license_verified===true&&e.review?.translations_verified===true&&Boolean(e.review?.reviewer?.trim())&&Boolean(e.review?.translation_reviewer?.trim())&&Boolean(e.review?.evidence_ref?.trim())&&/^\d{4}-\d{2}-\d{2}$/.test(e.review?.reviewed_at||"")&&["en","zh","fr","es"].every(l=>Boolean(e.titles?.[l]?.trim()&&e.summaries?.[l]?.trim()))&&Array.isArray(e.sources)&&e.sources.length>0&&e.sources.every(src=>{const validUrl=typeof src.url==="string"&&src.url.startsWith("https://");const hasBasis=Boolean(src.rights_basis?.trim()&&src.rights_evidence?.trim());return validUrl&&Boolean(src.publisher?.trim())&&hasBasis&&(src.use_type==="factual_reference"?(src.license_status==="unknown"||src.license_status==="permitted"):src.license_status==="permitted")})&&e.titles?.en&&e.summaries?.en);
  render();
 }catch(err){
  entries=[];
  loadError=true;
  render();
  console.error("RUNLU Knowledge dataset error",err);
 }
}
const RECORD_LABELS={
en:{heading:"Verified reference records",explain:"This separate catalog counts independently verified data records only. The published guide above is not included.",empty:"No independently verified data records have been released yet. The published guide above remains available."},
zh:{heading:"独立核验资料记录",explain:"此处单独统计完成严格核验的数据型知识记录；上方已出版的实用文章不计入此项。",empty:"目前尚未发布完成独立核验的数据型知识记录；上方实用文章已可正常阅读。"},
fr:{heading:"Fiches de référence vérifiées",explain:"Ce catalogue distinct compte uniquement les fiches de données vérifiées indépendamment, et non le guide publié ci-dessus.",empty:"Aucune fiche de données vérifiée indépendamment n'est encore publiée. Le guide ci-dessus reste accessible."},
es:{heading:"Fichas de referencia verificadas",explain:"Este catálogo independiente cuenta solo fichas de datos verificadas, no la guía publicada arriba.",empty:"Todavía no se han publicado fichas de datos verificadas de forma independiente. La guía anterior sigue disponible."}
};
const GUIDES=[
{id:"RK-0006",titles:{en:"Why on-hand stock cannot always be promised to a new order",zh:"为什么账面有库存，却不能承诺给新订单？",fr:"Pourquoi un stock physiquement présent n’est pas toujours disponible pour une nouvelle commande",es:"Por qué las existencias físicas no siempre están disponibles para un nuevo pedido"},summaries:{en:"A practical guide to committed, restricted and available carpet inventory.",zh:"分清现存库存、已承诺数量、受限材料与真正可用的库存。",fr:"Distinguer stock physique, engagements, restrictions et disponibilité.",es:"Distinguir existencias físicas, compromisos, restricciones y disponibilidad."}},
{id:"RK-0007",titles:{en:"Why Your Business Can Be Busy but Still Run Out of Cash",zh:"为什么生意很忙，手里却没有钱？",fr:"Pourquoi une entreprise peut être débordée et manquer quand même de liquidités",es:"Por qué un negocio puede estar muy ocupado y aun así quedarse sin efectivo"},summaries:{en:"Understand the difference between revenue, profit and cash with a fictional cleaning-business example.",zh:"通过虚构的清洁公司案例，分清营业收入、利润与现金流。",fr:"Comprendre la différence entre chiffre d’affaires, bénéfice et liquidités grâce à un exemple fictif.",es:"Entienda la diferencia entre ingresos, beneficios y efectivo con un ejemplo ficticio."}},
{"id":"RK-0008","titles":{"en":"Why a Profitable Quote Can Turn Into a Losing Job","zh":"为什么报价看着有利润，订单做完却亏了钱？","fr":"Pourquoi un devis rentable peut devenir une prestation déficitaire","es":"Por qué un presupuesto rentable puede terminar en un trabajo con pérdidas"},"summaries":{"en":"Compare estimated and actual job costs, identify lost margins and improve future quotes.","zh":"对比预计与实际项目成本，找出利润流失的原因，改善下一次报价。","fr":"Comparez les coûts prévus et réels, identifiez les pertes de marge et améliorez vos prochains devis.","es":"Compare los costes previstos y reales, identifique la pérdida de margen y mejore sus próximos presupuestos."}}
];
const GUIDE_UI={en:{heading:"Published practical guides",read:"Read guide"},zh:{heading:"已出版实用指南",read:"阅读文章"},fr:{heading:"Guides pratiques publiés",read:"Lire l’article"},es:{heading:"Guías prácticas publicadas",read:"Leer artículo"}};
function renderGuides(lang,q){const t=GUIDE_UI[lang],section=$("guides"),list=$("guides-results");const matches=GUIDES.filter(g=>!q||(g.titles[lang]+" "+g.summaries[lang]+" "+g.id).toLocaleLowerCase().includes(q));$("guides-heading").textContent=t.heading+" ("+GUIDES.length+")";section.hidden=!matches.length;list.replaceChildren();for(const g of matches){const card=document.createElement("article"),h=document.createElement("h2"),p=document.createElement("p"),a=document.createElement("a");h.textContent=g.titles[lang];p.textContent=g.summaries[lang];a.textContent=t.read;a.href="./articles/"+g.id+".html?lang="+encodeURIComponent(lang);card.append(h,p,a);list.appendChild(card)}}
const EDITORIAL_ID="when-science-meets-the-unknown";
let editorialManifest=null;
async function loadEditorial(){try{const response=await fetch("./essays/"+EDITORIAL_ID+"/manifest.json",{cache:"no-store"});if(!response.ok)throw new Error("Manifest unavailable");const m=await response.json();if(m.id===EDITORIAL_ID&&m.status==="published"&&m.publication?.approved===true&&m.review?.facts_verified===true&&m.review?.translations_verified===true&&m.review?.rights_verified===true&&["zh","en","fr","es"].every(l=>Boolean(m.titles?.[l]&&m.subtitles?.[l])))editorialManifest=m;}catch(err){console.warn("Editorial catalog unavailable",err)}render();}
const editorialLabels={zh:"已出版原创文章",en:"Published original essays",fr:"Essais originaux publiés",es:"Ensayos originales publicados"};
const editorialRead={zh:"阅读文章",en:"Read essay",fr:"Lire l’essai",es:"Leer ensayo"};
const homeLabels={zh:"← 返回润庐主页",en:"← Back to RUNLU home",fr:"← Retour à l’accueil RUNLU",es:"← Volver al inicio de RUNLU"};
const regions={global:{en:"Global",zh:"全球",fr:"Monde",es:"Global"},europe:{en:"Europe",zh:"欧洲",fr:"Europe",es:"Europa"},"north-america":{en:"North America",zh:"北美",fr:"Amérique du Nord",es:"Norteamérica"}};
const categories={construction:{en:"Construction",zh:"建筑与地材",fr:"Construction",es:"Construcción"},economy:{en:"Economy",zh:"经济",fr:"Économie",es:"Economía"},research:{en:"Research",zh:"科研",fr:"Recherche",es:"Investigación"},careers:{en:"Careers",zh:"职业",fr:"Métiers",es:"Profesiones"}};
const $=id=>document.getElementById(id);const safe=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function renderEditorial(lang,q){const section=$("editorial"),list=$("editorial-results");if(!editorialManifest){section.hidden=true;return}section.hidden=false;$("editorial-heading").textContent=editorialLabels[lang];const title=editorialManifest.titles[lang],subtitle=editorialManifest.subtitles[lang];const matches=!q||(title+" "+subtitle+" "+EDITORIAL_ID).toLocaleLowerCase().includes(q);list.replaceChildren();if(!matches){const p=document.createElement("p");p.textContent=UI[lang].empty;list.appendChild(p);return}const card=document.createElement("article"),h=document.createElement("h2"),p=document.createElement("p"),a=document.createElement("a");h.textContent=title;p.textContent=subtitle;a.textContent=editorialRead[lang];a.href="./essay.html?id="+encodeURIComponent(EDITORIAL_ID)+"&lang="+encodeURIComponent(lang);card.append(h,p,a);list.appendChild(card)}
function render(){const lang=$("languageToggle").value,t=UI[lang],region=$("region").value,category=$("category").value,q=$("search").value.toLocaleLowerCase();
$("records-heading").textContent=RECORD_LABELS[lang].heading;$("records-explainer").textContent=RECORD_LABELS[lang].explain;
$("homeLink").textContent=homeLabels[lang];$("intro").textContent=t.intro;$("search").placeholder=t.search;$("notice").textContent=t.notice;
const setOptions=(id,all,map,selected)=>{$(id).innerHTML='<option value="">'+safe(all)+'</option>'+Object.keys(map).map(k=>'<option value="'+safe(k)+'">'+safe(map[k][lang])+'</option>').join("");$(id).value=selected};
setOptions("region",t.allRegions,regions,region);setOptions("category",t.allCategories,categories,category);
if(loadError){$("count").textContent="Unable to load published knowledge records."; $("results").textContent="Knowledge data could not be loaded. Please try again later.";return}
renderEditorial(lang,q);renderGuides(lang,q);
const hits=entries.filter(e=>(!region||e.scope?.type==="global"&&region==="global"||e.scope?.codes?.includes(region))&&(!category||e.category===category)&&(!q||Object.values(e.titles||{}).concat(Object.values(e.summaries||{}),e.id).join(" ").toLocaleLowerCase().includes(q)));
$("count").textContent=t.count(hits.length);
$("results").innerHTML=!entries.length?'<p>'+safe(RECORD_LABELS[lang].empty)+'</p>':hits.length?hits.map(e=>'<article><div class="meta">'+safe(e.id)+'</div><h2>'+safe(e.titles[lang]||e.titles.en)+'</h2><div class="meta"><span class="tag">'+safe(categories[e.category]?.[lang]||e.category)+'</span><span class="tag">'+safe(e.scope?.type==="global"?regions.global[lang]:(e.scope?.codes||[]).join(", "))+'</span></div><p>'+safe(e.summaries[lang]||e.summaries.en)+'</p><a href="'+safe(e.sources[0].url)+'" target="_blank" rel="noopener noreferrer">'+safe(t.source)+'</a></article>').join(""):'<p>'+safe(t.empty)+'</p>';
document.documentElement.lang=lang==="zh"?"zh-Hans":lang;
}
["region","category"].forEach(id=>$(id).addEventListener("change",render));$("languageToggle").addEventListener("change",()=>{const lang=$("languageToggle").value;if(window.RUNLULanguage?.set)window.RUNLULanguage.set(lang);render()});$("search").addEventListener("input",render);window.addEventListener("runlu:languagechange",event=>{const lang=event.detail?.language;if(lang&&UI[lang])$("languageToggle").value=lang;render()});render();loadPublished();loadEditorial();
</script><script src="../runlu-language.js?v=2.2"></script><script>if(window.RUNLULanguage){const lang=window.RUNLULanguage.get();if(UI[lang]){document.getElementById("languageToggle").value=lang;render()}}</script></body></html>
