<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>RUNLU KNOWLEDGE — Standalone Preview</title>
<style>:root{font-family:system-ui,-apple-system,sans-serif;color:#24352f;background:#f7f4ed}*{box-sizing:border-box}body{margin:0 auto;max-width:900px;padding:clamp(18px,5vw,50px)}h1{font-size:clamp(2rem,5vw,3rem)}.tag{font-size:.8rem;letter-spacing:.1em;color:#60786a}p{line-height:1.7}select,input{font:inherit;padding:12px;border:1px solid #b8c6bc;border-radius:8px;background:white;max-width:100%}.panel{background:white;border:1px solid #dfe5dc;border-radius:16px;padding:22px;margin-top:20px}label{display:block;margin-bottom:8px}a{color:#236c61}footer{margin-top:35px;font-size:.85rem;color:#60786a}</style></head>
<body><div class="tag">RUNLU · 润庐 / NON-PRODUCTION PREVIEW</div><h1>RUNLU KNOWLEDGE™</h1><label for="previewLang">Language / 语言</label><select id="previewLang" class="language-select" data-runlu-language-select aria-label="Choose site language"><option value="en">English</option><option value="zh">中文</option><option value="fr">Français</option><option value="es">Español</option></select><p id="intro"></p><div class="panel"><label for="search" id="searchLabel"></label><input id="search" type="search" disabled><p id="empty"></p></div><footer id="foot"></footer>
<script>
const translations={
en:{intro:"Global knowledge. Local relevance.",search:"Search published knowledge",empty:"The knowledge library is being prepared. No reviewed records have been published yet.",foot:"Preview only. No draft records are published. This preview publishes no draft records."},
zh:{intro:"全球知识，本地适用。",search:"搜索已发布知识",empty:"知识库正在建设中，目前尚无完成审核并公开发布的知识条目。",foot:"仅供预览。内部草稿不会公开，本独立页面未连接正式网站。"},
fr:{intro:"Des connaissances mondiales, une pertinence locale.",search:"Rechercher les connaissances publiées",empty:"La bibliothèque est en préparation. Aucune fiche vérifiée n’a encore été publiée.",foot:"Aperçu uniquement. Aucun brouillon n'est publié. Cette page n'est pas connectée au site de production."},
es:{intro:"Conocimiento global, relevancia local.",search:"Buscar conocimientos publicados",empty:"La biblioteca está en preparación. Aún no se han publicado fichas verificadas.",foot:"Solo vista previa. No se publican borradores. Esta página no está conectada al sitio de producción."}};
function render(){const lang=document.getElementById("previewLang").value;const t=translations[lang];document.documentElement.lang=lang==="zh"?"zh-Hans":lang;for(const k of ["intro","empty"]){document.getElementById(k).textContent=t[k]}document.getElementById("searchLabel").textContent=t.search;document.getElementById("search").placeholder=t.search;document.getElementById("foot").textContent=t.foot}
document.getElementById("previewLang").addEventListener("change",render);window.addEventListener("runlu:languagechange",()=>{const next=localStorage.getItem("runlu-language");if(next&&translations[next]){document.getElementById("previewLang").value=next;render()}});render();
</script><script src="../runlu-language.js?v=2.2"></script></body></html>
