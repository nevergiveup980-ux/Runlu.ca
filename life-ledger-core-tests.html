<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUNLU Life Ledger Core Tests</title><style>body{margin:0;background:#f4f7fa;color:#132235;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:820px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid #dce5ec;border-radius:18px;padding:18px;box-shadow:0 12px 34px rgba(19,43,67,.06)}h1{margin-top:0}.ok{color:#087a5a}.bad{color:#b33}.row{padding:10px 0;border-bottom:1px solid #edf1f4}.row:last-child{border-bottom:0}pre{background:#f7f9fb;border:1px solid #e2e8ee;border-radius:12px;padding:12px;overflow:auto}</style></head><body><main><div class="card"><h1>Life Ledger V2 Core Self-Tests</h1><p>These tests use fictional values only.</p><div id="results"></div><pre id="summary"></pre></div></main><script src="life-ledger-core-v2.js"></script><script>'use strict';const C=RUNLU_LEDGER_CORE;let pass=0,fail=0;function test(name,fn){let ok=false,msg='';try{ok=!!fn()}catch(e){msg=e.message}if(ok)pass++;else fail++;results.insertAdjacentHTML('beforeend',`<div class="row ${ok?'ok':'bad'}"><b>${ok?'✓':'✗'} ${name}</b>${msg?`<div>${msg}</div>`:''}</div>`)}let entries=[{id:'i1',date:'2026-09-01',type:'Income',item:'Salary',category:'Income',account:'Checking',amount:4500,note:''},{id:'e1',date:'2026-09-02',type:'Expense',item:'Groceries',category:'Food',account:'Card',amount:162.4,note:''},{id:'e2',date:'2026-09-09',type:'Expense',item:'Groceries',category:'Food',account:'Card',amount:148.7,note:''}];test('Base totals are correct',()=>{const t=C.totals(entries,'2026-09');return t.income===4500&&t.expense===311.1&&t.balance===4188.9});let r=C.adjustVisibleTotal(entries,{item:'Groceries',year:2026,month:9,target:350,date:'2026-09-12',type:'Expense',category:'Food',account:'Card'});entries=r.entries;test('Set expense total upward creates +38.90 expense adjustment',()=>r.record.type==='Expense'&&r.record.adjustmentDelta===38.9);test('Expense adjustment does not inflate Income',()=>{const t=C.totals(entries,'2026-09');return t.income===4500&&t.expense===350&&t.balance===4150});r=C.adjustVisibleTotal(entries,{item:'Groceries',year:2026,month:9,target:300,date:'2026-09-13',type:'Expense',category:'Food',account:'Card'});entries=r.entries;test('Set expense total downward creates -50.00 expense adjustment',()=>r.record.type==='Expense'&&r.record.adjustmentDelta===-50);test('Lowering expense total still leaves Income unchanged',()=>{const t=C.totals(entries,'2026-09');return t.income===4500&&t.expense===300&&t.balance===4200});const beforeClear=C.totals(entries,'2026-09');r=C.clearVisibleTotal(entries,{item:'Groceries',year:2026,month:9,date:'2026-09-14',type:'Expense',category:'Food',account:'Card'});entries=r.entries;test('Clear expense uses Expense reversal, not fake Income',()=>r.record.type==='Expense'&&r.record.adjustmentDelta===-300);test('Clear expense makes Grocery zero without changing Income',()=>C.itemTotal(entries,{item:'Groceries',year:2026,month:9})===0&&C.totals(entries,'2026-09').income===beforeClear.income);const clearUndo=r.undo;entries=C.undo(entries,clearUndo);test('Undo restores exact expense total',()=>C.itemTotal(entries,{item:'Groceries',year:2026,month:9})===300);const rec=C.recurringPresentation(entries,{item:'Groceries',year:2026,month:9});test('Running total and W1-W5 are same underlying records',()=>C.round2(Object.values(rec.weeks).reduce((a,b)=>a+b,0))===rec.runningTotal&&rec.runningTotal===300);let incomeEntries=[{id:'s1',date:'2026-09-01',type:'Income',item:'Salary',category:'Income',account:'Checking',amount:4500}];r=C.clearVisibleTotal(incomeEntries,{item:'Salary',year:2026,month:9,date:'2026-09-30',type:'Income',category:'Income',account:'Checking'});incomeEntries=r.entries;test('Clear income uses Income reversal, not fake Expense',()=>r.record.type==='Income'&&r.record.adjustmentDelta===-4500&&C.totals(incomeEntries,'2026-09').expense===0);test('Validation catches no issues in canonical sample',()=>C.validate(entries).length===0);summary.textContent=`Core version: ${C.VERSION}\nPassed: ${pass}\nFailed: ${fail}\nStatus: ${fail?'BLOCKED':'PASS'}`;</script></body></html>
